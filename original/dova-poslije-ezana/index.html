function go(n){mode=n;idx=0;score=0;lock=false;order=[];matched=[];tabs();render()}
function head(title,sub=''){return `<h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}`}
function prog(n,total){return `<div class="sub">Zadatak ${n} / ${total} · Bodovi: ${score}</div><div class="progress"><div class="bar" style="width:${100*n/total}%"></div></div>`}
function toggleDova(){const a=$('rec');if(a.paused){a.play().catch(()=>{});}else{a.pause();}syncDova()}
function stopDova(){const a=$('rec');a.pause();a.currentTime=0;syncDova()}
function syncDova(){const b=$('listenBtn'),a=$('rec');if(!b)return;b.textContent=a.paused?'▶ SLUŠAJ DOVU':'⏸ PAUZIRAJ DOVU';b.classList.toggle('playing',!a.paused)}
document.addEventListener('DOMContentLoaded',()=>{const a=$('rec');a.addEventListener('play',syncDova);a.addEventListener('pause',syncDova);a.addEventListener('ended',syncDova)});
function audioPlay(){const a=$('rec');a.currentTime=0;a.play().catch(()=>{})}
function render(){let out='';if(mode===0){out=head('Nauči dovu uz MP3','Pritisni „SLUŠAJ DOVU” na vrhu, zatim pročitaj svaki dio i značenje.');S.forEach((x,i)=>out+=`<div class="line"><div class="sub">Dio ${i+1}</div><div class="arab">${esc(x[0])}</div><div class="meaning">${esc(x[1])}</div></div>`);out+=`<p class="note">Kada mujezin uči „Hajje ales-salah” i „Hajje alel-felah”, izgovaramo: „La havle ve la kuvvete illa billahil-alijjil-azim.”</p><button class="primary" onclick="go(1)">Počni vježbanje →</button>`}
else if(mode===1){out=head('Spoji dio dove sa značenjem','Dodirni jedan dio dove i odgovarajuće značenje.');out+=prog(matched.length,7);if(!current.length){current=[shuffle(S.map((s,i)=>i)),shuffle(S.map((s,i)=>i))]}out+=`<div class="choices"><div>${current[0].map(i=>`<button class="tile ${matched.includes(i)?'ok muted':''} ${pairLeft===i?'active':''}" ${matched.includes(i)?'disabled':''} onclick="pickPair(0,${i})">${esc(S[i][0])}</button>`).join('')}</div><div>${current[1].map(i=>`<button class="tile ${matched.includes(i)?'ok muted':''} ${pairRight===i?'active':''}" ${matched.includes(i)?'disabled':''} onclick="pickPair(1,${i})">${esc(S[i][1])}</button>`).join('')}</div></div><div class="status" id="status"></div>`}
else if(mode===2){out=head('Složi dovu redom','Dodiruj dijelove u pravilnom redoslijedu.');out+=prog(order.length,7);out+=`<div class="line"><b>Dosad složeno:</b><br>${order.map(i=>`<span class="pill">${esc(S[i][0])}</span>`).join('')||'Odaberi prvi dio dove.'}</div>`;if(!current.length)current=shuffle(S.map((_,i)=>i));out+=current.filter(i=>!order.includes(i)).map(i=>`<button class="tile" onclick="pickOrder(${i})">${esc(S[i][0])}</button>`).join('');out+=`<div class="status" id="status"></div><button onclick="order=[];current=[];render()">↻ Počni ispočetka</button>`}
else if(mode===3){out=head('Šta nedostaje?','Izaberi dio dove koji nedostaje.');out+=quizBlock(missingQ(idx),7)}
else if(mode===4){out=head('Prepoznaj po značenju','Pronađi odgovarajući dio dove.');out+=quizBlock(meaningQ(idx),7)}
else if(mode===5){out=head('Završni ispit · 30 pitanja','Tačan odgovor +10 · netačan −3 · automatski prelazak.');out+=quizBlock(Q[idx],30)}
$('section').innerHTML=out;}
function missingQ(i){const left=i?S[i-1][0]:'POČETAK DOVE',right=i<6?S[i+1][0]:'KRAJ DOVE';return [`Koji dio nedostaje?\n${left} → ❓ → ${right}`,S[i][0],shuffle(S.filter((_,j)=>j!==i).map(x=>x[0])).slice(0,3)]}
function meaningQ(i){return [`Koji dio dove znači: „${S[i][1]}”?`,S[i][0],shuffle(S.filter((_,j)=>j!==i).map(x=>x[0])).slice(0,3)]}
function quizBlock(q,total){if(idx>=total)return `<div class="line"><h2>🎉 Završeno!</h2><p>Osvojeno bodova: <b>${score}</b></p><button class="primary" onclick="go(${mode})">↻ Ponovi vježbu</button> <button onclick="go(${(mode+1)%6})">Sljedeća lekcija →</button></div>`;if(!current.length)current=shuffle([q[1],...q[2]]);return `${prog(idx+1,total)}<div class="line"><b>${esc(q[0]).replace(/\n/g,'<br>')}</b></div><div class="choices">${current.map((a,j)=>`<button id="opt${j}" onclick="answer(${j})">${esc(a)}</button>`).join('')}</div><div class="status" id="status"></div>`}
function answer(j){if(lock)return;lock=true;const q=mode===3?missingQ(idx):mode===4?meaningQ(idx):Q[idx],correct=current[j]===q[1];score+=correct?10:-3;tone(correct);$('opt'+j).classList.add(correct?'ok':'bad');if(!correct){for(let k=0;k<current.length;k++)if(current[k]===q[1])$('opt'+k).classList.add('ok')}$('status').textContent=correct?'✓ Tačno! +10':'✗ Netačno. −3';setTimeout(()=>{idx++;current=[];lock=false;render()},1150)}
function pickPair(side,i){if(matched.includes(i)||lock)return;if(side===0)pairLeft=i;else pairRight=i; if(pairLeft!==-1&&pairRight!==-1){const good=pairLeft===pairRight;tone(good);if(good){matched.push(i);score+=10}else score-=3;pairLeft=pairRight=-1;if(matched.length===7){lock=true;setTimeout(()=>{lock=false;current=[];render()},500)}else render()}else render()}
function pickOrder(i){if(lock)return;const good=i===order.length;tone(good);if(good){order.push(i);score+=10}else score-=3;render();$('status').textContent=good?'✓ Tačno! +10':'✗ Pokušaj ponovo. −3';if(order.length===7){lock=true;setTimeout(()=>{lock=false;$('status').textContent='🎉 Cijela dova je pravilno složena!'},250)}}
// Deterministic reset of per-activity randomized options.
const oldGo=go;go=function(n){current=[];pairLeft=pairRight=-1;oldGo(n)};
tabs();render();
</script></body></html>
