function sound(ok){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const t=ctx.currentTime;[0,1].forEach((v)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=ok?(v?880:660):(v?220:330);g.gain.setValueAtTime(.0001,t+v*.13);g.gain.exponentialRampToValueAtTime(.09,t+v*.13+.015);g.gain.exponentialRampToValueAtTime(.0001,t+v*.13+.12);o.connect(g);g.connect(ctx.destination);o.start(t+v*.13);o.stop(t+v*.13+.13)});setTimeout(()=>ctx.close(),600)}catch(e){}}

function end(){$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('counter').textContent='Gradnja završena';$('result').textContent=`Tačnih odgovora: ${correct} od ${deck.length}. Osvojeno ${correct*10} bodova. Izgrađeno ${Math.floor(correct/deck.length*16)} od 16 dijelova. ${correct===deck.length?'Izgradio/la si cijelu džamiju! 🕌':'Pokušaj ponovo da dovršiš cijelu džamiju!'}`}

$('start').onclick=start;$('again').onclick=start;$('total').onchange=start;
$('download').onclick=()=>{const content='<!doctype html>\n'+document.documentElement.outerHTML.replace(/^<!doctype html>\s*/i,'');const blob=new Blob([content],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='izgradi-svoju-dzamiju-A1.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
