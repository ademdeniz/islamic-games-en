var I=[["KURAN","Allahova knjiga objavljena Muhammedu, a.s."],["TEVRAT","Allahova knjiga objavljena Musau, a.s."],["ZEBUR","Allahova knjiga objavljena Davudu, a.s."],["INDZIL","Allahova knjiga objavljena Isau, a.s."],["SUHUFI","Manji Allahovi kitabi nazivaju se ovako."],["MUHAMMED","Posljednji Allahov poslanik kojem je objavljen Kur'an."],["MUSA","Poslanik kojem je objavljen Tevrat."],["DAVUD","Poslanik kojem je objavljen Zebur."],["ISA","Poslanik kojem je objavljen Indžil."],["OBJAVA","Allahova poruka koju je dostavljao poslanicima."]],O=[],p=0,S=0,N=10,G=[],A="",F=null;
function e(x){return document.getElementById(x)}function sh(a){var b=a.slice(),i,j,z;for(i=b.length-1;i;i--){j=Math.floor(Math.random()*(i+1));z=b[i];b[i]=b[j];b[j]=z}return b}
