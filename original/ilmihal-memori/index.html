ura En-Nasr", "pairs": [["Iza džae nasrullahi vel-feth", "Kada Allahova pomoć i pobjeda dođu"], ["Ve re'ejten-nase jedhulune fi dinillahi efvadža", "I vidiš ljude kako u skupinama u Allahovu vjeru ulaze"], ["Fesebbih bihamdi rabbike vestagfirh", "Veličaj Gospodara svoga hvaleći Ga i moli Ga da ti oprosti"], ["Innehu kane tevvaba", "On je uvijek pokajanje primao"]]}, {"title": "Imanski šarti", "pairs": [["Amentu billahi", "Vjerujem u Allaha"], ["Ve melaiketihi", "Vjerujem u Allahove meleke"], ["Ve kutubihi", "Vjerujem u Allahove knjige"], ["Ve rusulihi", "Vjerujem u Allahove poslanike"], ["Vel-jevmil-ahiri", "Vjerujem u Sudnji dan"], ["Ve bil-kaderi hajrihi ve šerrihi minallahi te'ala", "Vjerujem da sve što se događa biva Allahovom odredbom"]]}, {"title": "Allahu Rabbi", "pairs": [["Allahu Rabbi", "Allah je moj Gospodar"], ["Muhammedun nebijji", "Muhammed je moj poslanik"], ["El-Islamu dini", "Islam je moja vjera"], ["El-Kur'anu kitabi", "Kur'an je moja knjiga"], ["El-Ka'betu kibleti", "Kaba je moja kibla"], ["El-mu'minune ihveti", "Vjernici su moja braća"]]}, {"title": "Subhaneke", "pairs": [["Subhanekellahumme", "Slava Tebi, Allahu"], ["Ve bi hamdike", "Tebi pripada hvala"], ["Ve tebarekesmuke", "Blagoslovljeno je Tvoje ime"], ["Ve te'ala džedduke", "Uzvišena je Tvoja veličina"], ["Ve la ilahe gajruke", "Nema drugog boga osim Tebe"]]}, {"title": "Sura El-Fatiha", "pairs": [["Bismillahir-Rahmanir-Rahim", "U ime Allaha, Milostivog, Samilosnog"], ["El-hamdu lillahi rabbil-'alemin", "Hvala Allahu, Gospodaru svjetova"], ["Er-Rahmanir-Rahim", "Milostivom, Samilosnom"], ["Maliki jevmid-din", "Vladaru Sudnjeg dana"], ["Ijjake na'budu ve ijjake neste'in", "Samo Tebe obožavamo i samo od Tebe pomoć tražimo"], ["Ihdinas-siratal-mustekim", "Uputi nas na Pravi put"], ["Siratal-lezine en'amte alejhim gajril-magdubi alejhim ve led-dallin", "Put onih kojima si milost Svoju darovao, a ne onih koji su protiv sebe srdžbu izazvali, niti onih koji su zalutali"]]}, {"title": "Ezan", "pairs": [["Allahu ekber", "Allah je najveći"], ["Ešhedu en la ilahe illellah", "Svjedočim da nema drugog boga osim Allaha"], ["Ešhedu enne Muhammeden resulullah", "Svjedočim da je Muhammed Allahov poslanik"], ["Hajje ales-salah", "Dođite na namaz"], ["Hajje alel-felah", "Dođite na spas"], ["La ilahe illellah", "Nema drugog boga osim Allaha"]]}, {"title": "Dinski šarti – 33", "pairs": [["Dinski šarti", "Ukupno 33 šarta"], ["Imanski šarti", "6"], ["Islamski šarti", "5"], ["Abdeski šarti", "4"], ["Tejemumski šarti", "3 tejemumska"], ["Gusulski šarti", "3 gusulska"], ["Namaski šarti", "12"], ["6 + 5 + 4 + 3 + 3 + 12", "33 dinska šarta"]]}, {"title": "Salavati", "pairs": [["Allahumme salli ala Muhammedin ve ala ali Muhammed", "Allahu, podari milost Muhammedu i porodici Muhammedovoj"], ["Kema sallejte ala Ibrahime ve ala ali Ibrahim", "Kao što si podario milost Ibrahimu i porodici Ibrahimovoj"], ["Inneke hamidun medžid", "Ti si, zaista, Hvaljen i Slavljen"], ["Allahumme barik ala Muhammedin ve ala ali Muhammed", "Allahu, podari blagoslov Muhammedu i porodici Muhammedovoj"], ["Kema barekte ala Ibrahime ve ala ali Ibrahim", "Kao što si podario blagoslov Ibrahimu i porodici Ibrahimovoj"]]}, {"title": "Dova poslije salavata", "pairs": [["Rabbena atina fid-dunja haseneten", "Gospodaru naš, podari nam dobro na ovom svijetu"], ["Ve fil-ahireti haseneten", "I dobro na budućem svijetu"], ["Ve kina azaben-nar", "I sačuvaj nas patnje u Vatri"], ["Rabbena-gfir li", "Gospodaru naš, oprosti meni"], ["Ve li validejje", "I mojim roditeljima"], ["Ve lil-mu'minine jevme jekumul-hisab", "I vjernicima na Dan kada se bude polagao račun"]]}, {"title": "Ajetul-Kursijja", "pairs": [["Allahu la ilahe illa huvel-hajjul-kajjum", "Allah je – nema boga osim Njega – Živi i Vječni"], ["La te'huzuhu sinetun ve la nevm", "Ne obuzima Ga ni drijemež ni san"], ["Lehu ma fis-semavati ve ma fil-erd", "Njegovo je ono što je na nebesima i ono što je na Zemlji"], ["Men zellezi ješfe'u indehu illa bi iznih", "Ko se može pred Njim zauzimati bez Njegovog dopuštenja?"], ["Ja'lemu ma bejne ejdihim ve ma halfehum", "On zna šta je bilo prije njih i šta će biti poslije njih"], ["Ve la juhitune bi šej'in min ilmihi illa bima ša'", "A od Njegovog znanja obuhvataju samo onoliko koliko On želi"], ["Vesi'a kursijjuhus-semavati vel-erd", "Njegov Kursij obuhvata i nebesa i Zemlju"], ["Ve la je'uduhu hifzuhuma", "Njemu ne dojadi održavanje njihovo"], ["Ve huvel-alijjul-azim", "On je Svevišnji, Veličanstveni"]]}, {"title": "Pripreme za namaz", "pairs": [["Čisto tijelo, odijelo i mjesto", "1.uvjet za namaz"], ["Abdest", "Obredno čišćenje prije namaza"], ["Gusul", "Kupanje cijelog tijela kada je propisano"], ["Tejemum", "Simbolično čišćenje kada se voda ne može koristiti"], ["Propisno odijevanje", "3.uvjet za namaz"], ["4.uvjet za namaz", "Na vrijeme klanjati"], ["5.uvjet za namaz", "Okrenuti se prema Kibli"], ["Nijet učiniti", "6.uvjet za namaz"]]}, {"title": "Et-Tehijjatu", "pairs": [["Et-tehijjatu lillahi ves-salavatu vet-tajjibatu", "Najljepši pozdravi, salavati i dobra djela pripadaju Allahu"], ["Es-selamu alejke ejjuhen-nebijju ve rahmetullahi ve berekatuhu", "Neka su na tebe mir, Allahova milost i blagoslov, o Vjerovjesniče"], ["Es-selamu alejna ve ala ibadillahis-salihin", "Neka je mir na nas i na Allahove dobre robove"], ["Ešhedu en la ilahe illellah", "Svjedočim da nema drugog boga osim Allaha"], ["Ve ešhedu enne Muhammeden abduhu ve resuluhu", "I svjedočim da je Muhammed Njegov rob i poslanik"]]}, {"title": "Ikamet", "pairs": [["Allahu ekber", "Allah je najveći"], ["Ešhedu en la ilahe illellah", "Svjedočim da nema drugog boga osim Allaha"], ["Ešhedu enne Muhammeden resulullah", "Svjedočim da je Muhammed Allahov poslanik"], ["Hajje ales-salah", "Dođite na namaz"], ["Hajje alel-felah", "Dođite na spas"], ["Kad kametis-salah", "Namaz upravo počinje"]]}, {"title": "Namaska vremena", "pairs": [["Sabah", "Od zore do izlaska Sunca"], ["Podne", "Kad sunce pređe polovinu neba do ikindije"], ["Ikindija", "Kad Sunce nagne zapadu do pred zalazak Sunca"], ["Akšam", "Kad Sunce zađe pa do jacije"], ["Jacija", "Kad noć potpuno padne"]]}, {"title": "Hasbi Rabbi", "pairs": [["Hasbi Rabbi džellallah", "Dovoljan mi je moj Gospodar, Uzvišeni Allah"], ["Ma fi kalbi gajrullah", "U mome srcu nema nikoga osim Allaha"], ["Nur Muhammed sallallah", "Muhammed je svjetlo, neka je Allahov blagoslov na njega"], ["La ilahe illellah", "Nema drugog boga osim Allaha"]]}, {"title": "Sabah-namaz", "pairs": [["Sabahski sunnet", "2 rekata suneta"], ["Sabahski farz", "2 rekata farza"], ["Prvo se klanja", "Sabahski sunnet"], ["Poslije sunneta", "Sabahski farz"], ["Ukupno sabah-namaz", "4 rekata"]]}, {"title": "Islamska pravila ponašanja", "pairs": [["Selam", "Islamski pozdrav"], ["Es-selamu alejkum", "Neka je mir na vas"], ["Ve alejkumus-selam", "I na vas neka je mir"], ["Roditelji", "Poštujemo ih i slušamo u dobru"], ["Stariji", "Prema njima se odnosimo s poštovanjem"], ["Mlađi", "Prema njima smo blagi i pažljivi"]]}, {"title": "Nova hidžretska godina", "pairs": [["Hidžra", "Preseljenje Muhammeda, a.s., iz Mekke u Medinu"], ["Hidžretski kalendar", "Počinje Hidžrom"], ["Prvi hidžretski mjesec", "Muharrem"], ["Hidžretska godina", "Ima 12 mjeseci"]]}, {"title": "Prikladne riječi u raznim situacijama", "pairs": [["Bismillāh", "U ime Allaha – kada nešto radimo."], ["Inšallāh", "Ako Bog da – kada se nadamo nečemu."], ["Māšallāh", "Što hoće Allah – kada se divimo."], ["Subhanallāh", "Slava Allahu – kada smo oduševljeni i kada se čudimo."], ["El-hamdu lillāh", "Hvala Allahu – u svakoj prilici."], ["Jerhamukellāh", "Allah ti se smilovao – kada čujemo da je neko kihnuo."], ["Ja Allāh", "O Allahu – kada smo u bolu i nevolji."], ["Estagfirullāh", "Oprosti mi, Bože – kada se kajemo za loše djelo."], ["Ne'uzubillāhi", "Tražimo zaštitu od Allaha – kada ukazujemo na nešto ružno."]]}, {"title": "Islamska pravila prilikom jela i pića", "pairs": [["Hrana", "Jesti zdravu i halal – dozvoljenu hranu."], ["Prije jela", "Oprati ruke."], ["Prije početka jela", "Proučiti Euzubillu i Bismillu."], ["Kako jedemo?", "Desnom rukom."], ["S kim jedemo?", "Zajedno sa porodicom."], ["Pravilo za hranu", "Ne jesti vrelu hranu i ne puhati u jelo."], ["Nakon jela", "Zahvaliti Allahu riječima: El-hamdu lillāh – hvala Allahu."], ["Poslije jela", "Pospremiti sofru."], ["Na kraju", "Nakon jela oprati zube."]]}];
let lesson=null, opened=[], lock=false, found=0, moves=0, orderChosen=[];
const menu=document.getElementById('menu'), grid=document.getElementById('grid');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='lesson';b.textContent=(i+1)+'. '+l.title+' ('+l.pairs.length+' parova)';b.onclick=()=>start(i);menu.appendChild(b)})
function start(i){
 lesson=lessons[i]; opened=[];found=0;moves=0;lock=false;
 document.getElementById('home').style.display='none';document.getElementById('game').style.display='block';
 document.getElementById('gameTitle').textContent=lesson.title;document.getElementById('msg').textContent='';
 document.getElementById('orderBox').style.display='none';
 let cards=[]; lesson.pairs.forEach((p,k)=>{cards.push({k,t:p[0]},{k,t:p[1]})});shuffle(cards);
 grid.innerHTML=''; cards.forEach(c=>{let b=document.createElement('button');b.className='card hidden';b.dataset.k=c.k;b.dataset.t=c.t;b.textContent=c.t;b.onclick=()=>flip(b);grid.appendChild(b)});stat()
}
function flip(b){
 if(lock||!b.classList.contains('hidden'))return;b.classList.remove('hidden');opened.push(b);
 if(opened.length===2){moves++;lock=true;let [a,c]=opened;
  if(a.dataset.k===c.dataset.k){setTimeout(()=>{a.classList.add('matched');c.classList.add('matched');opened=[];found++;lock=false;stat();if(found===lesson.pairs.length)win()},350)}
  else setTimeout(()=>{a.classList.add('hidden');c.classList.add('hidden');opened=[];lock=false;stat()},850)
 } stat()
}
function stat(){document.getElementById('stats').textContent='Parovi: '+found+'/'+(lesson?lesson.pairs.length:0)+' • Pokušaji: '+moves}
function win(){
 document.getElementById('msg').textContent='🎉 Bravo! Pronašao/la si sve parove!';
 if(/^Sura /.test(lesson.title)){document.getElementById('orderBox').style.display='block';resetOrder()}
}
function resetOrder(){
 orderChosen=[];let box=document.getElementById('orderItems');box.innerHTML='';
 let arr=lesson.pairs.map((p,i)=>({i,t:p[0]}));shuffle(arr);
 arr.forEach(x=>{let d=document.createElement('button');d.className='orderItem';d.textContent=x.t;d.onclick=()=>chooseOrder(d,x.i);box.appendChild(d)})
}
function chooseOrder(el,i){
 if(el.disabled)return; let expected=orderChosen.length;
 if(i===expected){el.disabled=true;el.style.opacity=.45;orderChosen.push(i);if(orderChosen.length===lesson.pairs.length)document.getElementById('msg').textContent='🌟 Odlično! Ajeti su složeni pravilnim redoslijedom.'}
 else{document.getElementById('msg').textContent='Pokušaj ponovo – izaberi sljedeći ajet po redu.'}
}
function home(){document.getElementById('game').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
</script></body></html>
