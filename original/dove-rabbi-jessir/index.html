qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqo="];const audio=new Audio();audio.preload="auto";
function render(){let a=parts[i][0].split(/\s+/),l=parts[i][1].split(/\s+/);el('step').textContent=`Dio ${i+1} od ${parts.length}`;el('ar').innerHTML=a.map((w,j)=>`<span class="word ${marked.has(j)?'active':''}" onclick="mark(${j})">${w}</span>`).join(' ');el('lat').innerHTML=l.map((w,j)=>`<span class="word ${marked.has(Math.min(j,a.length-1))?'active':''}" onclick="mark(${Math.min(j,a.length-1)})">${w}</span>`).join(' ');el('bs').textContent=parts[i][2];if(audio.dataset.part!==String(i)){audio.src=clips[i];audio.dataset.part=String(i)}audio.loop=repeating}
function mark(j){marked.has(j)?marked.delete(j):marked.add(j);render()}
function stop(){auto=false;repeating=false;audio.pause();audio.loop=false;el('loop').textContent='🔁 Ponavljaj: ISKLJ.'}
function move(n){stop();i=Math.max(0,Math.min(parts.length-1,i+n));marked.clear();render()}
function speak(){audio.currentTime=0;audio.play().catch(()=>{})}
function toggleRepeat(){auto=false;repeating=!repeating;audio.loop=repeating;el('loop').textContent='🔁 Ponavljaj: '+(repeating?'UKLJ.':'ISKLJ.');if(repeating)speak()}
function learnAll(){audio.pause();auto=true;repeating=false;i=0;marked.clear();render();el('loop').textContent='🔁 Ponavljaj: ISKLJ.';speak()}
audio.addEventListener('ended',()=>{if(auto&&i<parts.length-1){i++;marked.clear();render();speak()}else auto=false});
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function show(section){stop();el('learn').classList.toggle('hidden',section!=='learn');el('quiz').classList.toggle('hidden',section!=='quiz');if(section==='quiz'&&!order.length)newQuiz()}
function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function setMode(m){mode=m;newQuiz()}
function newQuiz(){order=shuffle([0,1,2,3]);qi=0;score=0;question()}
function question(){answered=false;if(qi>=order.length){el('qnum').textContent='Kviz završen';el('question').textContent=`Rezultat: ${score} / ${order.length}`;el('choices').innerHTML='';el('feedback').textContent='';return}let id=order[qi],ask=mode===0?1:0;el('qnum').textContent=`Pitanje ${qi+1} / ${order.length} • Tačno ${score}`;el('question').textContent=parts[id][ask];el('choices').innerHTML=shuffle([0,1,2,3]).map(j=>`<button data-id="${j}" onclick="answer(${j},${id})" class="${mode===0?'arabic':''}">${parts[j][mode]}</button>`).join('');el('feedback').textContent=''}
function tone(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(ok?680:280,t);o.frequency.exponentialRampToValueAtTime(ok?900:150,t+.22);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3)}catch(e){}}
function answer(j,id){if(answered)return;answered=true;let ok=j===id;if(ok)score++;tone(ok);document.querySelectorAll('[data-id]').forEach(b=>{b.disabled=true;if(+b.dataset.id===id)b.classList.add('correct');else if(+b.dataset.id===j)b.classList.add('incorrect')});el('feedback').textContent=ok?'Tačno!':'Netačno. Tačan odgovor je zelen.'}
function nextQ(){if(!answered&&qi<order.length)return;qi++;question()}
render();
</script></body></html>
