: "Samo Fatihu", "C": "Subhanallah, El-hamdu lillah i Allahu ekber", "D": "Samo salavate"}, "answer": "C"}, {"q": "Šta nam Uzvišeni Allah naređuje nakon završetka namaza u ajetu navedenom u lekciji?", "opts": {"A": "Da odmah napustimo džamiju", "B": "Da ponovimo namaz", "C": "Da šutimo", "D": "Da Allaha spominjemo"}, "answer": "D"}, {"q": "Šta znači riječ „En-Nasr“?", "opts": {"A": "Svjetlost", "B": "Strpljenje", "C": "Pomoć", "D": "Milost"}, "answer": "C"}, {"q": "Koliko ajeta ima sura En-Nasr?", "opts": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "A"}, {"q": "Kojim riječima počinje prvi ajet sure En-Nasr?", "opts": {"A": "Kul huvallahu", "B": "Tebbet jeda", "C": "Inna e'atajna", "D": "Iza dža'e nasrullahi vel-feth"}, "answer": "D"}, {"q": "Šta znači „Iza dža'e nasrullahi vel-feth“?", "opts": {"A": "Kada Allahova pomoć i pobjeda dođu", "B": "Kada nastupi noć", "C": "Kada ljudi krenu na namaz", "D": "Kada dođe Sudnji dan"}, "answer": "A"}, {"q": "Šta ljudi, prema suri En-Nasr, čine u skupinama?", "opts": {"A": "Napuštaju svoje gradove", "B": "Ulaze u Allahovu vjeru", "C": "Odlaze na putovanje", "D": "Okupljaju se radi trgovine"}, "answer": "B"}, {"q": "Šta znači dio „Ve re'ejten-nase jedhulune fi dinillahi efvadža“?", "opts": {"A": "I vidjet ćeš ljude kako klanjaju", "B": "I vidjet ćeš ljude kako poste", "C": "I vidiš ljude kako u skupinama u Allahovu vjeru ulaze", "D": "I vidiš ljude kako odlaze iz grada"}, "answer": "C"}, {"q": "Šta nam Allah naređuje nakon spominjanja pomoći i pobjede u suri Nasr?", "opts": {"A": "Da spavamo", "B": "Da šutimo", "C": "Da putujemo", "D": "Da veličamo i hvalimo svoga Gospodara"}, "answer": "D"}, {"q": "Šta znači „Fe-sebbih bi-hamdi Rabbike“?", "opts": {"A": "Veličaj Gospodara svoga hvaleći Ga", "B": "Traži pomoć od ljudi", "C": "Klanjaj samo noću", "D": "Udjeljuj sadaku"}, "answer": "A"}, {"q": "Šta znači riječ „vestağfir“ u suri En-Nasr?", "opts": {"A": "Zahvali", "B": "Moli Ga da ti oprosti", "C": "Posti", "D": "Klanjaj"}, let quiz=[],i=0,score=0,correct=0,wrong=0,locked=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pick(level,n){return shuffle(BANKS[level]).slice(0,n).map(x=>({...x,level}))}
function begin(){quiz=[...pick("A1",5),...pick("A2",10),...pick("A3",15)]; document.getElementById("start").style.display="none";document.getElementById("game").style.display="block";show()}

arr.forEach((o,idx)=>{let b=document.createElement("button");b.className="ans";b.dataset.ok=o.ok;b.innerHTML=`<b>${"ABCD"[idx]})</b> ${esc(o.text)}`;b.onclick=()=>choose(b);answers.appendChild(b)})}

function scoreEl(){document.getElementById("score").textContent=`Bodovi: ${score}`}
function tone(ok){let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:180;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.33)}
function choose(b){if(locked)return;locked=true;let ok=b.dataset.ok==="true";if(ok){score+=10;correct++;b.classList.add("good");msg.textContent="Tačan odgovor! +10 bodova";tone(true)}else{score-=3;wrong++;b.classList.add("bad");[...answers.children].find(x=>x.dataset.ok==="true")?.classList.add("good");msg.textContent="Netačan odgovor! −3 boda";tone(false)}scoreEl();setTimeout(()=>advance(),1200)}
function half(){if(locked)return;halfBtn=document.getElementById("half");halfBtn.disabled=true;let bad=shuffle([...answers.children].filter(x=>x.dataset.ok==="false"));bad.slice(0,2).forEach(x=>x.classList.add("hide"))}
function teacher(){if(locked)return;document.getElementById("teach").disabled=true;let good=[...answers.children].find(x=>x.dataset.ok==="true");let label=good?good.innerText.split(")")[0]:"";msg.textContent=`Muallim smatra da je odgovor ${label}.`}
function audience(){if(locked)return;document.getElementById("pub").disabled=true;let btns=[...answers.children],good=btns.findIndex(x=>x.dataset.ok==="true"),vals=[0,0,0,0];let main=55+Math.floor(Math.random()*21),rest=100-main;vals[good]=main;let others=[0,1,2,3].filter(x=>x!==good);for(let z=0;z<2;z++){let v=Math.floor(Math.random()*(rest+1));vals[others[z]]=v;rest-=v}vals[others[2]]=rest;bars.innerHTML="";vals.forEach((v,j)=>{bars.innerHTML+=`<div><div class="bar" style="height:${v}px"></div><div class="lab">${"ABCD"[j]} ${v}%</div></div>`});aud.style.display="block"}
function advance(){if(i<quiz.length-1){i++;show()}else{game.style.display="none";finish.style.display="block";final.textContent=`Ukupno: ${score} bodova`;stats.textContent=`Tačnih odgovora: ${correct} • Netačnih odgovora: ${wrong} • Maksimalno: 300 bodova`}}
