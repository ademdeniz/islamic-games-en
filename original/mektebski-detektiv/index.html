 je iz čovjekove blizine.", "Islam naglašava lijepo ponašanje prema njemu.", "Treba mu pomagati i ne nanositi štetu.", "Može biti musliman ili nemusliman.", "To je osoba koja živi u susjedstvu."]}, {"id": 189, "answer": "Siroče", "clues": ["Posebno se spominje u Kur'anu.", "Islam naređuje lijep odnos prema njemu.", "Ne smije se nepravedno uzimati njegov imetak.", "Pomaganje njemu je veliko dobro djelo.", "To je dijete koje je ostalo bez oca prije punoljetstva."]}, {"id": 190, "answer": "Selam", "clues": ["Islamski je pozdrav.", "Širi mir i bliskost među ljudima.", "Na njega se odgovara lijepim ili boljim odgovorom.", "Počinje riječima „Esselamu alejkum“.", "Znači pozdrav mira."]}, {"id": 191, "answer": "Esselamu alejkum", "clues": ["Izgovara se pri susretu.", "Muslimani ga često koriste.", "Na njega se odgovara „Ve alejkumus-selam“.", "U njemu se želi mir drugoj osobi.", "To je islamski pozdrav."]}, {"id": 192, "answer": "Elhamdulillah", "clues": ["Kratak je zikr.", "Izgovara se u mnogim prilikama.", "Njime se Allahu iskazuje zahvalnost i hvala.", "Fatiha počinje ovim riječima.", "Znači „Hvala Allahu“."]}, {"id": 193, "answer": "Subhanallah", "clues": ["Kratak je zikr.", "Često se uči nakon namaza.", "Njime se Allah veliča i slavi.", "U tesbihu nakon namaza često se ponavlja 33 puta.", "Znači da je Allah čist od svakog nedostatka."]}, {"id": 194, "answer": "Allahu ekber", "clues": ["Kratak je zikr.", "Često se čuje u namazu.", "Njime se započinje namaz.", "Uči se i u danima Bajrama.", "Znači „Allah je najveći“."]}, {"id": 195, "answer": "Estagfirullah", "clues": ["Kratka je dova i zikr.", "Povezana je s tev­bom.", "Izgovara se kada čovjek traži oprost.", "Musliman je može često ponavljati.", "Znači „Molim Allaha za oprost“."]}, {"id": 196, "answer": "Inšallah", "clues": ["Izraz je koji muslimani koriste.", "Povezan je s budućim planovima.", "Podsjeća da se ništa ne događa mimo Allahove volje.", "Izgovara se kada govorimo o onome što namjeravamo učiniti.", "Znači „Ako Allah da“."]}, {"id": 197, "answer": "Mašallah", "clues": ["Izraz je koji muslimani koriste.", "Izgovara se kada se vidi nešto lijepo ili vrijedno.", "Podsjeća da su blagodati od Allaha.", "Njime se izražava divljenje bez pripisivanja zasluge sebi.", "Znači približno „Kako je Allah htio“."]}, {"id": 198, "answer": "El-Emin", "clues": ["Nadimak je povezan s lijepom osobinom.", "Poznat je među stanovnicima Mekke prije početka Objave.", "Govori o povjerenju i pouzdanosti.", "Tim nadimkom bio je poznat Muhammed, a.s.", "Znači „povjerljivi“."]}, {"id": 199, "answer": "Rahmet", "clues": ["Islamski je pojam.", "Povezan je s Allahovim lijepim svojstvima.", "Vjernik moli Allaha da mu ga podari.", "Obuhvata milost, dobrotu i samilost.", "Znači milost."]}, {"id": 200, "answer": "Ahiret", "clues": ["Povezan je s islamskim vjerovanjem.", "Dolazi nakon dunjalučkog života.", "Povezan je sa Sudnjim danom, Džennetom i Džehennemom.", "Vjerovanje u njega utiče na čovjekova djela na dunjaluku.", "Znači budući, vječni svijet nakon smrti."]}];
const MAX_ROUNDS=20;
let deck=[],round=0,total=0,current=null,revealed=1,casePoints=100,locked=false;
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuffle([...DB]).slice(0,MAX_ROUNDS);round=0;total=0;$("#total").textContent=0;nextCase()}
function nextCase(){
 if(round>=MAX_ROUNDS){showModal("Detektivska misija završena!","Osvojio/la si "+total+" bodova u 20 slučajeva.","Igraj ponovo",start);return}
 current=deck[round];round++;revealed=1;casePoints=100;locked=false;
 $("#round").textContent=round;$("#value").textContent=casePoints;$("#msg").textContent="Prvi trag je otkriven. Možeš pogađati odmah ili tražiti novi trag.";
 $("#answers").classList.remove("show");$("#answers").innerHTML="";renderClues(); $("#next").disabled=false; $("#guess").disabled=false;
}
function renderClues(){
 $("#clues").innerHTML=current.clues.map((c,i)=>`<div class="clue ${i<revealed?"":"locked"}"><span class="num">${i+1}</span><span>${i<revealed?escapeHtml(c):"Trag zaključan"}</span></div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("#next").addEventListener("click",()=>{if(locked)return;if(revealed<5){revealed++;casePoints=Math.max(20,100-(revealed-1)*20);$("#value").textContent=casePoints;renderClues();if(revealed===5)$("#next").disabled=true}});
$("#guess").addEventListener("click",()=>{if(locked)return;showAnswers()});
function showAnswers(){
 let others=shuffle(DB.filter(x=>x.id!==current.id)).slice(0,5);
 let opts=shuffle([current,...others]);
 $("#answers").innerHTML=opts.map(x=>`<button class="ans" data-id="${x.id}">${escapeHtml(x.answer)}</button>`).join("");
 $("#answers").classList.add("show");
 [...document.querySelectorAll(".ans")].forEach(b=>b.addEventListener("click",answer));
}
function answer(e){
 if(locked)return;locked=true;
 const id=Number(e.currentTarget.dataset.id),ok=id===current.id;
 [...document.querySelectorAll(".ans")].forEach(b=>{b.disabled=true;if(Number(b.dataset.id)===current.id)b.classList.add("good")});
 if(ok){total+=casePoints;$("#total").textContent=total;$("#msg").textContent="✅ Slučaj riješen! +"+casePoints+" bodova.";setTimeout(()=>showModal("Slučaj riješen!","Tačan odgovor je: "+current.answer+". Osvojeno: "+casePoints+" bodova.","Sljedeći slučaj",nextCase),450)}
 else{e.currentTarget.classList.add("bad");$("#msg").textContent="❌ Pogrešan trag! Ovaj slučaj je izgubljen.";setTimeout(()=>showModal("Slučaj nije riješen","Tačan odgovor je: "+current.answer+". Za ovaj slučaj nema bodova.","Novi slučaj",nextCase),550)}
}
let modalCb=null;
function showModal(t,txt,btn,cb){$("#modalTitle").textContent=t;$("#modalText").textContent=txt;$("#continue").textContent=btn;modalCb=cb;$("#overlay").classList.add("show")}
$("#continue").addEventListener("click",()=>{$("#overlay").classList.remove("show");if(modalCb)modalCb()});
$("#restart").addEventListener("click",()=>{showModal("Nova igra?","Trenutni rezultat će biti obrisan.","Pokreni novu igru",start)});
start();
</script>
</body></html>
