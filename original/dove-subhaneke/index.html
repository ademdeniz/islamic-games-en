const audio=new Audio();audio.preload='auto';
const urls=C.map(data=>{const raw=atob(data.split(',')[1]);const bytes=new Uint8Array(raw.length);for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);return URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}))});
let index=0,repeat=false,auto=false,marks=new Set(),mode=0,order=[],qi=0,score=0,answered=false,ctx;
function render(){let ar=D[index][0].split(/\s+/);$('counter').textContent='Dio '+(index+1)+' / '+D.length;$('arabic').innerHTML=ar.map((w,i)=>`<span class="word ${marks.has(i)?'on':''}" onclick="mark(${i})">${w}</span>`).join(' ');$('trans').textContent=D[index][1];$('meaning').textContent=D[index][2];if(audio.src!==urls[index]){audio.src=urls[index];audio.load()}audio.loop=repeat}
function mark(i){marks.has(i)?marks.delete(i):marks.add(i);render()}
function play(){audio.currentTime=0;audio.play().catch(e=>{$('counter').textContent='Dodirni Slušaj da pokreneš zvuk • '+(index+1)+' / '+D.length})}
function move(n){let v=Math.max(0,Math.min(D.length-1,index+n));if(v===index)return;audio.pause();index=v;marks.clear();render();if(auto)play()}
function toggleRepeat(){repeat=!repeat;auto=false;audio.loop=repeat;$('repeat').textContent='🔁 Ponavljaj: '+(repeat?'UKLJ.':'ISKLJ.');if(repeat)play()}
function all(){audio.pause();auto=true;repeat=false;index=0;marks.clear();$('repeat').textContent='🔁 Ponavljaj: ISKLJ.';render();play()}
audio.addEventListener('ended',()=>{if(auto){if(index<D.length-1){move(1)}else{auto=false;$('counter').textContent='Učenje završeno – 4 / 4'}}});
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}function show(q){$('lesson').classList.toggle('hidden',q);$('quiz').classList.toggle('hidden',!q);if(q){auto=false;audio.pause();if(!order.length)startQuiz()}}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setMode(m){mode=m;startQuiz()}function startQuiz(){order=shuffle([0,1,2,3]);qi=0;score=0;question()}function question(){answered=false;if(qi>=4){$('qcount').textContent='Kviz završen';$('question').textContent='Rezultat: '+score+' / 4';$('answers').innerHTML='';$('feedback').textContent='';return}let id=order[qi],promptCol=mode===0?1:0;$('qcount').textContent='Pitanje '+(qi+1)+' / 4 • Tačno: '+score;$('question').innerHTML='<p>Odaberi odgovarajući '+['arapski tekst','izgovor','prijevod'][mode]+'</p><div class="'+(promptCol===0?'ar':'tr')+'">'+D[id][promptCol]+'</div>';let opts=shuffle([0,1,2,3]);$('answers').innerHTML=opts.map(j=>`<button data-id="${j}" class="${mode===0?'ar':''}" onclick="answer(${j},${id})">${D[j][mode]}</button>`).join('');$('feedback').textContent=''}function sound(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(ok?650:250,t);o.frequency.exponentialRampToValueAtTime(ok?880:160,t+.2);g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.28)}catch(e){}}function answer(j,id){if(answered)return;answered=true;if(j===id)score++;sound(j===id);document.querySelectorAll('[data-id]').forEach(b=>{b.disabled=true;if(+b.dataset.id===id)b.classList.add('correct');else if(+b.dataset.id===j)b.classList.add('incorrect')});$('feedback').textContent=j===id?'Tačno!':'Netačno – tačan odgovor je zelen.'}function next(){if(!answered&&qi<4)return;qi++;question()}render();</script></body></html>
