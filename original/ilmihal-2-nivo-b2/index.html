snik koji klanja sjedeći može izvršavati ruku' i sedždu?","opts":{"A":"Samo pogledom","B":"Ne izvršava ih","C":"Samo riječima","D":"Išaretom, s tim da se na sedždi nagne više nego na ruku'u"},"answer":"D"},{"q":"Kako će bolesnik klanjati ako ne može sjediti?","opts":{"A":"Stojeći","B":"Ležeći","C":"Hodajući","D":"Neće klanjati"},"answer":"B"},{"q":"Kako će se bolesnik koji klanja ležeći, ako može, okrenuti prema Kibli?","opts":{"A":"Okrenut će noge prema Kibli, savijajući ih u koljenima","B":"Okrenut će leđa prema Kibli","C":"Nije važno kako će se okrenuti","D":"Mora ležati na stomaku"},"answer":"A"},{"q":"Kako će bolesnik koji leži obavljati namaske dijelove?","opts":{"A":"Pokretima nogu","B":"Samo učenjem naglas","C":"Glavu će uzdignuti kako bi simbolički obavljao namaske dijelove","D":"Neće obavljati namaske dijelove"},"answer":"C"},{"q":"Kako može klanjati bolesnik koji ne može pomjerati nijedan dio tijela?","opts":{"A":"Samo sjedeći","B":"Stojeći uz pomoć druge osobe","C":"Ne može nikako klanjati","D":"U mislima"},"answer":"D"},{"q":"Kada bolesnik odgađa namaze da ih naklanja kasnije?","opts":{"A":"Kad mu se ne klanja","B":"Kada mu teško stanje ne dozvoljava klanjanje prema navedenim olakšicama","C":"Kad je zauzet","D":"Kad želi spavati"},"answer":"B"},{"q":"Šta će bolesnik učiniti s propuštenim namazima ako njegovo teško stanje potraje kraće od jednog dana?","opts":{"A":"Naklanjat će ih kada bude mogao","B":"Neće ih nikada klanjati","C":"Klanjat će samo sabah","D":"Zamijenit će ih dovom"},"answer":"A"},{"q":"Šta važi ako teško stanje bolesnika potraje duže od jednog dana?","opts":{"A":"Mora naklanjati dvostruko više namaza","B":"Mora naklanjati samo farz sabaha","C":"Nije obavezan naklanjati propuštene namaze","D":"Mora ih sve klanjati istog dana"},"answer":"C"},{"q":"Kakva je obaveza osobe koja je u komi ili bez svijesti duže od jednog dana i noći?","opts":{"A":"Mora naklanjati sve namaze","B":"Mora naklanjati samo jedan namaz","C":"Porodica klanja umjesto nje","D":"Nije dužna naklanjati propuštene namaze"},"answer":"D"},{"q":"Šta ako broj propuštenih namaza osobe u komi ili bez svijesti bude šest ili više?","opts":{"A":"Mora ih sve naklanjati","B":"Nije ih dužna naklanjati","C":"Naklanjava samo dva","D":"Naklanjava samo vitr"},"answer":"B"},{"q":"Ko procjenjuje svoje stanje i način klanjanja tokom bolesti?","opts":{"A":"Bolesnik će sam procijeniti svoje stanje i klanjati na najbolji način koji mu zdravlje dopušta","B":"Samo njegova porodica","C":"Drugi klanjači u džamiji","D":"Niko"},"answer":"A"}]};
let quiz=[],i=0,score=0,correct=0,wrong=0,locked=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pick(level,n){return shuffle(BANKS[level]).slice(0,n).map(x=>({...x,level}))}
function begin(){quiz=[...pick("B1",10),...pick("B2",20)]; document.getElementById("start").style.display="none";document.getElementById("game").style.display="block";show()}
function show(){locked=false;let q=quiz[i]; prog.textContent=`Pitanje ${i+1}/30`;lvl.textContent=`Baza ${q.level}`;scoreEl();document.getElementById('question').textContent=q.q;msg.textContent="";aud.style.display="none";answers.innerHTML="";
let arr=shuffle(Object.keys(q.opts).map(k=>({text:q.opts[k],ok:k===q.answer})));
arr.forEach((o,idx)=>{let b=document.createElement("button");b.className="ans";b.dataset.ok=o.ok;b.innerHTML=`<b>${"ABCD"[idx]})</b> ${esc(o.text)}`;b.onclick=()=>choose(b);answers.appendChild(b)})}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function scoreEl(){document.getElementById("score").textContent=`Bodovi: ${score}`}
function tone(ok){let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:180;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.33)}
function choose(b){if(locked)return;locked=true;let ok=b.dataset.ok==="true";if(ok){score+=10;correct++;b.classList.add("good");msg.textContent="Tačan odgovor! +10 bodova";tone(true)}else{score-=3;wrong++;b.classList.add("bad");[...answers.children].find(x=>x.dataset.ok==="true")?.classList.add("good");msg.textContent="Netačan odgovor! −3 boda";tone(false)}scoreEl();setTimeout(()=>advance(),1200)}
function half(){if(locked)return;halfBtn=document.getElementById("half");halfBtn.disabled=true;let bad=shuffle([...answers.children].filter(x=>x.dataset.ok==="false"));bad.slice(0,2).forEach(x=>x.classList.add("hide"))}
function teacher(){if(locked)return;document.getElementById("teach").disabled=true;let good=[...answers.children].find(x=>x.dataset.ok==="true");let label=good?good.innerText.split(")")[0]:"";msg.textContent=`Muallim smatra da je odgovor ${label}.`}
function audience(){if(locked)return;document.getElementById("pub").disabled=true;let btns=[...answers.children],good=btns.findIndex(x=>x.dataset.ok==="true"),vals=[0,0,0,0];let main=55+Math.floor(Math.random()*21),rest=100-main;vals[good]=main;let others=[0,1,2,3].filter(x=>x!==good);for(let z=0;z<2;z++){let v=Math.floor(Math.random()*(rest+1));vals[others[z]]=v;rest-=v}vals[others[2]]=rest;bars.innerHTML="";vals.forEach((v,j)=>{bars.innerHTML+=`<div><div class="bar" style="height:${v}px"></div><div class="lab">${"ABCD"[j]} ${v}%</div></div>`});aud.style.display="block"}
function advance(){if(i<quiz.length-1){i++;show()}else{game.style.display="none";finish.style.display="block";final.textContent=`Ukupno: ${score} bodova`;stats.textContent=`Tačnih odgovora: ${correct} • Netačnih odgovora: ${wrong} • Maksimalno: 300 bodova`}}
</script></body></html>
