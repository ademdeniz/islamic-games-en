<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sastavi namaz"><meta name="mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#123b2c"><title>Sastavi namaz</title>
<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#0c2d22,#28644a);color:#fff;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh}main{max-width:800px;margin:auto}header{text-align:center}h1{color:#ffdc70;margin:5px;font-size:clamp(28px,8vw,46px)}.author{font-weight:700}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.pill{background:#fff;color:#173b2d;padding:8px 13px;border-radius:30px;font-weight:800}.scene{height:130px;border:3px solid #dfbc57;border-radius:20px;background:linear-gradient(#91d5ed 55%,#72ae61 55%);position:relative;overflow:hidden}.kid{position:absolute;left:4%;bottom:8px;font-size:48px;transition:.5s}.mosque{position:absolute;right:4%;bottom:5px;font-size:70px}.panel,.finish{background:#fff;color:#17382c;border-radius:20px;padding:15px;margin-top:12px}.title{text-align:center;font-size:21px;font-weight:900}.help{text-align:center;color:#687a72;margin:7px 0 12px}.built{min-height:60px;border:2px dashed #b99b48;border-radius:14px;padding:8px;margin-bottom:12px}.pool{display:grid;grid-template-columns:1fr;gap:8px}.chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:100%;border:0;border-radius:12px;padding:12px;text-align:left;font-size:15px;font-weight:800;background:#e7f1eb;color:#17382c;box-shadow:0 2px #b6c8be;min-height:46px}.built .chip{background:#fff0b8;margin-bottom:6px}.controls{display:flex;gap:8px;margin-top:12px}.controls button,.restart,#openBase{-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:48px;flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:900}.undo{background:#e2e8e5}.check{background:#d8ae38}.fb{text-align:center;min-height:29px;font-weight:900;margin-top:9px}.finish{display:none;text-align:center}.restart{background:#174b38;color:#fff}.counter{text-align:center;font-size:13px;color:#65776f;margin-bottom:8px}@media(min-width:650px){.pool{grid-template-columns:1fr 1fr}}</style></head><body><main>
<header><h1>🕌 SASTAVI NAMAZ</h1><div class="author">Pripremio Abdo ef. Rekić</div><div style="display:flex;justify-content:center;margin:10px 0"><button id="openBase" type="button" style="border:0;border-radius:14px;padding:12px 18px;background:#ffdc70;color:#17382c;font-weight:900;font-size:16px">📚 Baza zadataka i tačan redoslijed</button></div></header>
<section class="panel" id="basePanel" style="display:none;margin-top:10px">
<div class="title">📚 Baza zadataka</div>
<div class="help">Ovdje možeš pregledati tačan redoslijed svih zadataka koji se koriste u igrici.</div>
<div id="baseContent"></div>
<div style="margin-top:12px"><button id="closeBase" type="button" class="restart">Zatvori bazu i vrati se na igru</button></div>
</section><div class="stats"><span class="pill">⭐ Bodovi: <b id="score">0</b></span><span class="pill">🏆 Nivo: <b id="num">1</b>/6</span></div>
<div class="scene"><span class="kid" id="kid">🧒</span><span class="mosque">🕌</span></div>
<section class="panel" id="game"><div class="title" id="title"></div><div class="help">Svaka radnja je posebna kartica. Dodiruj kartice tačnim redoslijedom klanjanja.</div><div class="counter" id="counter"></div><div class="built" id="built"></div><div class="pool" id="pool"></div><div class="controls"><button class="undo" id="undo">↩ Vrati zadnju</button><button class="check" id="check">✓ Provjeri</button></div><div class="fb" id="fb"></div></section>
<section class="finish" id="finish"><div style="font-size:72px">🧒✨🕌</div><h2>Bravo! Sastavio si namaze!</h2><p>Ukupno bodova: <b id="final"></b></p><button class="restart" id="restart">Igraj ponovo</button></section>
</main><script>
const L=[{"name": "Sabah – 2 rekata", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}, {"name": "Podne – prvi sunnet (4 rekata)", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Prvo sjedenje: Ettehijjatu", "3. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "4. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}, {"name": "Farz od 4 rekata", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Prvo sjedenje: Ettehijjatu", "3. rekat: Bismilla → Fatiha", "Ruku → ispravljanje sa rukua → dvije sedžde", "4. rekat: Bismilla → Fatiha", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}, {"name": "Akšam – farz (3 rekata)", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Prvo sjedenje: Ettehijjatu", "3. rekat: Bismilla → Fatiha", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}, {"name": "Ikindijski i jacijski sunnet (4 rekata)", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Prvo sjedenje: Ettehijjatu → Salavati", "3. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "4. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}, {"name": "Vitr – 3 rekata", "steps": ["Nijjet", "Početni tekbir", "1. rekat: Subhaneke → Euzu → Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "2. rekat: Bismilla → Fatiha → sura", "Ruku → ispravljanje sa rukua → dvije sedžde", "Prvo sjedenje: Ettehijjatu", "3. rekat: Bismilla → Fatiha → sura", "Tekbir", "Kunut-dova", "Ruku → ispravljanje sa rukua → dvije sedžde", "Posljednje sjedenje: Ettehijjatu", "Salavati", "Dova", "Selam na desnu stranu", "Selam na lijevu stranu"]}],$=x=>document.getElementById(x);let lv=0,score=0,chosen=[],pool=[],locked=false;

function renderBase(){
  const box=$("baseContent");
  box.innerHTML="";
  L.forEach((level,li)=>{
    const wrap=document.createElement("div");
    wrap.style.cssText="border:1px solid #d6dfda;border-radius:14px;padding:10px;margin:10px 0;background:#f7faf8";
    const h=document.createElement("div");
    h.style.cssText="font-weight:900;font-size:17px;margin-bottom:7px;color:#17382c";
    h.textContent=(li+1)+". "+level.name;
    wrap.appendChild(h);
    const ol=document.createElement("ol");
    ol.style.cssText="margin:0;padding-left:26px;line-height:1.55";
    level.steps.forEach(step=>{const liEl=document.createElement("li");liEl.textContent=step;ol.appendChild(liEl)});
    wrap.appendChild(ol); box.appendChild(wrap);
  });
}
$("openBase").addEventListener("click",()=>{
  renderBase(); $("basePanel").style.display="block"; $("game").style.display="none"; $("finish").style.display="none";
  $("basePanel").scrollIntoView({behavior:"smooth",block:"start"});
});
$("closeBase").addEventListener("click",()=>{
  $("basePanel").style.display="none"; $("game").style.display="block";
});
function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(ok){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?720:180;g.gain.value=.07;o.start();o.stop(a.currentTime+.14)}catch(e){}}
function load(){locked=false;chosen=[];pool=sh(L[lv].steps.map((t,i)=>({t,i,id:i+"-"+Math.random()})));$("title").textContent=L[lv].name;$("num").textContent=lv+1;$("fb").textContent="";$("kid").style.left=(4+lv*13)+"%";render()}
function render(){$("counter").textContent="Složeno "+chosen.length+" od "+L[lv].steps.length+" radnji";$("built").innerHTML=chosen.length?"":"<div style='text-align:center;color:#718078;padding:8px'>Ovdje slaži redoslijed…</div>";chosen.forEach((x,i)=>{let b=document.createElement("button");b.className="chip";b.textContent=(i+1)+". "+x.t;$("built").appendChild(b)});$("pool").innerHTML="";pool.forEach(x=>{let b=document.createElement("button");b.className="chip";b.textContent=x.t;b.addEventListener("click",()=>{if(locked)return;chosen.push(x);pool=pool.filter(y=>y.id!==x.id);render()});$("pool").appendChild(b)})}
$("undo").addEventListener("click",()=>{if(locked||!chosen.length)return;pool.push(chosen.pop());render()});
$("check").addEventListener("click",()=>{if(locked)return;if(chosen.length!==L[lv].steps.length){$("fb").textContent="Prvo složi sve radnje.";return}let ok=true;for(let i=0;i<chosen.length;i++){if(chosen[i].t!==L[lv].steps[i]){ok=false;break}}if(ok){locked=true;score+=10;$("score").textContent=score;$("fb").textContent="✅ Tačno! +10 bodova";tone(true);setTimeout(()=>{lv++;if(lv>=L.length){$("game").style.display="none";$("finish").style.display="block";$("final").textContent=score;$("kid").style.left="78%"}else load()},900)}else{score-=3;$("score").textContent=score;let wrong=chosen.findIndex((x,i)=>x.t!==L[lv].steps[i]);$("fb").textContent="❌ Provjeri karticu broj "+(wrong+1)+". Tu počinje greška. −3 boda";tone(false)}});
$("restart").addEventListener("click",()=>{lv=0;score=0;$("score").textContent=0;$("game").style.display="block";$("finish").style.display="none";load()});load();
</script></body></html>
