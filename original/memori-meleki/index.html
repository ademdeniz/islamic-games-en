<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memori meleki">
<title>Memori – Zaduženja meleka</title>
<style>
:root{--green:#0b6b50;--gold:#d8a928;--cream:#fff9e9;--dark:#17352d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f8f3df,#e8f5ee);color:var(--dark);min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:18px}
h1{text-align:center;margin:5px 0;color:var(--green);font-size:clamp(25px,5vw,42px)}
.sub{text-align:center;margin:0 0 12px;font-weight:700}
.by{text-align:center;margin:0 0 16px;color:#555}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.badge{background:white;border:2px solid #dfc66d;border-radius:999px;padding:8px 14px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1/1.03;perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.inner{position:relative;width:100%;height:100%;transition:transform .42s;transform-style:preserve-3d}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;backface-visibility:hidden;box-shadow:0 4px 12px #0002;border:2px solid #d9b94d}
.front{background:linear-gradient(145deg,var(--green),#064737);color:white;font-size:clamp(25px,6vw,44px);font-weight:900}
.front:after{content:"MELEKI";font-size:10px;position:absolute;bottom:10px;letter-spacing:1.5px}
.back{background:var(--cream);transform:rotateY(180deg);font-weight:800;font-size:clamp(11px,2.5vw,17px);line-height:1.2}
.card.matched .back{background:#dff5e9;border-color:#45a474}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:block;margin:18px auto 0;border:0;border-radius:12px;padding:12px 20px;background:var(--gold);font-weight:900;font-size:16px;cursor:pointer}
#msg{text-align:center;min-height:30px;font-weight:900;color:var(--green);font-size:18px;margin-top:12px}
@media(max-width:600px){.wrap{padding:10px}.grid{gap:7px}.face{border-radius:11px;padding:5px}.back{font-size:clamp(10px,2.7vw,13px)}}
</style>
</head>
<body>
<div class="wrap">
<h1>MEMORI – ZADUŽENJA MELEKA</h1>
<p class="sub">Spoji ime meleka sa njegovim zaduženjem</p>
<p class="by">Pripremio: <b>Abdo ef. Rekić</b></p>
<div class="bar">
<div class="badge">Parovi: <span id="pairs">0</span>/8</div>
<div class="badge">Pokušaji: <span id="tries">0</span></div>
<div class="badge">Bodovi: <span id="score">0</span></div>
</div>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<button onclick="start()">🔄 Nova igra</button>
</div>
<script>
const pairs=[
["DŽIBRIL (DŽEBRAIL)","Dostavljao je Božije objave svim Božijim poslanicima."],
["MIKAIL","Zadužen je za prirodne pojave."],
["ISRAFIL","Zadužen je da puhanjem u Sur najavi Kijametski i Sudnji dan."],
["MUNKIR I NEKIR","Zaduženi su za ispitivanje osoba u kaburu."],
["KIRAMUN-KATIBUN","Prate osobe i pišu njihova dobra i loša djela."],
["MELEKUL-MEVT (AZRAIL)","Rastavlja dušu od tijela u času smrti."],
["RIDVAN","Zadužen je za Džennet, čuvar Dženneta."],
["MALIK","Zadužen za Džehennem, čuvar Džehennema."]
];
let first=null,second=null,lock=false,found=0,tries=0,score=0;
const shuffle=a=>a.sort(()=>Math.random()-.5);
function start(){
 first=second=null;lock=false;found=tries=score=0;
 document.querySelector("#pairs").textContent=0;document.querySelector("#tries").textContent=0;document.querySelector("#score").textContent=0;document.querySelector("#msg").textContent="";
 let cards=[];
 pairs.forEach((p,i)=>{cards.push({id:i,t:p[0]},{id:i,t:p[1]})});
 shuffle(cards);
 const g=document.querySelector("#grid");g.innerHTML="";
 cards.forEach(c=>{
  const d=document.createElement("div");d.className="card";d.dataset.id=c.id;
  d.innerHTML=`<div class="inner"><div class="face front">☾</div><div class="face back">${c.t}</div></div>`;
  d.onclick=()=>flip(d);g.appendChild(d);
 });
}
function flip(c){
 if(lock||c.classList.contains("open")||c.classList.contains("matched"))return;
 c.classList.add("open");
 if(!first){first=c;return}
 second=c;tries++;document.querySelector("#tries").textContent=tries;
 if(first.dataset.id===second.dataset.id){
  first.classList.add("matched");second.classList.add("matched");found++;score+=10;
  document.querySelector("#pairs").textContent=found;document.querySelector("#score").textContent=score;
  first=second=null;
  if(found===8)document.querySelector("#msg").textContent="🎉 Mašallah! Pronašao/la si svih 8 parova!";
 }else{
  lock=true;score=Math.max(0,score-1);document.querySelector("#score").textContent=score;
  setTimeout(()=>{first.classList.remove("open");second.classList.remove("open");first=second=null;lock=false},850);
 }
}
start();
</script>
</body></html>
