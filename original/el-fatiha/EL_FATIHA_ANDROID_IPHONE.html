<div class="controls"><button onclick="playPart()">▶ Slušaj dio</button><button onclick="repeatPart(3)">🔁 Ponovi 3×</button><button class="alt" onclick="prev()">◀ Prethodni</button><button class="alt" onclick="next()">Sljedeći ▶</button><button onclick="aud.playbackRate=.78">🐢 Sporije</button><button onclick="aud.playbackRate=1">🎵 Normalno</button><button class="green" onclick="whole()">▶ Cijela Fatiha</button><button class="alt" onclick="resetAll()">↺ Početak</button></div>
<footer>Pripremio Abdo ef. Rekić</footer></div></div>
<script>
const P=[{"a": "الْحَمْدُ لِلَّهِ", "t": "El-hamdu lillāhi", "s": 0.0, "e": 2.05, "ayah": 1}, {"a": "رَبِّ الْعَالَمِينَ", "t": "Rabbil-'ālemīn", "s": 2.05, "e": 5.45, "ayah": 1}, {"a": "الرَّحْمَٰنِ الرَّحِيمِ", "t": "Er-Rahmānir-Rahīm", "s": 5.45, "e": 9.2, "ayah": 2}, {"a": "مَالِكِ يَوْمِ الدِّينِ", "t": "Māliki jevmid-dīn", "s": 9.2, "e": 13.2, "ayah": 3}, {"a": "إِيَّاكَ نَعْبُدُ", "t": "Ijjāke na'budu", "s": 13.2, "e": 15.65, "ayah": 4}, {"a": "وَإِيَّاكَ نَسْتَعِينُ", "t": "ve ijjāke neste'īn", "s": 15.65, "e": 19.2, "ayah": 4}, {"a": "اهْدِنَا الصِّرَاطَ", "t": "Ihdinas-sirāta", "s": 19.2, "e": 21.55, "ayah": 5}, {"a": "الْمُسْتَقِيمَ", "t": "el-mustekīm", "s": 21.55, "e": 24.2, "ayah": 5}, {"a": "صِرَاطَ الَّذِينَ", "t": "Sirātallezīne", "s": 24.2, "e": 26.15, "ayah": 6}, {"a": "أَنْعَمْتَ عَلَيْهِمْ", "t": "en'amte 'alejhim", "s": 26.15, "e": 28.7, "ayah": 6}, {"a": "غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ", "t": "gajril-magdūbi 'alejhim", "s": 28.7, "e": 32.95, "ayah": 6}, {"a": "وَلَا الضَّالِّينَ", "t": "ve led-dāllīn", "s": 32.95, "e": 39.9, "ayah": 6}];let idx=0,view="follow",reps=0,part=false,buildAyah=1,buildCount=1;
const aud=document.getElementById("aud"),$=x=>document.getElementById(x);
let score=JSON.parse(localStorage.getItem("fatihaSmart")||"null")||Array(P.length).fill(0);
function save(){localStorage.setItem("fatihaSmart",JSON.stringify(score))}
function activeByTime(){let t=aud.currentTime;for(let n=0;n<P.length;n++)if(t>=P[n].s&&t<P[n].e)return n;return Math.min(P.length-1,idx)}
function tabs(){["Follow","Build","Smart"].forEach(x=>$("t"+x).classList.toggle("sel",view===x.toLowerCase()))}
function draw(){
 tabs();$("counter").textContent="DIO "+(idx+1)+" OD "+P.length;$("bar").style.width=((aud.currentTime/(aud.duration||39.912))*100)+"%";
 $("meter").innerHTML=score.map(x=>`<span class="cell ${x>=3?'master':x>0?'ok':''}"></span>`).join("");
 if(view==="build"){drawBuild();return} if(view==="smart"){drawSmart();return}
 $("arabic").innerHTML=P.map((p,n)=>`<span class="phrase ${n===idx?'on':n<idx?'past':''}">${p.a}</span>`).join(" ");$("latin").textContent=P[idx].t;$("pointer").textContent="▼ SADA OVDJE ▼";
 $("panel").innerHTML="<b>Uči uz pokazivač.</b><div class='small'>Slušaj 3×, zatim pokušaj proučiti isti dio bez gledanja.</div>";
}
function drawBuild(){
 let arr=P.filter(x=>x.ayah===buildAyah), shown=arr.slice(0,buildCount);
 $("counter").textContent="GRADI AJET "+buildAyah;$("pointer").textContent="1 dio → 1+2 → cijeli ajet";
 $("arabic").innerHTML=`<div class="buildText">${shown.map(x=>x.a).join(" ")}</div>`;$("latin").textContent="";
 $("panel").innerHTML=`<b>Korak ${buildCount} od ${arr.length}</b><div class="small">Prouči sve što vidiš 3×. Kad možeš bez greške, dodaj sljedeći dio.</div><div class="rating"><button onclick="playBuild()">▶ Slušaj izgrađeno</button><button class="green" onclick="addBuild()">+ Dodaj dio</button><button class="alt" onclick="nextBuildAyah()">Sljedeći ajet ▶</button></div>`;
}
function drawSmart(){
 $("counter").textContent="PAMETNO PONAVLJANJE";$("pointer").textContent="Teži dijelovi vraćaju se češće";$("arabic").innerHTML=`<span class="phrase on">${P[idx].a}</span>`;$("latin").textContent=P[idx].t;
 $("panel").innerHTML=`<b>Kako ti je išlo?</b><div class="small">Ocijeni tek nakon što pokušaš proučiti bez pomoći.</div><div class="rating"><button class="red" onclick="rate(0)">😕 Teško</button><button onclick="rate(1)">🙂 Skoro</button><button class="green" onclick="rate(2)">⭐ Znam</button></div>`;
}
function tab(v){view=v;aud.pause();if(v==="smart")idx=pickSmart();draw()}
function playPart(){part=true;reps=0;aud.currentTime=P[idx].s;aud.play()} function repeatPart(n){part=true;reps=n;aud.currentTime=P[idx].s;aud.play()}
function prev(){aud.pause();idx=Math.max(0,idx-1);draw()} function next(){aud.pause();idx=Math.min(P.length-1,idx+1);draw()}
function whole(){view="follow";part=false;idx=0;aud.currentTime=0;aud.play();draw()}
function pickSmart(){let weights=score.map(x=>Math.max(1,6-x));let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;for(let n=0;n<weights.length;n++){r-=weights[n];if(r<=0)return n}return 0}
function rate(v){if(v===0)score[idx]=Math.max(0,score[idx]-1);if(v===1)score[idx]=Math.min(4,score[idx]+1);if(v===2)score[idx]=Math.min(5,score[idx]+2);save();idx=pickSmart();draw()}
function addBuild(){let arr=P.filter(x=>x.ayah===buildAyah);if(buildCount<arr.length)buildCount++;draw()}
function nextBuildAyah(){buildAyah=buildAyah>=6?1:buildAyah+1;buildCount=1;draw()}
function playBuild(){let arr=P.filter(x=>x.ayah===buildAyah),last=arr[Math.min(buildCount,arr.length)-1];idx=P.indexOf(arr[0]);part=true;reps=0;aud.currentTime=arr[0].s;aud.play();window.buildEnd=last.e}
function resetAll(){aud.pause();idx=0;buildAyah=1;buildCount=1;draw()}
aud.addEventListener("timeupdate",()=>{let t=aud.currentTime;$("bar").style.width=((t/(aud.duration||39.912))*100)+"%";
 if(view==="follow"&&!part){let n=activeByTime();if(n!==idx){idx=n;draw()}}
 let end=(window.buildEnd&&view==="build")?window.buildEnd:P[idx].e;
 if(part&&t>=end-.03){aud.pause();window.buildEnd=null;if(reps>1){reps--;setTimeout(()=>{aud.currentTime=P[idx].s;aud.play()},550)}else{reps=0;part=false}}
});
draw();
</script></body></html>
