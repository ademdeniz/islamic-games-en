const audio=document.getElementById("audio");let current=-1,mode="idle",raf=0;
function clear(){document.querySelectorAll(".word.active").forEach(x=>x.classList.remove("active"))}
function showAyah(i){document.body.classList.add("playing");document.querySelectorAll("section").forEach((x,j)=>x.classList.toggle("now",j===i));}
function showAll(){document.body.classList.remove("playing");document.querySelectorAll("section").forEach(x=>x.classList.remove("now"));}
function follow(){clear();if(current>=0){let t=audio.currentTime,c=C[current]||[];for(let i=0;i<c.length;i++){if(t>=c[i][0]&&t<c[i][1]){let e=document.getElementById("v"+current+"w"+i);if(e)e.classList.add("active");break}}}raf=requestAnimationFrame(follow)}
