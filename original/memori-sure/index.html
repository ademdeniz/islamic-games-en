<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no">
<title>Memori – Učenje sura</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} button,select{-webkit-appearance:none;appearance:none;touch-action:manipulation} body{margin:0;font-family:system-ui,Arial;background:#f4eedc;color:#17372d}
.wrap{max-width:900px;margin:auto;padding:12px} header{text-align:center;background:#075943;color:#fff;border:3px solid #c99b3b;border-radius:18px;padding:14px}
h1{margin:0;font-size:clamp(25px,6vw,38px)} .sub{margin:5px}
.selectbox{margin:12px 0;background:#fff;border:2px solid #c99b3b;border-radius:15px;padding:12px}
select{width:100%;font-size:17px;padding:11px;border-radius:10px;border:2px solid #0b684e;background:#fff}
.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px 0} .pill{background:#fff;border:2px solid #c99b3b;border-radius:30px;padding:6px 11px;font-weight:800}
.help{text-align:center;font-weight:700;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{border:0;background:transparent;min-height:105px;perspective:800px;padding:0} .inner{height:100%;min-height:105px;position:relative;transform-style:preserve-3d;transition:.3s}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)} .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;backface-visibility:hidden;box-shadow:0 2px 8px #0002}
.back{background:#075943;border:3px solid #c99b3b;color:#fff;font-size:26px;font-weight:900} .front{transform:rotateY(180deg);background:#fffdf5;border:3px solid #c99b3b;font-size:clamp(11px,2.6vw,16px);font-weight:800}
.matched .front{background:#dcf2df} .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0} .act{border:0;background:#075943;color:#fff;padding:11px 15px;border-radius:11px;font-weight:800;font-size:15px}
#level2{display:none;background:#fff;border:3px solid #c99b3b;border-radius:17px;padding:14px;text-align:center} .ayah{width:100%;margin:6px 0;padding:10px;border:2px solid #c99b3b;background:#fffaf0;border-radius:10px;font-weight:750;font-size:15px} .ok{background:#dcf2df}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.inner,.card{min-height:94px}}
</style></head><body><div class="wrap">
<header><h1>🕌 MEMORI – UČIMO SURE</h1><div class="sub">Od El-Kari'a do En-Nas + El-Fatiha + Elif-Lam-Mim</div><b>Pripremio: Abdo ef. Rekić</b></header>
<div class="selectbox"><b>Izaberi suru:</b><select id="surah"></select></div>
<div class="stats"><span class="pill">Parovi: <span id="pairs">0</span>/<span id="total">0</span></span><span class="pill">Pokušaji: <span id="tries">0</span></span><span class="pill">⭐ <span id="score">0</span></span></div>
<div class="help">Pronađi dvije iste kartice. Kad pronađeš par, prouči tekst naglas.</div>
<div id="grid" class="grid"></div>
<div class="actions"><button id="restart" class="act">🔄 Nova igra</button><button id="showOrder" class="act">📖 Slaganje sure</button></div>
<section id="level2"><h2>🧩 Poredaj suru</h2><p>Dodiruj ajete/redove pravilnim redoslijedom.</p><div id="order"></div><p id="msg"></p><button id="again" class="act">🔀 Ponovi slaganje</button></section>
</div>
<script>
const S={"El-Kari'a": ["El-Kari'ah", "Mel-kari'ah", "Ve ma edrake mel-kari'ah", "Jevme jekunun-nasu kel-ferašil-mebsus", "Ve tekunul-džibalu kel-'ihnil-menfuš", "Fe emma men sekulet mevazinuhu", "Fe huve fi 'išetin radijeh", "Ve emma men haffet mevazinuhu", "Fe ummuhu havijeh", "Ve ma edrake ma hijeh", "Narun hamijeh"], "Et-Tekasur": ["Elhakumut-tekasur", "Hatta zurtumul-mekabir", "Kella sevfe ta'lemun", "Summe kella sevfe ta'lemun", "Kella lev ta'lemune 'ilmel-jekin", "Le teravunnel-džehim", "Summe le teravunneha 'ajnel-jekin", "Summe le tus'elunne jevmeizin 'anin-ne'im"], "El-'Asr": ["Vel-'asr", "Innel-insane lefi husr", "Illel-lezine amenu ve 'amilus-salihat ve tevasav bil-hakki ve tevasav bis-sabr"], "El-Humeze": ["Vejlun li kulli humezetil-lumezeh", "El-lezi džeme'a malen ve 'addedeh", "Jahsebu enne malehu ahledeh", "Kella le junbezenne fil-hutameh", "Ve ma edrake mel-hutameh", "Narullahil-mukadeh", "Elleti tettali'u 'alel-ef'ideh", "Inneha 'alejhim mu'sadeh", "Fi 'amedim mumeddedeh"], "El-Fil": ["Elem tere kejfe fe'ale rabbuke bi-ashabil-fil", "Elem jedž'al kejdehum fi tadlil", "Ve ersele 'alejhim tajren ebabil", "Termihim bi hidžaretim min sidždžil", "Fe dže'alehum ke'asfim me'kul"], "Kurejš": ["Li ilafi Kurejš", "Ilafihim rihleteš-šitai ves-sajf", "Fel-ja'budu rabbe hazel-bejt", "Ellezi at'amehum min džu'in ve amenehum min havf"], "El-Ma'un": ["Ere'ejtellezi jukezzibu bid-din", "Fe zalikellezi jedu'ul-jetim", "Ve la jehuddu 'ala ta'amil-miskin", "Fe vejlul lil-musallin", "El-lezine hum 'an salatihim sahun", "El-lezine hum juraun", "Ve jemne'unel-ma'un"], "El-Kevser": ["Inna e'atajnakel-kevser", "Fe salli li rabbike venhar", "Inne šanieke huvel-ebter"], "El-Kafirun": ["Kul ja ejjuhel-kafirun", "La e'abudu ma ta'budun", "Ve la entum 'abidune ma e'abud", "Ve la ene 'abidum ma 'abedtum", "Ve la entum 'abidune ma e'abud", "Lekum dinukum ve lije din"], "En-Nasr": ["Iza dža'e nasrullahi vel-feth", "Ve re'ejten-nase jedhulune fi dinillahi efvadža", "Fe sebbih bi hamdi rabbike vestagfirh, innehu kane tevvaba"], "El-Leheb": ["Tebbet jeda ebi lehebin ve tebb", "Ma agna 'anhu maluhu ve ma keseb", "Se jasla naren zate leheb", "Vemre'etuhu hammaletel-hatab", "Fi džidiha hablun min mesed"], "El-Ihlas": ["Kul huvallahu ehad", "Allahus-samed", "Lem jelid ve lem juled", "Ve lem jekun lehu kufuven ehad"], "El-Felek": ["Kul e'uzu bi rabbil-felek", "Min šerri ma halek", "Ve min šerri gasikin iza vekab", "Ve min šerrin-neffasati fil-'ukad", "Ve min šerri hasidin iza hased"], "En-Nas": ["Kul e'uzu bi rabbin-nas", "Melikin-nas", "Ilahin-nas", "Min šerril-vesvasil-hannas", "Ellezi juvesvisu fi sudurin-nas", "Minel-džinneti ven-nas"], "El-Fatiha": ["Bismillahir-Rahmanir-Rahim", "El-hamdu lillahi Rabbil-'alemin", "Er-Rahmanir-Rahim", "Maliki jevmid-din", "Ijjake na'budu ve ijjake neste'in", "Ihdinas-siratal-mustekim", "Siratal-lezine en'amte alejhim, gajril-magdubi alejhim ve led-dallin"], "Elif-Lam-Mim (El-Bekare 1–5)": ["Elif-Lam-Mim", "Zalikel-kitabu la rejbe fih, huden lil-muttekin", "El-lezine ju'minune bil-gajbi ve jukimunes-salate ve mimma rezaknahum junfikun", "Vellezine ju'minune bima unzile ilejke ve ma unzile min kablike ve bil-ahireti hum jukinun", "Ulaike 'ala huden min rabbihim ve ulaike humul-muflihun"]};
const sel=document.getElementById('surah'),grid=document.getElementById('grid'),level2=document.getElementById('level2'),order=document.getElementById('order'),msg=document.getElementById('msg');
Object.keys(S).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});
let first=null,lock=false,matched=0,tries=0,score=0,current=[];
const sh=a=>[...a].sort(()=>Math.random()-.5);
function tone(ok){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let A=new AC(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=ok?650:190;g.gain.value=.06;o.start();o.stop(A.currentTime+.1)}catch(e){}}
function game(){
 current=S[sel.value]; first=null;lock=false;matched=tries=score=0;level2.style.display='none';grid.innerHTML='';
 pairs.textContent=tries;document.getElementById('tries').textContent=0;document.getElementById('score').textContent=0;total.textContent=current.length;
 let cards=[];current.forEach((t,i)=>{cards.push({id:i,t});cards.push({id:i,t})});sh(cards).forEach(x=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="inner"><div class="face back">☪</div><div class="face front">'+x.t+'</div></div>';b.addEventListener('click',()=>flip(b,x.id));grid.appendChild(b)})
}
function flip(c,id){if(lock||c===first?.c||c.classList.contains('matched'))return;c.classList.add('open');if(!first){first={c,id};return}tries++;document.getElementById('tries').textContent=tries;if(first.id===id){c.classList.add('matched');first.c.classList.add('matched');matched++;score+=10;pairs.textContent=matched;document.getElementById('score').textContent=score;tone(1);first=null;if(matched===current.length)setTimeout(startOrder,500)}else{lock=true;score=Math.max(0,score-1);document.getElementById('score').textContent=score;tone(0);let a=first.c;first=null;setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');lock=false},650)}}
let next=0;
function startOrder(){level2.style.display='block';next=0;order.innerHTML='';msg.textContent='Pronađi prvi red sure.';sh(current.map((t,i)=>({t,i}))).forEach(x=>{let b=document.createElement('button');b.className='ayah';b.textContent=x.t;b.addEventListener('click',()=>{if(x.i===next){b.classList.add('ok');b.disabled=true;next++;tone(1);msg.textContent=next===current.length?'🏆 Mašallah! Sura je pravilno složena. Sada je prouči cijelu napamet.':'Tačno! Koji dio ide sljedeći?'}else{tone(0);msg.textContent='Pokušaj ponovo – to još nije sljedeći dio.'}});order.appendChild(b)});level2.scrollIntoView()}
sel.addEventListener('change',game);document.getElementById('restart').addEventListener('click',game);document.getElementById('showOrder').addEventListener('click',startOrder);document.getElementById('again').addEventListener('click',startOrder);
game();
</script></body></html>
