function download(text,name,type){const blob=new Blob([text],{type});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}

function stop(){token++;sequence=false;playing=false;audio.pause();bAudio.pause();cancelAnimationFrame(raf);$('all').textContent='▶ Uči redom';$('play').textContent='▶ Uči ajet'}
function render(){cancelAnimationFrame(raf);$('count').textContent='Ajet '+(idx+1)+' / 4';$('words').innerHTML='';WORDS[idx].forEach((w,j)=>{let el=document.createElement('button');el.className='word';el.textContent=w;el.dataset.j=j;el.onclick=()=>tap(j);$('words').append(el)});$('numbers').innerHTML='';for(let i=0;i<4;i++){let b=document.createElement('button');b.textContent=i+1;b.className=i===idx?'active':'';b.onclick=()=>{stop();idx=i;render()};$('numbers').append(b)};mark(-1)}
function mark(j){[...$('words').children].forEach((el,i)=>el.classList.toggle('active',i===j))}
function tick(){if(!playing)return;let t=audio.currentTime,j=cues[idx].findIndex(([a,b],i)=>t>=a&&(t<(b>a?b:DUR[idx])||i===cues[idx].length-1&&t<=DUR[idx]));mark(j);raf=requestAnimationFrame(tick)}
async function run(oneSequence=false){stop();sequence=oneSequence;let my=++token;repeatCount=0;$('all').textContent=sequence?'■ Zaustavi redom':'▶ Uči redom';if(idx===0){try{status.textContent='Uči se Bismilla';bAudio.currentTime=0;await bAudio.play();await new Promise(resolve=>{bAudio.onended=resolve;bAudio.onerror=resolve});if(my!==token)return}catch(e){status.textContent='Dodirnite dugme za pokretanje zvuka'}}await playVerse(my)}
async function playVerse(my){if(my!==token)return;playing=true;audio.src=SOUNDS[idx];audio.currentTime=0;$('play').textContent='⏸ Pauza';status.textContent='Učenje ajeta '+(idx+1);audio.onended=async()=>{if(my!==token)return;playing=false;cancelAnimationFrame(raf);mark(-1);repeatCount++;const n=Number($('repeat').value);if(!sequence&&(n===0||repeatCount<n)){await playVerse(my);return}if(sequence&&idx<3){idx++;repeatCount=0;render();await playVerse(my);return}stop();status.textContent='Učenje završeno'};try{await audio.play();tick()}catch(e){playing=false;status.textContent='Zvuk nije pokrenut. Dodirnite Uči ajet.'}}
