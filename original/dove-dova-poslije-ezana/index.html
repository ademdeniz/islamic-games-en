function render(){$('learn').classList.toggle('hide',mode!=='learn');$('quiz').classList.toggle('hide',mode!=='quiz');$('learnTab').classList.toggle('active',mode==='learn');$('quizTab').classList.toggle('active',mode==='quiz');if(mode!=='learn')return;let d=D[i];$('counter').textContent=`Dio ${i+1} od ${D.length}`;$('arab').innerHTML=d[0].split(/\s+/).map(w=>`<span class="word" onclick="this.classList.toggle('mark')">${w}</span>`).join(' ');$('trans').textContent=d[1];$('meaning').textContent=d[2];$('status').textContent=auto?'Uči redom':loop?'Ponavljaj':''}
