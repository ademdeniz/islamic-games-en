<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sifati – Pronađi riječ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(160deg,#17224d,#553b7b);font-family:Arial;color:#fff}
.app{max-width:560px;min-height:100vh;margin:auto;padding:8px;text-align:center}.top{background:#251d55;border:2px solid #e9c45e;border-radius:14px;padding:8px}
h1{font-size:20px;color:#ffe58c;margin:0}.stats{display:flex;justify-content:space-between;margin-top:5px;font-weight:bold}.clue{margin:7px 0;background:#f0eaff;color:#241a49;border:3px solid #e1ba51;border-radius:14px;padding:8px;font-weight:bold;min-height:60px}
.board{width:min(94vw,500px);height:min(94vw,500px);margin:auto;display:grid;gap:2px;background:#c9c2eb;border:4px solid #e5bc52;border-radius:12px;padding:4px;touch-action:none}
.cell{background:#fff;color:#201749;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:3px;font-size:clamp(10px,3.5vw,20px);user-select:none}.sel{background:#ffd95e}.found{background:#69d4ae}
.msg{min-height:28px;padding:5px;color:#ffe78d;font-weight:bold}.buttons{display:flex;gap:7px}.buttons button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:bold}.help{background:#ddd2ff}.new{background:#e4bc53}.foot{font-size:12px;margin-top:7px;color:#ddd}
@media(max-height:720px){.board{width:min(68vh,92vw);height:min(68vh,92vw)}.clue{min-height:45px;padding:5px}h1{font-size:17px}}
</style></head><body><div class="app"><div class="top"><h1>PRONAĐI RIJEČ – SIFATI</h1><div>Allahova svojstva</div><div class="stats"><span>Zadatak <b id="num">1</b>/<b id="total">16</b></span><span>Bodovi: <b id="score">0</b></span></div></div>
<div class="clue" id="clue"></div><div class="board" id="board"></div><div class="msg" id="msg">Dodirni prvo slovo, pa posljednje slovo riječi.</div>
<div class="buttons"><button class="help" id="hint">💡 Pomoć −2</button><button class="new" id="restart">↻ Nova igra</button></div><div class="foot">Pripremio Abdo ef. Rekić</div></div>
<script>
var items=[
["VUDZUD","Allah postoji."],["KIDEM","Allah je oduvijek; Njegovom postojanju nema početka."],["BEKA","Allah je zauvijek; Njegovom postojanju nema kraja."],
["MUHALEFETUNLILHAVADISI","Allah nije ničemu sličan."],["KIJAMUNBINEFSIHI","Allah sam po Sebi opstoji."],["VAHDANIJJET","Allah je Jedan."],
["SIFATUZZATIJJE","Naziv za šest svojstava: Vudžud, Kidem, Beka, Muhalefetun lil-havadisi, Kijamun bi nefsihi i Vahdanijjet."],
["HAJAT","Allah živi Svojim vječnim životom."],["ILM","Allah sve zna."],["SEM","Allah sve čuje."],["BESAR","Allah sve vidi."],["IRADET","Allah sve Svojom voljom čini."],
["KUDRET","Allah je Svemoćan."],["KELAM","Allah govori Svojim božanskim govorom."],["TEKVIN","Allah sve stvara, održava i rastvara."],
["SIFATUSSUBUTIJJE","Naziv za svojstva: Hajat, Ilm, Sem', Besar, Iradet, Kudret, Kelam i Tekvin."]];
var order=[],pos=0,score=0,N=15,grid=[],answer="",answerPath=[],first=null;
function E(x){return document.getElementById(x)}
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t}return b}
function start(){order=shuffle(items);pos=0;score=0;E("score").innerHTML=score;load()}
function load(){
 if(pos>=order.length){E("clue").innerHTML="Bravo! Završio/la si igru.";E("msg").innerHTML="Ukupno bodova: "+score;E("board").innerHTML="";return}
 answer=order[pos][0];N=Math.max(15,answer.length);grid=[];var y,x;for(y=0;y<N;y++){grid[y]=[];for(x=0;x<N;x++)grid[y][x]=""}
 var dirs=[[1,0],[-1,0],[0,1],[0,-1]],d,sx,sy,ex,ey,k,ok=false;
 for(var t=0;t<3000&&!ok;t++){d=dirs[Math.floor(Math.random()*dirs.length)];sx=Math.floor(Math.random()*N);sy=Math.floor(Math.random()*N);ex=sx+d[0]*(answer.length-1);ey=sy+d[1]*(answer.length-1);if(ex>=0&&ex<N&&ey>=0&&ey<N)ok=true}
 answerPath=[];for(k=0;k<answer.length;k++){x=sx+d[0]*k;y=sy+d[1]*k;grid[y][x]=answer.charAt(k);answerPath.push([x,y])}
 var L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";for(y=0;y<N;y++)for(x=0;x<N;x++)if(grid[y][x]=="")grid[y][x]=L.charAt(Math.floor(Math.random()*L.length));
 E("num").innerHTML=pos+1;E("clue").innerHTML=order[pos][1];E("msg").innerHTML="Dodirni prvo slovo, pa posljednje slovo riječi.";first=null;render()
}
function render(){var b=E("board");b.innerHTML="";b.style.gridTemplateColumns="repeat("+N+",1fr)";var y,x,c;for(y=0;y<N;y++)for(x=0;x<N;x++){c=document.createElement("div");c.className="cell";c.innerHTML=grid[y][x];c.setAttribute("data-x",x);c.setAttribute("data-y",y);c.onclick=pick;b.appendChild(c)}}
function pick(){var x=parseInt(this.getAttribute("data-x")),y=parseInt(this.getAttribute("data-y"));if(first==null){first=[x,y];this.className="cell sel";E("msg").innerHTML="Sada dodirni posljednje slovo riječi.";return}
 var dx=x-first[0],dy=y-first[1],steps=Math.max(Math.abs(dx),Math.abs(dy));if(steps==0){clearSel();return}
 if(!(dx==0||dy==0)){wrong();return}
 var sx=dx==0?0:dx/Math.abs(dx),sy=dy==0?0:dy/Math.abs(dy),word="",cells=[],cx=first[0],cy=first[1];
 for(var k=0;k<=steps;k++){word+=grid[cy][cx];cells.push([cx,cy]);cx+=sx;cy+=sy}
 var rev=answer.split("").reverse().join("");
 if(word==answer||word==rev){score+=10;E("score").innerHTML=score;E("msg").innerHTML="✓ Tačno! +10";paint(cells,"found");tone(700);setTimeout(function(){pos++;load()},800)}
 else wrong()
}
function wrong(){score=Math.max(0,score-3);E("score").innerHTML=score;E("msg").innerHTML="Pokušaj ponovo. −3";tone(180);clearSel()}
function clearSel(){var a=document.querySelectorAll(".sel");for(var i=0;i<a.length;i++)a[i].className="cell";first=null}
function paint(cells,cl){for(var i=0;i<cells.length;i++){var q=document.querySelector('[data-x="'+cells[i][0]+'"][data-y="'+cells[i][1]+'"]');if(q)q.className="cell "+cl}}
function tone(f){try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}}
E("hint").onclick=function(){score=Math.max(0,score-2);E("score").innerHTML=score;E("msg").innerHTML="Riječ ima "+answer.length+" slova. Počinje slovom „"+answer.charAt(0)+"“."};E("restart").onclick=start;start();
</script></body></html>
