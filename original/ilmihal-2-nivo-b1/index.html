let quiz=[],i=0,score=0,correct=0,locked=false;const $=id=>document.getElementById(id);
let audioCtx=null;
function initAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,type='sine',delay=0,vol=.12){try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur)}catch(e){}}
function soundCorrect(){tone(523,.14,'sine',0,.13);tone(659,.16,'sine',.12,.13);tone(784,.24,'sine',.25,.14)}
function soundWrong(){tone(220,.18,'sawtooth',0,.10);tone(165,.30,'sawtooth',.15,.10)}
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function pick(a,n){return shuffle([...a]).slice(0,n)}
function begin(){initAudio();quiz=[...pick(BANKS.A3,5).map(q=>({...q,level:'A3'})),...pick(BANKS.B1,25).map(q=>({...q,level:'B1'}))];$('start').style.display='none';$('game').style.display='block';show()}
function show(){locked=false;$('aud').style.display='none';$('bars').innerHTML='';$('msg').textContent='';let q=quiz[i];$('prog').textContent=`Pitanje ${i+1}/30`;$('lvl').textContent=`Baza: ${q.level}`;$('score').textContent=`Bodovi: ${score}`;$('question').textContent=q.q;let items=Object.entries(q.opts).map(([key,text])=>({key,text,ok:key===q.answer}));shuffle(items);$('answers').innerHTML='';items.forEach((x,n)=>{let b=document.createElement('button');b.className='ans';b.dataset.ok=x.ok?'1':'0';b.dataset.orig=x.key;b.textContent=`${'ABCD'[n]}) ${x.text}`;b.onclick=()=>answer(b);$('answers').appendChild(b)})}
function answer(b){if(locked)return;locked=true;let ok=b.dataset.ok==='1';if(ok){score+=10;correct++;b.classList.add('good');soundCorrect();$('msg').textContent='TAČNO! +10 bodova'}else{score-=3;b.classList.add('bad');soundWrong();[...document.querySelectorAll('.ans')].find(x=>x.dataset.ok==='1')?.classList.add('good');$('msg').textContent='NETAČNO! −3 boda'}$('score').textContent=`Bodovi: ${score}`;setTimeout(()=>{i++;if(i<quiz.length)show();else finish()},1200)}
function half(){if(locked)return;$('half').disabled=true;let wrong=shuffle([...document.querySelectorAll('.ans')].filter(x=>x.dataset.ok!=='1'));wrong.slice(0,2).forEach(x=>x.classList.add('hide'))}
function audience(){if(locked)return;$('pub').disabled=true;$('aud').style.display='block';let btns=[...document.querySelectorAll('.ans')];let ci=btns.findIndex(x=>x.dataset.ok==='1');let good=55+Math.floor(Math.random()*26),rest=100-good,vals=[0,0,0,0];vals[ci]=good;let ids=[0,1,2,3].filter(x=>x!==ci);for(let k=0;k<2;k++){let v=Math.floor(Math.random()*(rest+1));vals[ids[k]]=v;rest-=v}vals[ids[2]]=rest;$('bars').innerHTML=vals.map((v,k)=>`<div><div class="bar" style="height:${v}px"></div><div class="lab">${'ABCD'[k]} ${v}%</div></div>`).join('')}
function teacher(){if(locked)return;$('teach').disabled=true;let btns=[...document.querySelectorAll('.ans')],ci=btns.findIndex(x=>x.dataset.ok==='1');$('msg').textContent=`Muallim smatra da je odgovor ${'ABCD'[ci]}.`}
function finish(){$('game').style.display='none';$('finish').style.display='block';$('final').textContent=`Osvojeno: ${score} bodova`;$('stats').textContent=`Tačnih odgovora: ${correct} od 30 • Netačnih: ${30-correct}`}
</script></body></html>
