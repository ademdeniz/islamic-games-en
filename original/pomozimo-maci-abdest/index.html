ation:pop .25s forwards!important}.wrong{animation:shake .25s 2}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

</style></head><body><div id="game"><div class="shade"></div><button id="sound" aria-label="Zvuk">🔊</button><div id="collected"><span class="collectedLabel">SAKUPLJENO:</span></div><div id="hud">BODOVI<div class="score" id="score">0</div><div class="progress" id="progress">Korak 0 / 13</div></div><div id="message"></div><button id="start">▶ ZAPOČNI IGRU</button></div><script>
const steps=[
{text:'Euza, bismilla i nijet',icon:'🤲'},
{text:'Šake 3x',icon:'👐'},
{text:'Usta 3x',icon:'👄'},
{text:'Nos 3x',icon:'👃'},
{text:'Lice 3x',icon:'🧒'},
{text:'Desnu ruku do iza laktova 3x',icon:'💪'},
{text:'Lijevu ruku do iza laktova 3x',icon:'💪'},
{text:'Mesh',icon:'🧒'},
{text:'Uši',icon:'👂'},
{text:'Vrat',icon:'🧣'},
{text:'Desnu nogu do članaka',icon:'🦶'},
{text:'Lijevu nogu do članaka',icon:'🦶'},
{text:'Kelimei-šehadet',icon:'☝️'}
];
const game=document.getElementById('game'),collected=document.getElementById('collected'),scoreEl=document.getElementById('score'),prog=document.getElementById('progress'),msg=document.getElementById('message'),start=document.getElementById('start');let score=0,next=0,timer=null,running=false,soundOn=true,audioCtx=null;
function tone(freq,dur,type='sine'){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}
function good(){tone(660,.12);setTimeout(()=>tone(880,.16),100)}function bad(){tone(170,.22,'sawtooth')}
function shuffled(){return [...steps.keys()].sort(()=>Math.random()-.5)}
function spawn(){if(!running)return;let ids=shuffled().slice(0,Math.min(5,steps.length));if(!ids.includes(next)&&next<steps.length)ids[Math.floor(Math.random()*ids.length)]=next;ids.forEach((id,i)=>{setTimeout(()=>makeDrop(id),i*380)});timer=setTimeout(spawn,4300)}
function makeDrop(id){if(!running)return;const b=document.createElement('button');b.className='drop';b.dataset.id=id;b.style.left=(2+Math.random()*82)+'%';b.style.animationDuration=(10.5+Math.random()*3.5)+'s';b.innerHTML='<div class="dropShape"><div class="dropText">'+'<span class="dropIcon">'+steps[id].icon+'</span><span>'+steps[id].text+'</span></div></div>';b.addEventListener('click',()=>hit(b,id));b.addEventListener('animationend',()=>b.remove());game.appendChild(b)}
function addCollected(id){const d=document.createElement('div');d.className='miniDrop';d.title=steps[id].text;const icons=['🤲','👐','👄','👃','🙂','💪','💪','🧑‍🦱','👂','🧣','🦶','🦶','☝️'];d.innerHTML='<span class="miniIcon">'+icons[id]+'</span>';collected.appendChild(d);collected.scrollLeft=collected.scrollWidth}function hit(b,id){if(!running)return;if(id===next){score+=10;addCollected(id);next++;good();floatText(b,'+10');b.classList.add('pop');setTimeout(()=>b.remove(),240);prog.textContent='Korak '+next+' / 13';if(next===steps.length)finish()}else{score=Math.max(0,score-3);bad();floatText(b,'−3');b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500)}scoreEl.textContent=score}
function floatText(b,t){const r=b.getBoundingClientRect(),g=game.getBoundingClientRect(),e=document.createElement('div');e.className='plus';e.textContent=t;e.style.left=(r.left-g.left+r.width/2)+'px';e.style.top=(r.top-g.top+r.height/2)+'px';game.appendChild(e);setTimeout(()=>e.remove(),750)}
function finish(){running=false;clearTimeout(timer);document.querySelectorAll('.drop').forEach(x=>x.remove());msg.innerHTML='🎉 Bravo! Maca je pravilno uzela abdest!<br>Osvojeno: '+score+' bodova 🐾';msg.style.display='block';start.textContent='↻ IGRAJ PONOVO';start.style.display='block';good();setTimeout(good,350)}
function begin(){document.querySelectorAll('.drop').forEach(x=>x.remove());score=0;next=0;collected.innerHTML='<span class="collectedLabel">SAKUPLJENO:</span>';scoreEl.textContent=0;prog.textContent='Korak 0 / 13';msg.style.display='none';start.style.display='none';running=true;clearTimeout(timer);spawn()}
start.addEventListener('click',begin);document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇'});
</script></body></html>
