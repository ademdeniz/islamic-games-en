<!doctype html><html lang="bs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#123b2b">
<title>Ramazanski put</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;min-height:100dvh;font-family:Arial,sans-serif;background:linear-gradient(#09281e,#18553c);color:#fff;padding:12px max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.wrap{max-width:820px;margin:auto}.head{text-align:center}.head h1{margin:6px 0;color:#ffd76b;font-size:clamp(28px,7vw,48px)}.sub{font-weight:700}.author{opacity:.9;margin:5px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.pill{background:#fff;color:#143629;border-radius:999px;padding:8px 14px;font-weight:800}
.road{position:relative;height:240px;border:4px solid #e8c665;border-radius:24px;overflow:hidden;background:linear-gradient(#8bd7f2 0 48%,#75bd62 48%);box-shadow:0 8px 25px #0006}
.moon{position:absolute;right:30px;top:20px;width:62px;height:62px;border-radius:50%;background:#ffe88a;box-shadow:0 0 22px #ffe88a}.moon:after{content:"";position:absolute;left:19px;top:-7px;width:62px;height:62px;border-radius:50%;background:#8bd7f2}
.mosque{position:absolute;right:20px;bottom:35px;font-size:80px}.path{position:absolute;left:-5%;bottom:-50px;width:110%;height:160px;background:#d9b77a;clip-path:polygon(0 65%,100% 0,100% 55%,0 100%)}
.steps{position:absolute;inset:0}.step{position:absolute;width:24px;height:24px;border-radius:50%;background:#66421e;border:3px solid #f7d978;opacity:.18;transition:.35s}.step.on{opacity:1;transform:scale(1.15)}
.card{background:#fff;color:#17241e;border-radius:22px;padding:18px;margin-top:12px;box-shadow:0 8px 25px #0005}.q{font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.25;margin:3px 0 15px}.answers{display:grid;gap:10px}.ans{border:0;border-radius:15px;padding:14px;text-align:left;font-size:17px;font-weight:800;background:#f2ead0;color:#17382b;box-shadow:0 3px 0 #c9a95c;min-height:52px}.ans:active{transform:translateY(2px)}.ans.good{background:#b9edc2}.ans.bad{background:#ffc1c1}.feedback{min-height:28px;text-align:center;font-weight:900;margin-top:10px}.bar{height:14px;background:#173629;border-radius:10px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:#ffd75d;transition:.4s}
.finish{display:none;text-align:center;background:#fff;color:#17382b;border-radius:24px;padding:28px;margin-top:14px}.finish .big{font-size:76px}.restart{border:0;border-radius:14px;background:#174f39;color:white;font-size:18px;font-weight:900;padding:14px 22px}
.note{text-align:center;font-size:13px;opacity:.85;margin:8px}
</style></head><body><main class="wrap">
<div class="head"><h1>🌙 RAMAZANSKI PUT</h1><div class="sub">Kviz znanja o ramazanu</div><div class="author">Pripremio Abdo ef. Rekić</div></div>
<div class="stats"><div class="pill">⭐ Bodovi: <span id="score">0</span></div><div class="pill">✅ Tačno: <span id="correct">0</span></div><div class="pill">❓ Pitanje: <span id="asked">0</span>/20</div></div>
<div class="bar"><i id="bar"></i></div>
<section class="road"><div class="moon"></div><div class="path"></div><div class="steps" id="steps"></div><div class="mosque">🕌</div></section>
<section class="card" id="play"><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></section>
<section class="finish" id="finish"><div class="big">🌙🕌✨</div><h2>Stigao si do kraja Ramazanskog puta!</h2><p>Tačnih odgovora: <b id="fc"></b> od 20</p><p>Osvojeno bodova: <b id="fs"></b></p><button class="restart" onclick="start()">Igraj ponovo</button></section>
<div class="note">Pri svakom pokretanju biraju se druga pitanja i miješaju odgovori.</div>
</main><script>
const BANK=[{"q": "Koji je mjesec posta u islamu?", "a": ["Muharrem", "Ramazan", "Redžeb", "Ša'ban"], "c": 1}, {"q": "Koji je post obavezan muslimanima koji ispunjavaju uvjete?", "a": ["Post mjeseca ramazana", "Post svakog ponedjeljka", "Post šest dana ševvala", "Post na dan Arefata"], "c": 0}, {"q": "Kako se zove obrok koji se jede prije početka dnevnog posta?", "a": ["Iftar", "Sehur", "Akšam", "Sadaka"], "c": 1}, {"q": "Kako se zove obrok kojim postač završava dnevni post?", "a": ["Sehur", "Iftar", "Ručak", "Zekat"], "c": 1}, {"q": "Kada počinje dnevni ramazanski post?", "a": ["Izlaskom sunca", "Nakon podne-namaza", "Nastupanjem zore", "Nakon sabaha"], "c": 2}, {"q": "Kada se završava dnevni ramazanski post?", "a": ["U podne", "Zalaskom sunca", "Poslije jacije", "U ponoć"], "c": 1}, {"q": "Kako se zove namaz koji se posebno klanja noću u ramazanu?", "a": ["Teravih-namaz", "Dženaza-namaz", "Istihara-namaz", "Bajram-namaz"], "c": 0}, {"q": "Koja je sveta knjiga počela biti objavljivana u mjesecu ramazanu?", "a": ["Tevrat", "Zebur", "Kur'an", "Indžil"], "c": 2}, {"q": "Kako se zove noć koja je vrednija od hiljadu mjeseci?", "a": ["Lejletul-Berat", "Lejletul-Kadr", "Lejletur-Regaib", "Lejletul-Mi'radž"], "c": 1}, {"q": "U kojoj suri se posebno govori o Lejletul-Kadru?", "a": ["El-Kadr", "El-Fatiha", "En-Nas", "El-Felek"], "c": 0}, {"q": "U kojem dijelu ramazana muslimani posebno tragaju za Lejletul-Kadrom?", "a": ["U prvih deset noći", "U sredini mjeseca", "U posljednjih deset noći", "Samo prve noći"], "c": 2}, {"q": "Šta znači nijjet za post?", "a": ["Namjera da se posti", "Poseban ramazanski obrok", "Davanje sadake", "Učenje ezana"], "c": 0}, {"q": "Koja od ovih radnji kvari post ako se učini namjerno tokom vremena posta?", "a": ["Spavanje", "Namjerno jedenje", "Učenje Kur'ana", "Davanje sadake"], "c": 1}, {"q": "Šta postač treba učiniti ako iz zaborava nešto pojede ili popije?", "a": ["Nastaviti post kada se sjeti", "Odmah prekinuti post", "Ne postiti ostatak ramazana", "Dati zekat"], "c": 0}, {"q": "Koja je lijepa praksa pri iftaru?", "a": ["Bez potrebe odgađati iftar", "Iftariti kada nastupi vrijeme", "Iftariti prije zalaska sunca", "Preskočiti iftar"], "c": 1}, {"q": "Šta je lijepo učiniti sa sehurom?", "a": ["Potpuno ga izostaviti", "Ustati na sehur", "Jesti poslije izlaska sunca", "Jesti tek nakon podne"], "c": 1}, {"q": "Koje djelo je posebno pohvalno u ramazanu?", "a": ["Učenje Kur'ana", "Svađa", "Ogovaranje", "Rasipanje hrane"], "c": 0}, {"q": "Kako se zove obavezno izdvajanje koje se daje određenim kategorijama ljudi kada su ispunjeni uvjeti?", "a": ["Zekat", "Iftar", "Sehur", "Tekbir"], "c": 0}, {"q": "Kako se zove posebna sadaka vezana za završetak ramazana?", "a": ["Sadekatul-fitr", "Mehr", "Kurban", "Keffaret"], "c": 0}, {"q": "Koji blagdan dolazi nakon završetka ramazana?", "a": ["Kurban-bajram", "Ramazanski bajram", "Nova hidžretska godina", "Mevlud"], "c": 1}, {"q": "Koji namaz se klanja ujutro prvog dana Ramazanskog bajrama?", "a": ["Teravih-namaz", "Bajram-namaz", "Vitr-namaz", "Dženaza-namaz"], "c": 1}, {"q": "Šta post, pored uzdržavanja od hrane i pića, uči vjernika?", "a": ["Strpljenju i samokontroli", "Rasipanju", "Ljutnji", "Nemaru"], "c": 0}, {"q": "Kako se treba ponašati prema drugima tokom posta?", "a": ["Lijepo i strpljivo", "Svađalački", "Grubo", "Oholo"], "c": 0}, {"q": "Šta je posebno vrijedno činiti siromašnima i potrebnima u ramazanu?", "a": ["Pomagati ih i dijeliti sadaku", "Izbjegavati ih", "Tražiti od njih poklone", "Zaboraviti na njih"], "c": 0}, {"q": "Koja je dova i ibadet posebno važna tokom cijelog ramazana?", "a": ["Obraćanje Allahu dovom", "Samo razgovor o hrani", "Spavanje cijelog dana", "Odustajanje od namaza"], "c": 0}, {"q": "Kako se zove povlačenje radi ibadeta u džamiji, naročito u posljednjih deset dana ramazana?", "a": ["I'tikaf", "Tejemum", "Ikamet", "Telbija"], "c": 0}, {"q": "Šta musliman nastoji povećati u ramazanu?", "a": ["Dobra djela", "Svađe", "Gubljenje vremena", "Ružan govor"], "c": 0}, {"q": "Šta treba čuvati dok postimo, osim stomaka?", "a": ["Jezik i ponašanje", "Samo odjeću", "Samo obuću", "Samo vrijeme spavanja"], "c": 0}, {"q": "Koji namaz ostaje obavezan i tokom ramazana?", "a": ["Pet dnevnih namaza", "Samo teravija", "Samo bajram-namaz", "Samo vitr"], "c": 0}, {"q": "Čime završava naš „Ramazanski put“ nakon mjeseca posta?", "a": ["Ramazanskim bajramom", "Početkom redžeba", "Kurbanom", "Hidžrom"], "c": 0}, {"q": "Kakav je propis posta mjeseca ramazana za muslimana koji ispunjava uvjete?", "a": ["Farz", "Sunnet", "Mekruh", "Mubah"], "c": 0}, {"q": "Ko je dužan postiti ramazan?", "a": ["Svako dijete bez obzira na dob", "Punoljetan, razuman i zdrav musliman", "Samo imam", "Samo starije osobe"], "c": 1}, {"q": "Da li dijete koje još nije šerijatski punoljetno ima obavezu posta kao odrasla osoba?", "a": ["Da, uvijek", "Ne, ali se postepeno navikava na post", "Samo petkom", "Samo posljednji dan ramazana"], "c": 1}, {"q": "Ko može privremeno izostaviti post zbog opravdanog razloga?", "a": ["Bolesnik kojem bi post štetio ili otežao bolest", "Svako ko ne želi ustati na sehur", "Onaj ko želi duže spavati", "Onaj ko želi da odmori"], "c": 0}, {"q": "Šta čini bolesnik koji zbog privremene bolesti nije postio, a kasnije ozdravi?", "a": ["Ne treba ništa učiniti", "Naposti propuštene dane", "Samo klanja dva rekata", "Daje kurban"], "c": 1}, {"q": "Kako se naziva post kojim se nadoknađuju opravdano propušteni dani ramazana?", "a": ["Nafila", "Kaza", "Teravija", "I'tikaf"], "c": 1}, {"q": "Mora li se kaza propuštenih ramazanskih dana postiti odmah dan za danom?", "a": ["Mora uvijek bez prekida", "Ne mora biti uzastopno", "Može samo u ramazanu", "Ne može se nikada nadoknaditi"], "c": 1}, {"q": "Ko može odgoditi ramazanski post zbog putovanja?", "a": ["Musafir", "Svako ko izađe iz kuće", "Samo vozač autobusa", "Niko"], "c": 0}, {"q": "Šta je dužan učiniti musafir koji opravdano ne posti određene dane ramazana?", "a": ["Napostiti ih kasnije", "Ne treba ništa", "Dati kurban", "Ponoviti namaze"], "c": 0}, {"q": "Šta čini osoba koja zbog trajne starosti ili hronične bolesti nije sposobna postiti i nema izgleda da će kasnije moći napostiti?", "a": ["Daje fidju", "Mora postiti bez obzira na štetu", "Ne čini ništa", "Daje zekat umjesto posta"], "c": 0}, {"q": "Šta je fidja u vezi s postom?", "a": ["Naknada kojom se, prema propisu, nahrani siromašna osoba", "Naziv za sehur", "Dobrovoljni namaz", "Dova pred iftar"], "c": 0}, {"q": "Da li osoba koja očekuje da će kasnije moći postiti zamjenjuje propuštene dane samo fidjom?", "a": ["Da", "Ne, propuštene dane treba napostiti", "Samo ako želi", "Samo petkom"], "c": 1}, {"q": "Kada žena ne posti zbog hajza ili nifasa, šta čini s propuštenim ramazanskim postovima?", "a": ["Naposti ih nakon ramazana", "Ne nadoknađuje ih", "Daje samo sadaku", "Klanja dodatne namaze umjesto posta"], "c": 0}, {"q": "Mogu li trudnica ili dojilja izostaviti post ako postoji opravdana bojazan za zdravlje nje ili djeteta?", "a": ["Mogu, uz propise o naknadnom postu", "Nikada", "Samo prvog dana ramazana", "Samo ako su na putu"], "c": 0}, {"q": "Šta znači kefaret za namjerno pokvaren ramazanski post u slučaju kada je kefaret propisan?", "a": ["Posebna šerijatska iskupnina uz obavezu nadoknade tog dana", "Dobrovoljni iftar", "Sadaka prije sehura", "Bajram-namaz"], "c": 0}, {"q": "Prema hanefijskom mezhebu, kada može nastati obaveza kefareta?", "a": ["Kada osoba bez opravdanja namjerno pokvari započeti ramazanski post", "Kad zaboravom popije vodu", "Kad prespava sehur", "Kad se kupa tokom posta"], "c": 0}, {"q": "Da li je kefaret obavezan ako postač iz zaborava jede ili pije?", "a": ["Da", "Ne; kada se sjeti, nastavlja post", "Samo ako je popio vodu", "Samo ako je jeo"], "c": 1}, {"q": "Šta je kefaret za namjerno pokvaren ramazanski post?", "a": ["Postiti dva mjeseca uzastopno", "Postiti samo jedan dan", "Klanjati dva rekata", "Dati jedan iftar porodici"], "c": 0}, {"q": "Da li se uz kefaret nadoknađuje i dan posta koji je namjerno pokvaren?", "a": ["Da, taj dan se također naposti", "Ne", "Samo ako je petak", "Samo ako je posljednji dan ramazana"], "c": 0}, {"q": "Šta treba učiniti osoba koja ima opravdanje da privremeno ne posti kada opravdanje prestane?", "a": ["Napostiti propuštene dane", "Zaboraviti propuštene dane", "Postiti samo šest dana ševvala", "Dati kurban"], "c": 0}];
const $=x=>document.getElementById(x);let deck=[],pos=0,score=0,correct=0,asked=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sound(ok){try{let A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=ok?740:180;g.gain.value=.08;o.start();o.stop(A.currentTime+.14)}catch(e){}}
function makeSteps(){let e=$("steps");e.innerHTML="";for(let i=0;i<20;i++){let d=document.createElement("i");d.className="step";d.id="s"+i;d.style.left=(4+i*4.45)+"%";d.style.bottom=(22+i*5.4)+"px";e.appendChild(d)}}
function start(){deck=shuffle(BANK.map(x=>({...x,a:[...x.a]}))).slice(0,20);pos=score=correct=asked=0;locked=false;makeSteps();$("play").style.display="block";$("finish").style.display="none";update();show()}
function show(){locked=false;$("feedback").textContent="";let x=deck[pos],right=x.a[x.c];let opts=shuffle(x.a.map(v=>({v,ok:v===right})));$("q").textContent=x.q;let box=$("answers");box.innerHTML="";opts.forEach((o,i)=>{let b=document.createElement("button");b.className="ans";b.textContent="ABCD"[i]+") "+o.v;b.onclick=()=>answer(b,o.ok);box.appendChild(b)})}
function answer(b,ok){if(locked)return;locked=true;asked++;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);if(ok){score+=10;correct++;b.classList.add("good");$("feedback").textContent="✅ Tačno! +10 bodova";}else{score-=5;b.classList.add("bad");$("feedback").textContent="❌ Netačno! −5 bodova";}sound(ok);$("s"+(asked-1)).classList.add("on");update();setTimeout(()=>{pos++;if(pos>=20)finish();else show()},900)}
function update(){$("score").textContent=score;$("correct").textContent=correct;$("asked").textContent=asked;$("bar").style.width=(asked/20*100)+"%"}
function finish(){$("play").style.display="none";$("finish").style.display="block";$("fc").textContent=correct;$("fs").textContent=score}
start();
</script></body></html>
