function clock(){left=30;$('sec').textContent=30;$('bar').style.width='100%';let last=Date.now();timer=setInterval(()=>{if(document.hidden){last=Date.now();return}let n=Date.now();left-=(n-last)/1000;last=n;$('sec').textContent=Math.ceil(Math.max(0,left));$('bar').style.width=Math.max(0,left)/30*100+'%';if(left<=0){clearInterval(timer);fail('Vrijeme je isteklo!')}},100)}
function answer(b){if(locked)return;locked=true;clearInterval(timer);document.querySelectorAll('.ans').forEach(e=>e.disabled=true);if(b.dataset.c==='1'){b.classList.add('correct');$('msg').textContent='Tačan odgovor!';tone(720);setTimeout(()=>{i++;i>=30?win():render()},850)}else{b.classList.add('wrong');let c=document.querySelector('.ans[data-c="1"]');if(c)c.classList.add('correct');tone(170,.35);setTimeout(()=>fail('Netačan odgovor!'),650)}}
function fail(t){clearInterval(timer);locked=true;$('msg').innerHTML=t+'<br>Nova igra počinje od prvog pitanja.';tone(150,.4);setTimeout(startGame,1800)}
function win(){clearInterval(timer);$('q').innerHTML='🏆 ČESTITAMO!<br>Osvojili ste 1.000.000 bodova!';$('answers').innerHTML='';$('msg').textContent='Završili ste svih 30 pitanja.';$('score').textContent='1.000.000';tone(880,.5)}
function fifty(){if(used.f||locked)return;used.f=true;$('fifty').disabled=true;sh([...document.querySelectorAll('.ans')].filter(x=>x.dataset.c==='0')).slice(0,2).forEach(x=>{x.style.visibility='hidden';x.disabled=true});tone(500)}
function teacher(){if(used.t||locked)return;used.t=true;$('teacher').disabled=true;let c=document.querySelector('.ans[data-c="1"]');$('msg').textContent='Učitelj: '+c.textContent;tone(520)}
function audience(){if(used.a||locked)return;used.a=true;$('aud').disabled=true;let bs=[...document.querySelectorAll('.ans')],ci=bs.findIndex(x=>x.dataset.c==='1'),cp=55+Math.floor(Math.random()*26),r=100-cp,v=[0,0,0,0],w=[0,1,2,3].filter(x=>x!==ci),a=Math.floor(Math.random()*(r+1)),b=Math.floor(Math.random()*(r-a+1));v[ci]=cp;v[w[0]]=a;v[w[1]]=b;v[w[2]]=r-a-b;$('msg').textContent='Publika: '+v.map((x,n)=>String.fromCharCode(65+n)+': '+x+'%').join(' • ');tone(560)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDB(){show('database');renderDB()} function renderDB(){let t=$('search').value.toLowerCase().trim(),a=BANK.filter(x=>!t||x.q.toLowerCase().includes(t)||x.opts.some(o=>o.toLowerCase().includes(t)));$('dbc').textContent='Prikazano: '+a.length+' od '+BANK.length+' pitanja';$('dbl').innerHTML=a.map((x,n)=>'<div class="card"><b>'+(n+1)+'. '+esc(x.q)+'</b><div>A) '+esc(x.opts[0])+'</div><div>B) '+esc(x.opts[1])+'</div><div>C) '+esc(x.opts[2])+'</div><div>D) '+esc(x.opts[3])+'</div><div class="ok">Tačan odgovor: '+String.fromCharCode(65+x.ans)+') '+esc(x.opts[x.ans])+'</div></div>').join('')}
document.addEventListener('pointerdown',unlock,{once:true});
</script></body></html>
