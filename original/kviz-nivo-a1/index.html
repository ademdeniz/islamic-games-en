function prep(q){return {...q,opts:sh(q.answers.map(t=>({t,ok:t===q.correctText})))}}function tone(ok){try{let A=window.AudioContext||window.webkitAudioContext,c=tone.c||(tone.c=new A),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?760:180;o.type=ok?'sine':'square';g.gain.value=.05;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.stop(c.currentTime+.21)}catch(e){}}
function start(){qs=sh(BANK).slice(0,TOTAL).map(prep);render()}
function render(){if(i>=TOTAL)return finish();lock=false;cur=qs[i];$('pn').textContent=`${i+1} / 30`;$('cn').textContent=good;$('sn').textContent=score;$('progress').textContent=`Pitanje ${i+1} od 30`;$('q').textContent=cur.q;$('feedback').style.display='none';$('helper').style.display='none';$('answers').innerHTML='';cur.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='ans';b.innerHTML=`<b>${'ABCD'[k]})</b><span></span>`;b.querySelector('span').textContent=o.t;b.onclick=()=>answer(k,b);$('answers').appendChild(b)})}
function answer(k,b){if(lock)return;lock=true;let bs=[...document.querySelectorAll('.ans')],ok=cur.opts[k].ok;bs.forEach(x=>x.disabled=true);if(ok){good++;score+=10;b.classList.add('correct');$('feedback').textContent='✓ Tačno!   +10 bodova';tone(1)}else{b.classList.add('wrong');bs[cur.opts.findIndex(x=>x.ok)].classList.add('correct');$('feedback').textContent='✗ Netačno';tone(0)}$('feedback').style.display='flex';$('cn').textContent=good;$('sn').textContent=score;setTimeout(()=>{i++;render()},1200)}
function help(x){$('helper').innerHTML=x;$('helper').style.display='block'}
$('fifty').onclick=()=>{if(used.f||lock)return;used.f=1;$('fifty').disabled=true;let b=[...document.querySelectorAll('.ans')],w=sh(cur.opts.map((x,k)=>x.ok?-1:k).filter(k=>k>=0));w.slice(0,2).forEach(k=>{b[k].style.visibility='hidden';b[k].disabled=true});help('50:50 je uklonio dva netačna odgovora.')}
$('public').onclick=()=>{if(used.p||lock)return;used.p=1;$('public').disabled=true;let c=cur.opts.findIndex(x=>x.ok),v=[13,17,15,12];v[c]=58;let z=v.reduce((a,b)=>a+b),p=v.map(x=>Math.round(x*100/z));p[3]+=100-p.reduce((a,b)=>a+b);help('<b>Publika:</b> '+p.map((x,k)=>`${'ABCD'[k]} ${x}%`).join(' • '))}
$('muallim').onclick=()=>{if(used.m||lock)return;used.m=1;$('muallim').disabled=true;let c=cur.opts.findIndex(x=>x.ok);help(`Muallim kaže: Mislim da je odgovor <b>${'ABCD'[c]}</b>.`)}
function finish(){$('play').innerHTML=`<div class="end"><div>Završeno svih 30 pitanja</div><h2>Konačni rezultat</h2><div class="endnum">${good}/30</div><div>${score} bodova</div><br><button class="restart" onclick="location.reload()">Nova igra</button></div>`}
start();
</script></body></html>
