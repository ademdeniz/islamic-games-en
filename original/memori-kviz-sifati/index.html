<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memori kviz – Allahova, dž.š., svojstva (sifati)</title>
<style>
:root{--g:#0c6b45;--g2:#084d34;--gold:#d6a83b;--cream:#fffaf0;--ink:#173329}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eef8f1,#fff8e7);color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:18px 12px 36px}
header{text-align:center;background:linear-gradient(135deg,var(--g2),var(--g));color:white;border:3px solid var(--gold);border-radius:22px;padding:18px 10px;box-shadow:0 8px 24px #0002}
h1{font-size:clamp(22px,5vw,38px);margin:0 0 6px}.by{color:#ffe7a3;font-weight:700}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.badge{background:white;border:2px solid #e5c76f;border-radius:999px;padding:8px 13px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.card{height:112px;perspective:800px;cursor:pointer;user-select:none}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;backface-visibility:hidden;box-shadow:0 4px 10px #0002;border:2px solid #d6b65c}
.front{background:linear-gradient(145deg,var(--g),var(--g2));color:#f7d56d;font-size:34px;font-weight:900}
.back{background:var(--cream);transform:rotateY(180deg);font-weight:800;font-size:15px;line-height:1.18}
.card.done .back{background:#ddf5e7;border-color:#48a775}
.controls{text-align:center;margin-top:17px}
button{border:0;border-radius:14px;background:var(--g);color:white;font-weight:800;font-size:16px;padding:12px 20px;cursor:pointer}
.msg{text-align:center;min-height:28px;font-weight:900;margin:12px 0 2px;color:var(--g2)}
.note{text-align:center;font-size:13px;margin-top:12px;color:#53645e}
@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr);gap:7px}.card{height:104px}.back{font-size:13px;padding:5px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,1fr)}.card{height:96px}.back{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>MEMORI KVIZ</h1>
<div style="font-size:clamp(17px,4vw,26px);font-weight:850">Allahova, dž.š., svojstva – SIFATI</div>
<div class="by">Pripremio: Abdo ef. Rekić</div>
</header>

<div class="stats">
<div class="badge">Parovi: <span id="pairs">0</span>/14</div>
<div class="badge">Pokušaji: <span id="tries">0</span></div>
<div class="badge">Bodovi: <span id="score">0</span></div>
</div>
<div class="msg" id="msg">Pronađi naziv sifata i njegovo značenje.</div>
<div class="grid" id="grid"></div>
<div class="controls"><button onclick="start()">🔄 Nova igra</button></div>
<div class="note">Dodirni dvije kartice. Ako naziv sifata odgovara značenju, par ostaje otvoren.</div>
</div>

<script>
const pairs=[
["VUDŽUD","Allah postoji."],
["KIDEM","Allah je oduvijek."],
["BEKA","Allah je zauvijek."],
["VAHDANIJJET","Allah je jedan."],
["MUHALEFETUN LIL-HAVADIS","Allah nije sličan ničemu što je stvoreno."],
["KIJAMUN BI NEFSIHI","Allah sam po Sebi opstoji i ni o kome nije ovisan."],
["HAJAT","Allah živi."],
["ILM","Allah sve zna."],
["SEM'","Allah sve čuje."],
["BESAR","Allah sve vidi."],
["IRADET","Allah sve Svojom voljom čini."],
["KUDRET","Allah je svemoćan."],
["KELAM","Allah govori Svojim govorom."],
["TEKVIN","Allah sve stvara, održava i rastvara."]
];

let first=null, second=null, lock=false, tries=0, found=0, score=0;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function start(){
 first=second=null; lock=false; tries=0; found=0; score=0;
 document.getElementById("tries").textContent=0;
 document.getElementById("pairs").textContent=0;
 document.getElementById("score").textContent=0;
 document.getElementById("msg").textContent="Pronađi naziv sifata i njegovo značenje.";
 let deck=[];
 pairs.forEach((p,i)=>{
   deck.push({id:i,text:p[0],kind:"name"});
   deck.push({id:i,text:p[1],kind:"meaning"});
 });
 shuffle(deck);
 const g=document.getElementById("grid"); g.innerHTML="";
 deck.forEach((x,n)=>{
   const c=document.createElement("div");
   c.className="card"; c.dataset.id=x.id; c.dataset.kind=x.kind;
   c.innerHTML=`<div class="inner"><div class="face front">?</div><div class="face back">${x.text}</div></div>`;
   c.onclick=()=>flip(c);
   g.appendChild(c);
 });
}
function flip(c){
 if(lock || c.classList.contains("done") || c===first) return;
 c.classList.add("open");
 if(!first){ first=c; return; }
 second=c; lock=true; tries++;
 document.getElementById("tries").textContent=tries;
 const ok=first.dataset.id===second.dataset.id && first.dataset.kind!==second.dataset.kind;
 if(ok){
   first.classList.add("done"); second.classList.add("done");
   first.classList.remove("open"); second.classList.remove("open");
   found++; score += 10; document.getElementById("pairs").textContent=found;
   document.getElementById("score").textContent=score;
   document.getElementById("msg").textContent="Bravo! Pronašao/la si par. +10 bodova";
   first=second=null; lock=false;
   if(found===pairs.length){
     document.getElementById("msg").textContent=`Mašallah! Završio/la si kviz sa ${score} bodova u ${tries} pokušaja!`;
   }
 }else{
   score = Math.max(0, score - 2); document.getElementById("score").textContent=score;
   document.getElementById("msg").textContent="Nije par — pokušaj ponovo. −2 boda";
   setTimeout(()=>{
     first.classList.remove("open"); second.classList.remove("open");
     first=second=null; lock=false;
   },850);
 }
}
start();
</script>
</body>
</html>
