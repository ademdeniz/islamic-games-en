<!doctype html>
<html lang="bs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06140d">
<title>Islamski milijunaš – Nivo A2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06140d;color:#fff;font-family:Georgia,serif}
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:min(100%,520px);min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 15%,#1c4934,#07170f 52%,#030907)}
h1{font-size:clamp(22px,6vw,32px);text-align:center;color:#f3cf67;margin:8px 0 3px}.sub{text-align:center;color:#ddd;font-size:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin:10px 2px}.badge{border:1px solid #caa84e;border-radius:18px;padding:7px 10px;background:#10261a}
.card{border:2px solid #caa84e;border-radius:18px;padding:18px 14px;background:linear-gradient(#122c1e,#09150e);box-shadow:0 8px 28px #0008}
.level{color:#f3cf67;font-weight:bold;margin-bottom:8px}#q{font-size:clamp(19px,5vw,25px);line-height:1.28;min-height:80px}
.answers{display:grid;gap:10px;margin-top:16px}button{width:100%;border:1.5px solid #d5b65c;border-radius:14px;background:#17261e;color:#fff;padding:14px 12px;text-align:left;font-size:clamp(16px,4.4vw,20px);font-family:inherit}
button:active{transform:scale(.99)}button.correct{background:#176b3a}button.wrong{background:#8b2626}button:disabled{opacity:.95}
#feedback{min-height:45px;text-align:center;font-weight:bold;font-size:18px;padding-top:12px}.progress{height:9px;background:#26352d;border-radius:9px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#d5b65c;width:0}
.start,.finish{text-align:center}.start p{line-height:1.45}.gold{background:linear-gradient(#efd77b,#b78b28);color:#171006;text-align:center;font-weight:bold}
.small{font-size:13px;color:#ccc;text-align:center;margin-top:15px}.hidden{display:none}
</style></head><body><main class="app">
<h1>ISLAMSKI MILIJUNAŠ</h1><div class="sub">NIVO A2 • Pripremio Abdo ef. Rekić</div>
<section id="start" class="card start"><h2>30 pitanja</h2><p>Prvih <b>10 pitanja</b> je iz baze Nivo A1, a narednih <b>20 pitanja</b> iz baze Nivo A2.</p><p>Odgovori se pri svakom pokretanju izmiješaju.</p><button class="gold" onclick="begin()">POČNI KVIZ</button></section>
<section id="game" class="hidden"><div class="top"><span class="badge" id="num"></span><span class="badge" id="score">Bodovi: 0</span></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="level" id="level"></div><div id="q"></div><div class="answers" id="answers"></div><div id="feedback"></div></div></section>
<section id="finish" class="card finish hidden"><h2>ZAVRŠENO!</h2><h3 id="result"></h3><button class="gold" onclick="location.reload()">IGRAJ PONOVO</button></section>
<div class="small">Android • iPhone • radi u mobilnom pregledniku</div>
</main>
<script>
const base=[{"level": "A1", "q": "Šta znači izraz „Hasbi Rabbi“?", "opts": ["Meni je dovoljan moj Gospodar", "Muhammed je Allahov poslanik", "U mom srcu je svjetlo", "Allah je najveći"], "ans": "Meni je dovoljan moj Gospodar"}, {"level": "A1", "q": "Ko je posljednji Allahov poslanik?", "opts": ["Musa, alejhis-selam", "Isa, alejhis-selam", "Muhammed, alejhis-selam", "Ibrahim, alejhis-selam"], "ans": "Muhammed, alejhis-selam"}, {"level": "A1", "q": "Čime potvrđujemo svoju pripadnost islamu?", "opts": ["Učenjem ezana", "Izgovaranjem kelimei-šehadeta", "Nazivanjem selama", "Oblačenjem čiste odjeće"], "ans": "Izgovaranjem kelimei-šehadeta"}, {"level": "A1", "q": "Kako glasi islamski pozdrav?", "opts": ["Es-selamu alejkum", "Ve alejkumus-selam", "Allahu ekber", "Elhamdulillah"], "ans": "Es-selamu alejkum"}, {"level": "A1", "q": "Kojoj strani islam daje prednost?", "opts": ["Lijevoj strani", "Objema stranama podjednako", "Desnoj strani", "Nijednoj strani"], "ans": "Desnoj strani"}, {"level": "A1", "q": "Kako glasi dova za povećanje znanja?", "opts": ["Rabbi jessir", "Subhanallah", "Elhamdulillah", "Rabbi zidni ilma"], "ans": "Rabbi zidni ilma"}, {"level": "A1", "q": "Kako se zove naša vjera?", "opts": ["Islam", "Kršćanstvo", "Judaizam", "Budizam"], "ans": "Islam"}, {"level": "A1", "q": "Koja je naša sveta knjiga?", "opts": ["Ilmihal", "Sveska", "Udžbenik", "Kur’an"], "ans": "Kur’an"}, {"level": "A1", "q": "Kada učimo Subhaneke?", "opts": ["Poslije svakog namaza", "Posebno na početku svakog namaza", "Samo poslije selama", "Samo pred namaz"], "ans": "Posebno na početku svakog namaza"}, {"level": "A1", "q": "Kako se zove prva sura u Kur’anu?", "opts": ["El-Ihlas", "El-Fatiha", "En-Nas", "El-Kevser"], "ans": "El-Fatiha"}, {"level": "A2", "q": "Koji je četvrti namaski šart?", "opts": ["Propisno se obući", "Namaz klanjati na vrijeme", "Uzeti abdest", "Okrenuti se prema Kibli"], "ans": "Namaz klanjati na vrijeme"}, {"level": "A2", "q": "Koliko ima namaskih vremena, odnosno dnevnih namaza?", "opts": ["Tri", "Četiri", "Šest", "Pet"], "ans": "Pet"}, {"level": "A2", "q": "Koji je prvi dnevni namaz?", "opts": ["Podne", "Ikindija", "Sabah", "Akšam"], "ans": "Sabah"}, {"level": "A2", "q": "Ko oglašava početak namaskog vremena?", "opts": ["Imam učenjem Kur'ana", "Mujezin učenjem ezana", "Džemat učenjem dove", "Hatib učenjem hutbe"], "ans": "Mujezin učenjem ezana"}, {"level": "A2", "q": "Koji je peti namaski šart?", "opts": ["Nijet učiniti", "Okrenuti se prema Kibli – Kabi", "Uzeti abdest", "Namaz klanjati na vrijeme"], "ans": "Okrenuti se prema Kibli – Kabi"}, {"level": "A2", "q": "Šta je Kibla?", "opts": ["Smjer u kojem se nalazi Kaba", "Mjesto za uzimanje abdesta", "Džamijski harem", "Poziv za namaz"], "ans": "Smjer u kojem se nalazi Kaba"}, {"level": "A2", "q": "Gdje se nalazi Kaba?", "opts": ["U Medini", "U Jerusalemu", "U Meki", "U Damasku"], "ans": "U Meki"}, {"level": "A2", "q": "Šta se nalazi u jednom uglu Kabe?", "opts": ["Mimbera", "Mihrab", "Izvor Zemzem", "Crni kamen – Hadžerul-esved"], "ans": "Crni kamen – Hadžerul-esved"}, {"level": "A2", "q": "Koja je sura posljednja sura u Kur'anu?", "opts": ["En-Nas", "El-Felek", "El-Ihlas", "El-Kevser"], "ans": "En-Nas"}, {"level": "A2", "q": "Kako počinje sura En-Nas?", "opts": ["Allahus-Samed", "Kul e'uzu birabbin-nas", "Kul huvallahu ehad", "Min šerri ma halek"], "ans": "Kul e'uzu birabbin-nas"}, {"level": "A2", "q": "Šta su namaski šarti?", "opts": ["Uvjeti koje trebamo ispuniti da bi nam namaz bio ispravan", "Dobrovoljni dijelovi namaza", "Dove poslije namaza", "Vrste namaza"], "ans": "Uvjeti koje trebamo ispuniti da bi nam namaz bio ispravan"}, {"level": "A2", "q": "Koliko ukupno ima namaskih šarta?", "opts": ["6", "10", "12", "14"], "ans": "12"}, {"level": "A2", "q": "Koji je prvi namaski rukn?", "opts": ["Kijam", "Ruku'", "Sedžda", "Iftitahi-tekbir – početni tekbir"], "ans": "Iftitahi-tekbir – početni tekbir"}, {"level": "A2", "q": "Šta znači kijam?", "opts": ["Učenje Kur'ana", "Pregibanje", "Stajanje u namazu", "Sjedenje"], "ans": "Stajanje u namazu"}, {"level": "A2", "q": "Šta je kiraet?", "opts": ["Učenje Kur'ana u namazu", "Stajanje u namazu", "Spuštanje lica na tlo", "Sjedenje na kraju namaza"], "ans": "Učenje Kur'ana u namazu"}, {"level": "A2", "q": "Šta je ezan?", "opts": ["Dova poslije namaza", "Oglašavanje početka namaskog vremena", "Učenje Kur'ana prije namaza", "Pozdrav poslije namaza"], "ans": "Oglašavanje početka namaskog vremena"}, {"level": "A2", "q": "Ko uči ezan?", "opts": ["Mujezin", "Hatib", "Svaki klanjač istovremeno", "Samo imam"], "ans": "Mujezin"}, {"level": "A2", "q": "Koji je treći namaski šart?", "opts": ["Uzeti abdest", "Propisno odijevanje", "Na vrijeme klanjati", "Okrenuti se prema Kibli"], "ans": "Propisno odijevanje"}, {"level": "A2", "q": "Šta je abdest?", "opts": ["Kupanje cijelog tijela", "Vjersko pranje određenih dijelova tijela", "Pranje samo ruku", "Pranje odjeće"], "ans": "Vjersko pranje određenih dijelova tijela"}, {"level": "A2", "q": "Koliko ima abdeskih šarta – farza?", "opts": ["Tri", "Pet", "Četiri", "Šest"], "ans": "Četiri"}]; let questions=[],i=0,points=0,locked=false;
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function begin(){questions=[...base]; document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');show()}
function show(){locked=false;let x=questions[i];document.getElementById('num').textContent=`Pitanje ${i+1}/30`;document.getElementById('score').textContent=`Bodovi: ${points}`;document.getElementById('bar').style.width=(i/30*100)+'%';document.getElementById('level').textContent=i<10?'NIVO A1 • ponavljanje':'NIVO A2';document.getElementById('q').textContent=x.q;document.getElementById('feedback').textContent='';let box=document.getElementById('answers');box.innerHTML='';shuffle([...x.opts]).forEach((o,n)=>{let b=document.createElement('button');b.textContent='ABCD'[n]+') '+o;b.onclick=()=>pick(b,o,x.ans);box.appendChild(b)})}
function tone(ok){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:180;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.15)}catch(e){}}
function pick(btn,val,ans){if(locked)return;locked=true;let bs=[...document.querySelectorAll('#answers button')];bs.forEach(b=>b.disabled=true);if(val===ans){points++;btn.classList.add('correct');document.getElementById('feedback').textContent='✓ Tačno!';tone(true)}else{btn.classList.add('wrong');bs.find(b=>b.textContent.slice(3)===ans)?.classList.add('correct');document.getElementById('feedback').textContent='✗ Tačan odgovor: '+ans;tone(false)}setTimeout(()=>{i++;if(i<30)show();else done()},1250)}
function done(){document.getElementById('game').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('result').textContent=`Rezultat: ${points} / 30`;}
</script></body></html>
