 if(type==="cake") art=`<g transform="translate(450 225)"><ellipse cx="0" cy="105" rx="210" ry="34" fill="#d4b17a"/><rect x="-175" y="-5" width="350" height="110" rx="20" fill="#f5b0bd" stroke="#74452d" stroke-width="8"/><rect x="-135" y="-90" width="270" height="85" rx="20" fill="#fff1c9" stroke="#74452d" stroke-width="8"/><circle cx="-65" cy="-108" r="17" fill="#e54b4b"/><circle cx="0" cy="-108" r="17" fill="#e54b4b"/><circle cx="65" cy="-108" r="17" fill="#e54b4b"/></g>`;
 if(type==="choc") art=`<g transform="translate(450 205) rotate(-5)"><rect x="-195" y="-120" width="390" height="240" rx="25" fill="#6b351d" stroke="#3e2115" stroke-width="10"/>${[-125,-40,45,130].map(x=>[-65,20,105].map(y=>`<rect x="${x-31}" y="${y-31}" width="62" height="62" rx="8" fill="#8b4b2a" stroke="#4d2818" stroke-width="5"/>`).join("")).join("")}</g>`;
 if(type==="lollipop") art=`<g transform="translate(450 185)"><rect x="-10" y="60" width="20" height="180" rx="10" fill="#f6f0df" stroke="#8c765e" stroke-width="5"/><circle cy="0" r="125" fill="#ff6b8a" stroke="#713b4a" stroke-width="9"/><path d="M-78-72C65-135 145-10 60 65C-10 125-115 62-78-5C-48-60 42-55 50-5C56 35 3 58-22 27" fill="none" stroke="#fff2a9" stroke-width="24" stroke-linecap="round"/></g>`;
 return common+art+`</svg>`;
}
const PRIZES=["ice","cake","choc","lollipop","candy"];
let chosenPrize="";
function setRandomPrize(){chosenPrize=PRIZES[Math.floor(Math.random()*PRIZES.length)];$("map").style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(prizeSVG(chosenPrize))}")`}


function buildTiles(){const t=$("tiles20");t.innerHTML="";t.style.background="#17110b";for(let i=0;i<20;i++){const d=document.createElement("div");d.className="coverTile";d.id="coverTile"+i;t.appendChild(d)}}
function start(){setRandomPrize();deck=makeDeck();pos=correct=asked=score=0;current=null;buildTiles();$("play").style.display="block";$("finish").style.display="none";update();show()}
function update(){$("score").textContent=`⭐ ${score} bodova`;$("right").textContent=`✅ ${correct}/20 tačnih`;$("asked").textContent=`❓ ${asked} pitanja`;$("bar").style.width=(correct/20*100)+"%";$("map").dataset.p=Math.floor(correct/2)}
function show(){if(correct>=20)return finish();locked=false;current=nextItem();$("counter").textContent=`Potrebno još ${20-correct} tačnih odgovora`;$("q").textContent=current.q;$("feedback").textContent="";const box=$("answers");box.innerHTML="";
let opts=current.a.map((t,i)=>({t,ok:i===current.c}));shuffle(opts).forEach((o,i)=>{const b=document.createElement("button");b.className="ans";b.textContent=String.fromCharCode(65+i)+") "+o.t;b.onclick=()=>answer(o.ok,b);box.appendChild(b)})}
function answer(ok,b){if(locked)return;locked=true;asked++;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);sound(ok);
if(ok){correct++;score+=10;b.classList.add("correct");const tile=$("coverTile"+(correct-1));if(tile){tile.classList.add("open");$("tiles20").style.background="transparent";}$("feedback").textContent=`✅ Tačno! +10 bodova. Otkriveno polje ${correct} od 20.`}
else{score-=5;b.classList.add("wrong");$("feedback").textContent="❌ Netačno! −5 bodova. Dobijaš novo pitanje."}
update();setTimeout(show,1050)}
function finish(){document.querySelectorAll(".coverTile").forEach(x=>x.classList.add("open"));const g=$("giftWrap");g.classList.add("show");setTimeout(()=>g.classList.add("open"),500);setTimeout(()=>g.classList.remove("show"),2100);$("play").style.display="none";$("finish").style.display="block";$("bar").style.width="100%";$("result").innerHTML=`Tačno si riješio <b>20 pitanja</b> nakon ukupno <b>${asked}</b> pitanja.<br>Konačni rezultat: <b>${score} bodova</b>.<br>Put je potpuno otkriven i sanduk s blagom je tvoj!`}
$("restart").onclick=start;start();
</script></body></html>
