uto=false,marks=new Set(),mode=0,order=[],q=0,score=0,answered=false,ctx;
function render(){let a=D[i][0].split(/\s+/),t=D[i][1].split(/\s+/);$('count').textContent='Dio '+(i+1)+' od '+D.length;$('arab').innerHTML=a.map((w,j)=>`<span class="word ${marks.has(j)?'on':''}" onclick="mark(${j})">${w}</span>`).join(' ');$('trans').innerHTML=t.map((w,j)=>`<span class="word ${marks.has(Math.min(j,a.length-1))?'on':''}" onclick="mark(${Math.min(j,a.length-1)})">${w}</span>`).join(' ');$('translation').textContent=D[i][2];audio.src=C[i];audio.loop=loop}
function mark(j){marks.has(j)?marks.delete(j):marks.add(j);let time=audio.currentTime,paused=audio.paused;render();audio.currentTime=time;if(!paused)audio.play().catch(()=>{})}
function play(){audio.currentTime=0;audio.play().catch(()=>{})}
function go(delta){let n=Math.max(0,Math.min(D.length-1,i+delta));if(n===i)return;audio.pause();i=n;marks.clear();render();if(auto)play()}
function toggleLoop(){loop=!loop;auto=false;audio.loop=loop;$('loopButton').textContent='🔁 Ponavljaj: '+(loop?'UKLJ.':'ISKLJ.');if(loop)play()}
function learnAll(){audio.pause();i=0;marks.clear();loop=false;auto=true;$('loopButton').textContent='🔁 Ponavljaj: ISKLJ.';render();play()}
audio.addEventListener('ended',()=>{if(auto&&i<D.length-1)go(1)});
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function show(quiz){$('learn').classList.toggle('hidden',quiz);$('quiz').classList.toggle('hidden',!quiz);if(quiz){audio.pause();if(!order.length)newQuiz()}}
function setMode(m){mode=m;newQuiz()}
function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function newQuiz(){order=shuffle(D.map((_,j)=>j));q=0;score=0;question()}
function question(){answered=false;if(q>=order.length){$('qCount').textContent='Kviz završen';$('qPrompt').textContent='Rezultat: '+score+' / '+order.length;$('options').innerHTML='';$('feedback').textContent='';return}let id=order[q],ask=mode===0?1:0;$('qCount').textContent='Pitanje '+(q+1)+' / '+order.length+' • Tačno: '+score;$('qPrompt').innerHTML='<p>Odaberi odgovarajući '+['arapski tekst','izgovor','prijevod'][mode]+'</p><div class="'+(ask===0?'ar':'tr')+'">'+D[id][ask]+'</div>';let opts=shuffle(D.map((_,j)=>j).filter(j=>j!==id)).slice(0,3);opts=shuffle([id,...opts]);$('options').innerHTML=opts.map(j=>`<button class="${mode===0?'ar':''}" data-id="${j}" onclick="answer(${j},${id})">${D[j][mode]}</button>`).join('');$('feedback').textContent=''}
function sound(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(ok?660:260,t);o.frequency.exponentialRampToValueAtTime(ok?880:160,t+.2);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.26)}catch(e){}}
function answer(j,id){if(answered)return;answered=true;if(j===id)score++;sound(j===id);document.querySelectorAll('[data-id]').forEach(b=>{b.disabled=true;if(+b.dataset.id===id)b.classList.add('correct');else if(+b.dataset.id===j)b.classList.add('wrong')});$('feedback').textContent=j===id?'Tačno! Bravo!':'Netačno. Tačan odgovor je zelen.'}
function next(){if(!answered&&q<order.length)return;q++;question()}render();
</script></body></html>
