<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sunday Parent Duty</title>
<style>
:root{--bg:#fbf7ec;--card:#ffffff;--ink:#1d1a14;--muted:#6b604d;--line:#e7dcc2;--green:#0f5a3f;--gold:#b98a2e;--gold-soft:#f7ecd0;--past:#9a917f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#1f1c17;--ink:#f1ebdf;--muted:#b3a78f;--line:#3a342a;--green:#6fcf9c;--gold:#e0b45a;--gold-soft:#3a3020;--past:#7d7465}}
:root[data-theme="dark"]{--bg:#15130f;--card:#1f1c17;--ink:#f1ebdf;--muted:#b3a78f;--line:#3a342a;--green:#6fcf9c;--gold:#e0b45a;--gold-soft:#3a3020;--past:#7d7465}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:12px 16px 48px}
h1{margin:6px 0 0;color:var(--green);font-size:clamp(23px,5vw,30px)}
.sub{margin:2px 0 12px;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin:12px 0}
.card p{margin:6px 0}ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--green);background:var(--gold-soft)}th small{color:var(--muted);font-weight:600}
td.d{white-space:nowrap;font-weight:700}
tr:last-child td{border-bottom:0}
tr.past td{color:var(--past)}
tr.next td{background:var(--gold-soft);font-weight:700}
tr.next td.d::after{content:" · next";color:var(--gold)}
.tools button{font:inherit;font-weight:700;border:0;background:var(--green);color:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer}
.foot{font-size:13px;color:var(--muted);margin-top:18px}
@media (max-width:420px){th,td{padding:8px 6px;font-size:14px}}
</style>
</head>
<body>
__BODY__
<script>
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const rows=[...document.querySelectorAll('tr[data-d]')];
const next=rows.find(r=>r.dataset.d>=today);
rows.forEach(r=>{if(r.dataset.d<today)r.classList.add('past')});
if(next)next.classList.add('next');
document.getElementById('me').onclick=()=>next&&next.scrollIntoView({behavior:'smooth',block:'center'});
if(!next)document.getElementById('me').remove();
</script>
</body>
</html>
