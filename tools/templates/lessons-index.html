<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilmihal Lessons</title>
<style>
:root{--green:#0f5a3f;--green2:#176b45;--gold:#c99b3e;--gold2:#f3e2b3;--cream:#fff8e7;--ink:#17130d;--muted:#6a5c45;--line:#eadbb6}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:980px;margin:auto;padding:10px 16px 40px}
.crumbs{font-size:14px;margin:6px 0}.crumbs a{color:var(--green2);font-weight:700;text-decoration:none}
.hero{background:var(--green);color:#fff;border:3px solid var(--gold);border-radius:20px;padding:18px;text-align:center;margin:8px 0 18px}
.hero h1{margin:0;font-size:clamp(26px,5.5vw,36px)}.hero p{margin:6px auto 0;max-width:640px;opacity:.92}
.book{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.book h2{margin:0;display:flex;gap:10px;align-items:center;color:var(--green)}.book .lvl{color:var(--muted);font-weight:600;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
a.lesson{display:block;text-decoration:none;color:inherit;border:2px solid var(--line);border-radius:14px;padding:12px;background:#fffdf6;transition:border-color .15s,transform .15s}
a.lesson:hover{border-color:var(--gold);transform:translateY(-2px)}
.num{display:inline-block;background:var(--green2);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 9px}
.lesson b{display:block;margin:6px 0 2px;font-size:17px}.lesson span.i{color:var(--muted);font-size:14px}
.prog{display:block;margin-top:6px;font-size:14px;font-weight:700;color:var(--green2)}
.src{font-size:12px;color:#8a7c64;margin-top:10px}
</style></head><body><main>
<div class="crumbs"><a href="../">🏠 Games</a> › 📚 Lessons</div>
<div class="hero"><h1>📚 Ilmihal Lessons</h1><p>Read each lesson, listen, then practise with short games. Your stars are saved on this device.</p></div>
<div id="books"></div>
<script>
const B=__DATA__;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stars(bid,l){try{const d=JSON.parse(localStorage.getItem('lesson-'+bid+'-'+l.id)||'{}');const n=Object.keys(d).length;
  return n?'⭐'.repeat(Math.min(n,l.activities))+(n>=l.activities?' complete':''):''}catch(e){return ''}}
document.getElementById('books').innerHTML=Object.entries(B).map(([bid,b])=>`<div class="book"><h2>${b.icon} ${esc(b.title)}</h2><div class="lvl">${esc(b.level)}</div>
  <div class="grid">${b.lessons.map(l=>`<a class="lesson" href="${bid}/${l.id}/"><span class="num">Lesson ${l.number}</span><b>${esc(l.title)}</b><span class="i">${esc(l.intro)}</span><span class="prog">${stars(bid,l)}</span></a>`).join('')}</div>
  <div class="src">Adapted into English from ${esc(b.source)}.</div></div>`).join('');
</script></main></body></html>
