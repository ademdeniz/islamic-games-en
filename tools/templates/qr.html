<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maktab QR Code</title>
<style>
:root{--bg:#fbf7ec;--ink:#1d1a14;--muted:#6b604d;--green:#0f5a3f;--gold:#c99b3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:auto;padding:12px 16px 40px;text-align:center}
.sheet{background:#fff;border:4px solid var(--gold);border-radius:24px;padding:24px 20px}
h1{margin:0;color:var(--green);font-size:clamp(26px,6vw,40px);line-height:1.15}
.sub{margin:6px 0 16px;font-size:clamp(17px,3.5vw,22px);font-weight:700;color:var(--ink)}
.qrbox{width:min(100%,380px);margin:auto}.qrbox svg{display:block;width:100%;height:auto}
.how{font-size:clamp(16px,3.2vw,20px);margin:14px 0 4px}
.url{font-size:13px;color:var(--muted);word-break:break-all}
.name{margin-top:12px;font-weight:700;color:var(--green)}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.tools button,.tools a{font:inherit;font-weight:700;border:0;background:var(--green);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none}
@page{margin:12mm}
@media print{body{background:#fff}.tools{display:none}main{padding:0;max-width:none}.sheet{border-width:6px}.qrbox{width:110mm}}
</style>
</head>
<body>
<main>
<div class=sheet>
<h1>This week in the maktab</h1>
<p class=sub>Lessons, Qur’an, Sufara &amp; games</p>
<div class=qrbox data-url="__URL__">__QR__</div>
<p class=how>📱 Open the <b>camera</b> on your phone or tablet<br>and point it at the code.</p>
<p class=url>__URL__</p>
<p class=name>__NAME__</p>
</div>
<p class=tools><button onclick="print()">🖨️ Print</button> <a href="maktab-qr.png" download="maktab-qr.png">⬇️ Save the QR picture</a></p>
</main>
</body>
</html>
