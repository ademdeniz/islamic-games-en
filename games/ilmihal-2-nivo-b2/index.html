*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#162d67 0,#071431 48%,#020713 100%);color:white;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:16px}.top{text-align:center}.title{font-size:clamp(25px,5vw,46px);font-weight:900;letter-spacing:1px;text-shadow:0 0 15px #4a7cff}.sub{color:#d7c26b;margin:5px}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #d6b94b;border-radius:20px;padding:8px 13px;background:#071b43}

.msg{text-align:center;min-height:34px;margin:13px;font-weight:800;font-size:20px}.next{display:none;margin:12px auto;border:0;border-radius:24px;padding:12px 25px;font-weight:800;background:#d8b94a;color:#08122c}
.start{text-align:center;padding:45px 12px}.start button{font-size:22px;border:2px solid #e1c356;border-radius:28px;padding:14px 30px;background:#0c2861;color:white;font-weight:800}
.note{color:#cbd6f1;text-align:center;margin-top:15px}.audience{display:none;text-align:center;margin:10px}.bars{display:flex;align-items:end;justify-content:center;gap:18px;height:120px}.bar{width:45px;background:#d5b94d;min-height:3px}.lab{font-size:12px}

ds","C":"The right","D":"It doesn’t matter"},"answer":"C"},{"q":"Where do we start wiping the right mest?","opts":{"A":"At the ankle","B":"At the heel","C":"At the middle of the foot","D":"At the toes"},"answer":"D"},{"q":"In which direction do we wipe the mest?","opts":{"A":"From the ankle towards the toes","B":"From the toes towards the ankles","C":"Only in circles","D":"From the heel towards the sole"},"answer":"B"},{"q":"With which hand do we wipe the left mest?","opts":{"A":"With the left hand","B":"With the right hand","C":"Both hands","D":"We don’t wipe it"},"answer":"A"},{"q":"Up to which part do we wipe the mest?","opts":{"A":"Up to the knee","B":"Up to the toes","C":"Up to just above the ankles","D":"Up to halfway up the shin"},"answer":"C"},{"q":"For how long can a person who is staying at home use the easier rule of mash over mests?","opts":{"A":"12 hours","B":"48 hours","C":"72 hours","D":"24 hours"},"answer":"D"},{"q":"For how long can a traveller use mash over mests?","opts":{"A":"24 hours","B":"72 hours","C":"48 hours","D":"12 hours"},"answer":"B"},{"q":"Who can use mash over mests for 72 hours?","opts":{"A":"A traveller","B":"A person who is always at home","C":"Only a sick person","D":"Only a child"},"answer":"A"},{"q":"How many days are 72 hours?","opts":{"A":"One day","B":"Two days","C":"Three days","D":"Four days"},"answer":"C"},{"q":"When will mash over mests not be valid?","opts":{"A":"If the mests are new","B":"If the mests are torn","C":"If the mests are made of leather","D":"If they cover the ankles"},"answer":"B"},{"q":"Is mash valid if the mests are dirty?","opts":{"A":"No","B":"Yes, always","C":"Only when travelling","D":"Only in winter"},"answer":"A"},{"q":"Are low mests that do not cover the ankles enough for a valid mash?","opts":{"A":"Yes, always","B":"Only at home","C":"No","D":"Only when travelling"},"answer":"C"},{"q":"Is mash over mests valid if the mests were put on before making Wudu?","opts":{"A":"Yes, always","B":"Only if the s the second ayah of Surah Al-Kawthar?","opts":{"A":"Inna a‘taynakal-kawthar","B":"Fasalli li rabbika wanhar","C":"Inna shani’aka huwal-abtar","D":"Qul huwallahu ahad"},"answer":"B"},{"q":"What is the third ayah of Surah Al-Kawthar?","opts":{"A":"Fasalli li rabbika wanhar","B":"Inna a‘taynakal-kawthar","C":"Inna shani’aka huwal-abtar","D":"Maliki yawmid-din"},"answer":"C"},{"q":"Fill in the gap: “Inna a‘taynakal-_____.”","opts":{"A":"kawthar","B":"abtar","C":"wanhar","D":"rabbika"},"answer":"A"},{"q":"Fill in the gap: “Fasalli li_____ wanhar.”","opts":{"A":"kawthar","B":"shani’aka","C":"abtar","D":"rabbika"},"answer":"D"},{"q":"Fill in the gap: “Fasalli li rabbika wa_____.”","opts":{"A":"kawthar","B":"nhar","C":"abtar","D":"shani’aka"},"answer":"B"},{"q":"Fill in the gap: “Inna shani’aka huwal-_____.”","opts":{"A":"kawthar","B":"wanhar","C":"abtar","D":"rabbika"},"answer":"C"},{"q":"What does the first ayah, “Inna a‘taynakal-kawthar”, mean?","opts":{"A":"Indeed, We have granted you al-Kawthar (abundant good)","B":"So pray to your Lord","C":"Whoever hates you will be left forgotten","D":"In the name of Allah, the Entirely Merciful, the Especially Merciful"},"answer":"A"},{"q":"What does “Fasalli li rabbika wanhar” mean?","opts":{"A":"We have granted you abundant good","B":"Whoever hates you will be forgotten","C":"Thank your Lord","D":"So pray to your Lord and sacrifice (the Qurbani)"},"answer":"D"},{"q":"What does “Inna shani’aka huwal-abtar” mean?","opts":{"A":"We have granted you abundant good","B":"Indeed, the one who hates you is the one cut off (who will be forgotten)","C":"So sacrifice the Qurbani","D":"Pray to your Lord"},"answer":"B"},{"q":"Whom is Allah speaking to in Surah Al-Kawthar?","opts":{"A":"To Musa (AS)","B":"To Ibrahim (AS)","C":"To Muhammad (SAW)","D":"To Nuh (AS)"},"answer":"C"},{"q":"What does Surah Al-Kawthar remind Muhammad (SAW) of?","opts":{"A":"The blessings Allah has given him","B":"A journey","C":"Trade","D":"The building of the Ka‘bah"} ons)?","opts":{"A":"Only the act of zina itself","B":"Only rude speech","C":"Everything that leads to zina","D":"Only certain kinds of behaviour"},"answer":"C"},{"q":"What is listed as something that leads to zina?","opts":{"A":"Watching TV","B":"Helping others","C":"Visiting relatives","D":"Showing off the body, looking at nakedness, and shameless talk"},"answer":"D"},{"q":"Whose property is especially mentioned as something that must not be spent or taken unfairly?","opts":{"A":"The property of an orphan","B":"The property of a merchant","C":"The property of a friend","D":"The property of a traveller"},"answer":"A"},{"q":"What does lying lead to?","opts":{"A":"Only fun","B":"Success","C":"To what is bad and harmful","D":"Always to good"},"answer":"C"},{"q":"Whom does lying harm?","opts":{"A":"Only the one who lies","B":"No one","C":"Only adults","D":"Individuals and the community"},"answer":"D"},{"q":"Along with gambling and games of chance, what else is a major sin?","opts":{"A":"Sport and exercise","B":"Horoscopes and betting","C":"Learning and travelling","D":"Trade and crafts"},"answer":"B"},{"q":"Why are gambling, games of chance, horoscopes and betting forbidden?","opts":{"A":"Because they only waste time","B":"Because they are new","C":"Because their harm is far greater than any benefit people see in them","D":"Because they are hard to learn"},"answer":"C"},{"q":"What counts as a major sin of the tongue?","opts":{"A":"Making du‘a","B":"Kind speech","C":"Greeting with salam","D":"Carrying tales, backbiting and slander"},"answer":"D"},{"q":"What does backbiting mean?","opts":{"A":"Saying about someone who is not there something they would not like","B":"Praising someone","C":"Greeting a friend with salam","D":"Giving someone advice in private"},"answer":"A"},{"q":"What does slandering someone mean?","opts":{"A":"Talking about their good deeds","B":"Blaming them for something they did not do","C":"Giving them advice","D":"Forgiving their mistake"},"answer":"B"},{"q":"What is the ruling on alcohol?","opts":{"A":"It is allowed in small amounts","B":"It is allowed for adults","C":"Every drink that contains alcohol, in any amount, is forbidden","D":"It is forbidden only if you drink a lot"},"answer":"C"},{"q":"Why has Allah (SWT) forbidden major sins?","opts":{"A":"Because of the harm major sins do to people","B":"Because they are hard to remember","C":"Because people don’t like them","D":"Because they are rare"},"answer":"A"},{"q":"What is a Muslim’s duty regarding good and evil?","opts":{"A":"Pay no attention to others","B":"To command what is good, and to hold people back from evil and everything that leads to evil","C":"Talk only about other people’s mistakes","D":"Care only about yourself"},"answer":"B"},{"q":"Into which three kinds are sins divided?","opts":{"A":"Minor, major and grave","B":"Public, secret and hidden","C":"Light, medium and big","D":"On purpose, not on purpose and by chance"},"answer":"A"},{"q":"What are grave sins?","opts":{"A":"Sins that are easily wiped away","B":"Sins that take the person who commits them out of the religion of Islam","C":"Only sins against people","D":"Sins that have no consequences"},"answer":"B"},{"q":"Why is it important to know the grave sins?","opts":{"A":"So that we can list them","B":"So that we can argue about them","C":"So that Muslim men and women know them and keep away from them","D":"Only for a school test"},"answer":"C"},{"q":"What counts as a grave sin?","opts":{"A":"Forgetting something","B":"Talking","C":"Making a mistake by accident","D":"Kufr"},"answer":"D"},{"q":"What is kufr?","opts":{"A":"Disbelief in Allah (SWT) and the other basic truths of the faith, and denying them","B":"Doing a minor sin","C":"Forgetting a duty","D":"Talking during the Adhan"},"answer":"A"},{"q":"What does denying the basic truths of the faith mean?","opts":{"A":"Learning about the faith","B":"Rejecting them and not believing in them","C":"Asking questions about them","D":"Teaching others"},"answer":"B"},{"q":"What is shirk?","opts":{"A":"Disbelief","B":"Leaving Salah","C":"Associating partners with Allah (SWT)","D":"Backbiting"},"answer":"C"},{"q":"What does shirk involve?","opts":{"A":"Believing only in Allah","B":"Doing good deeds","C":"Respecting parents","D":"Believing that besides Allah there are other gods"},"answer":"D"},{"q":"Which word do we use only when we talk about our relationship with Allah the Exalted?","opts":{"A":"To love","B":"To worship","C":"To respect","D":"To help"},"answer":"B"},{"q":"What is riddah?","opts":{"A":"Slander","B":"Backbiting","C":"Leaving the religion of Islam","D":"Leaving out a Sunnah"},"answer":"C"},{"q":"When is it riddah?","opts":{"A":"When a person makes a mistake in reciting","B":"When they forget something","C":"When they miss a voluntary deed","D":"When a person openly declares that they are leaving the religion of Islam or declares that they are no longer Muslim"},"answer":"D"},{"q":"What is nifaq?","opts":{"A":"Hypocrisy in religion","B":"A lie in everyday conversation","C":"A minor sin","D":"Forgetfulness"},"answer":"A"},{"q":"How is nifaq described?","opts":{"A":"The person believes both openly and in secret","B":"The person openly says that they believe, but in secret denies their belief","C":"The person openly says they are not Muslim","D":"The person does not know the rules of religion well enough"},"answer":"B"},{"q":"Which of these counts as a grave sin?","opts":{"A":"Slander","B":"Ghibah (backbiting)","C":"Belittling, mocking and cursing Allah (SWT), His prophets, the Qur’an, the Ka‘bah, Salah and mosques","D":"Lying"},"answer":"C"},{"q":"Which of these is a grave sin?","opts":{"A":"Mocking Allah’s prophets","B":"Not knowing about the prophets","C":"Sending salawat","D":"Reading about the lives of the prophets"},"answer":"A"},{"q":"How should we treat the Qur’an?","opts":{"A":"Belittle it","B":"With respect","C":"Mock its rules","D":"Ignore it"},"answer":"B"},{"q":"In the lesson, what is listed together with the Qur’an, the Ka‘bah and Salah as something that must not be belittled?","opts":{"A":"A house","B":"A school","C":"A mosque","D":"Trading"},"answer":"C"},{"q":"What are the fard duties?","opts":{"A":"Allah’s commands","B":"Allah’s prohibitions","C":"Only recommended deeds","D":"Folk customs"},"answer":"A"},{"q":"Besides the fard duties and Allah’s commands, what else must not be denied?","opts":{"A":"Customs","B":"Allowed things","C":"Haram","D":"Personal opinions"},"answer":"C"},{"q":"What happens to a person who commits one of the grave sins?","opts":{"A":"They get a reward","B":"They stop being Muslim","C":"They commit only a minor sin","D":"Nothing happens"},"answer":"B"},{"q":"What must a person do to become Muslim again?","opts":{"A":"Only do a good deed","B":"Only give sadaqah","C":"Make tawbah (repent) and say the Kalimah ash-Shahadah","D":"Only go to the mosque"},"answer":"C"},{"q":"What does making tawbah mean?","opts":{"A":"Carrying on with the sin","B":"Forgetting the sin","C":"Making excuses for the sin","D":"Sincerely repenting"},"answer":"D"},{"q":"According to the text, what follows if a person dies without repenting after committing a grave sin?","opts":{"A":"They are considered a disbeliever","B":"They are considered not to have sinned","C":"The sin turns into a minor one","D":"Everything is automatically forgiven"},"answer":"A"},{"q":"Which list contains only grave sins?","opts":{"A":"Lying, backbiting and talking during the Adhan","B":"Kufr, shirk, riddah and nifaq","C":"Forgetting, talking and sleeping","D":"Leaving out a Sunnah, laughing and playing"},"answer":"B"},{"q":"What counts as a consequence of sin?","opts":{"A":"Better health","B":"More provision (rizq)","C":"Harm to a person’s mental and physical health","D":"Stronger family ties"},"answer":"C"},{"q":"Which of these is a consequence of sin?","opts":{"A":"Weakening or loss of faith","B":"More barakah (blessing)","C":"A stronger community","D":"More provision (rizq)"},"answer":"A"},{"q":"What can sins cause in a family?","opts":{"A":"Only wealth","B":"More harmony","C":"More provision (rizq)","D":"Poverty and weaker family ties and harmony"},"answer":"D"},{"q":"What is tawbah?","opts":{"A":"Repenting for a sin you have done","B":"Doing a sin","C":"Forgetting a sin","D":"Making excuses for a sin"},"answer":"A"},{"q":"When should a person repent after committing a sin?","opts":{"A":"Only after several years","B":"Only in old age","C":"Straight after committing the sin","D":"Only during Ramadan"},"answer":"C"},{"q":"What is needed for tawbah to be accepted?","opts":{"A":"Only saying that we are sorry","B":"Hiding the sin from others","C":"Carrying on doing the same sin","D":"Stopping the sin, repenting in the heart and never going back to that sin"},"answer":"D"},{"q":"What should be done if the sin was against another person?","opts":{"A":"Apologise and ask them to forgive you (halal)","B":"Pay no attention to it","C":"Only recite a du‘a","D":"Hide what happened"},"answer":"A"},{"q":"What are the words of repentance?","opts":{"A":"Subhanallahi wa bihamdihi","B":"Astaghfirullaha min kulli dhanbin wa atubu ilayh","C":"La hawla wa la quwwata illa billah","D":"Hasbunallahu wa ni‘mal-wakil"},"answer":"B"},{"q":"Which daily prayer is Asr in the order of prayers?","opts":{"A":"The first","B":"The second","C":"The third","D":"The fourth"},"answer":"C"},{"q":"When does the time for Asr prayer begin?","opts":{"A":"From sunrise","B":"Halfway between noon and sunset","C":"After sunset","D":"After Isha"},"answer":"B"},{"q":"How many rak‘ahs does Asr prayer have in total?","opts":{"A":"6","B":"10","C":"8","D":"12"},"answer":"C"},{"q":"How are the eight rak‘ahs of Asr prayer divided?","opts":{"A":"Four Sunnah and four fard","B":"Two Sunnah and six fard","C":"Four fard and four final Sunnah","D":"Eight fard"},"answer":"A"},{"q":"What is prayed first in Asr prayer?","opts":{"A":"The fard","B":"The final Sunnah","C":"Witr","D":"The Sunnah"},"answer":"D"},{"q":"How many rak‘ahs are in the Asr Sunnah?","opts":{"A":"Two","B":"Four","C":"Three","D":"Six"},"answer":"B"},{"q":"What is recited in the first rak‘ah of the Asr Sunnah?","opts":{"A":"Only Al-Fatihah","B":"Bismillah and Al-Fatihah","C":"Subhanaka, A‘udhu billah, Bismillah, Al-Fatihah and a surah","D":"Only Subhanaka"},"answer":"C"},{"q":"What is recited in the second rak‘ah of the Asr Sunnah?","opts":{"A":"Bismillah, Al-Fatihah and a surah","B":"Only Al-Fatihah","C":"Subhanaka and Al-Fatihah","D":"Only a surah"},"answer":"A"},{"q":"What is recited in the first sitting of the Asr Sunnah?","opts":{"A":"Only the Salawat","B":"At-Tahiyyat and the Salawat","C":"Only a du‘a","D":"Al-Fatihah and a surah"},"answer":"B"},{"q":"What is recited in the third rak‘ah of the Asr Sunnah?","opts":{"A":"Only Al-Fatihah","B":"Bismillah and Al-Fatihah","C":"Only Subhanaka","D":"Subhanaka, A‘udhu billah, Bismillah, Al-Fatihah and a surah"},"answer":"D"},{"q":"What is recited in the fourth rak‘ah of the Asr Sunnah?","opts":{"A":"Only Al-Fatihah","B":"At-Tahiyyat","C":"Bismillah, Al-Fatihah and a surah","D":"Only a surah"},"answer":"C"},{"q":"What is recited in the last sitting of the Asr Sunnah?","opts":{"A":"At-Tahiyyat, the Salawat, du‘as, and the salam is given","B":"Only At-Tahiyyat","C":"Al-Fatihah and a surah","D":"Only the Salawat"},"answer":"A"},{"q":"How many rak‘ahs are in the fard of Asr?","opts":{"A":"Two","B":"Three","C":"Six","D":"Four"},"answer":"D"},{"q":"What is recited in the first rak‘ah of the Asr fard?","opts":{"A":"Only Al-Fatihah","B":"Subhanaka, A‘udhu billah, Bismillah, Al-Fatihah and a surah","C":"Bismillah and Al-Fatihah","D":"Only Subhanaka"},"answer":"B"},{"q":"What is recited in the second rak‘ah of the Asr fard?","opts":{"A":"Bismillah, Al-Fatihah and a surah","B":"Only Al-Fatihah","C":"Subhanaka, Al-Fatihah and a surah","D":"At-Tahiyyat"},"answer":"A"},{"q":"What is recited in the first sitting of the Asr fard?","opts":{"A":"At-Tahiyyat and the Salawat","B":"Only the Salawat","C":"At-Tahiyyat","D":"Al-Fatihah"},"answer":"C"},{"q":"What is recited in the third rak‘ah of the Asr fard?","opts":{"A":"Al-Fatihah and a surah","B":"Subhanaka, Al-Fatihah and a surah","C":"Only a surah","D":"Bismillah and Al-Fatihah"},"answer":"D"},{"q":"What is recited in the fourth rak‘ah of the Asr fard?","opts":{"A":"Bismillah and Al-Fatihah","B":"Bismillah, Al-Fatihah and a surah","C":"Subhanaka and Al-Fatihah","D":"Only a surah"},"answer":"A"},{"q":"What is recited in the last sitting of the Asr fard?","opts":{"A":"Only At-Tahiyyat","B":"At-Tahiyyat, the Salawat, du‘as, and the salam is given","C":"Al-Fatihah and a surah","D":"Only the Salawat"},"answer":"B"},{"q":"What is an important difference between the first sitting of the Asr Sunnah and of the Asr fard?","opts":{"A":"In both only Al-Fatihah is recited","B":"In the fard the Salawat are recited, but not in the Sunnah","C":"In the first sitting of the Sunnah At-Tahiyyat and the Salawat are recited, but in the first sitting of the fard only At-Tahiyyat","D":"There is no difference at all"},"answer":"C"},{"q":"Who counts as a musafir (traveller)?","opts":{"A":"A person who goes to the mosque","B":"A person who sets off from where they live on a journey of at least 80 kilometres","C":"A person who travels at least 20 kilometres","D":"Anyone who leaves the house"},"answer":"B"},{"q":"What is the shortest journey for a person to count as a musafir?","opts":{"A":"40 km","B":"60 km","C":"80 km","D":"100 km"},"answer":"C"},{"q":"What rules does a musafir follow when praying?","opts":{"A":"The easier rules set for a traveller","B":"There are no easier rules","C":"They don’t have to pray","D":"They pray only one prayer a day"},"answer":"A"},{"q":"What does a musafir do with the four-rak‘ah fard prayers?","opts":{"A":"Prays them as four rak‘ahs","B":"Prays only one rak‘ah","C":"Does not pray them","D":"Shortens them to two rak‘ahs"},"answer":"D"},{"q":"How many rak‘ahs of a four-rak‘ah fard does a musafir pray?","opts":{"A":"One","B":"Two","C":"Three","D":"Four"},"answer":"B"},{"q":"Which fard prayers are not shortened when travelling?","opts":{"A":"Dhuhr and Asr","B":"Asr and Isha","C":"Fajr and Maghrib","D":"Dhuhr and Isha"},"answer":"C"},{"q":"How many rak‘ahs of the Fajr fard does a musafir pray?","opts":{"A":"Two","B":"One","C":"Three","D":"Four"},"answer":"A"},{"q":"How many rak‘ahs of the Maghrib fard does a musafir pray?","opts":{"A":"One","B":"Two","C":"Four","D":"Three"},"answer":"D"},{"q":"How does a musafir pray the Witr prayer?","opts":{"A":"Shortens it to one rak‘ah","B":"Without shortening","C":"Does not pray it","D":"Shortens it to two rak‘ahs"},"answer":"B"},{"q":"Must a musafir pray the Sunnah prayers?","opts":{"A":"Yes, always","B":"Only the Sunnah of Fajr","C":"It is not compulsory","D":"Sunnah prayers are prayed only in the mosque"},"answer":"C"},{"q":"If a musafir prays the Sunnah prayers, how do they pray them?","opts":{"A":"Without shortening","B":"They shorten them all to one rak‘ah","C":"They shorten them all to two rak‘ahs","D":"They pray only half"},"answer":"A"},{"q":"If they are able to, where will a traveller pray Salah?","opts":{"A":"Only in the vehicle","B":"Alone in a hotel room","C":"Only at home","D":"In jama‘ah"},"answer":"D"},{"q":"How does a musafir pray behind an imam who is not travelling (as a muqtadi)?","opts":{"A":"Prays only two rak‘ahs","B":"Follows the imam without shortening the prayer","C":"Leaves the prayer after the second rak‘ah","D":"Is not allowed to pray behind him"},"answer":"B"},{"q":"A traveller arrived at the mosque for Dhuhr prayer and prays behind an imam who is not travelling. How many rak‘ahs of fard will he pray?","opts":{"A":"One","B":"Two","C":"Four","D":"Three"},"answer":"C"},{"q":"Can a musafir be the imam for people who are not travelling?","opts":{"A":"Yes, he can","B":"Never","C":"Only at Fajr","D":"Only at Maghrib"},"answer":"A"},{"q":"What will a musafir imam do after two rak‘ahs of a four-rak‘ah fard?","opts":{"A":"He will keep praying four rak‘ahs","B":"He will stop the prayer without the salam","C":"He will wait for the others","D":"He will give the salam after two rak‘ahs"},"answer":"D"},{"q":"What will the muqtadis who are not travelling do when the musafir imam gives the salam after two rak‘ahs?","opts":{"A":"They also end the prayer","B":"They will carry on and pray the third and fourth rak‘ah","C":"They will repeat the prayer from the beginning","D":"They will pray only one more rak‘ah"},"answer":"B"},{"q":"What should a Muslim do about Salah before a journey?","opts":{"A":"Decide not to pray","B":"Pray all the prayers in advance","C":"Plan stops and pray each prayer in its time","D":"Pray only after arriving"},"answer":"C"},{"q":"What can a traveller do if they cannot stop for Salah?","opts":{"A":"Pray in the vehicle if conditions allow","B":"Leave out the prayer completely","C":"Wait a few days","D":"Pray all the prayers after coming home"},"answer":"A"},{"q":"If possible, which way will a traveller face while praying in a vehicle?","opts":{"A":"Towards the window","B":"Towards the driver","C":"In the direction of travel","D":"Towards the Qiblah"},"answer":"D"},{"q":"How can a traveller pray in a vehicle if they cannot stand normally?","opts":{"A":"Lying down without any movements","B":"Sitting, doing ruku‘ and sajdah with gestures","C":"They cannot pray at all","D":"Only standing"},"answer":"B"},{"q":"How will a traveller pray if it is possible to pray standing in the vehicle?","opts":{"A":"Always sitting","B":"Lying down","C":"Standing","D":"They will not pray"},"answer":"C"},{"q":"What will a traveller do if they miss a prayer?","opts":{"A":"They will make it up when they are able","B":"They don’t need to make it up","C":"They will replace it with a du‘a","D":"They will pray it only when they get home"},"answer":"A"},{"q":"How will a traveller make up a four-rak‘ah prayer that was due during the journey?","opts":{"A":"With four rak‘ahs","B":"With three rak‘ahs","C":"With one rak‘ah","D":"Shortened"},"answer":"D"},{"q":"For how long can a traveller intend to stay at the place they travel to and still use the easier rules?","opts":{"A":"Up to 5 days","B":"Up to 15 days","C":"Up to 30 days","D":"Up to 40 days"},"answer":"B"},{"q":"What happens if, when setting off, the traveller intends to stay longer than 15 days?","opts":{"A":"They use the easier rules the whole time","B":"They use the easier rules only at weekends","C":"They use the easier rules only while on the road","D":"They don’t have to pray the fard prayers"},"answer":"C"},{"q":"A traveller plans to stay with a friend for ten days. Do they use the traveller’s easier rules?","opts":{"A":"Yes","B":"No","C":"Only on the first day","D":"Only on the last day"},"answer":"A"},{"q":"A traveller intends to stay in a city for more than fifteen days. When do the traveller’s easier rules stop for them?","opts":{"A":"After seven days","B":"After fifteen days","C":"Only when they get home","D":"When they arrive at the place they travelled to"},"answer":"D"},{"q":"Which kind of prayer can be prayed sitting if standing is difficult for us?","opts":{"A":"Only the Fajr fard","B":"Nafl (voluntary) prayer","C":"Only Jumu‘ah prayer","D":"Only the Maghrib fard"},"answer":"B"},{"q":"What is illness in the life of a believing man or woman?","opts":{"A":"A reason to give up Salah completely","B":"A test","C":"A punishment with no way out","D":"A reason not to do ‘ibadah"},"answer":"B"},{"q":"Does illness free a Muslim from the duty of Salah if they are able to pray with the easier rules?","opts":{"A":"Yes, always","B":"Only in winter","C":"No","D":"Only while travelling"},"answer":"C"},{"q":"How will a sick person pray who cannot pray standing?","opts":{"A":"Sitting","B":"They will not pray","C":"They will only make a du‘a","D":"They will make it up when they get better"},"answer":"A"},{"q":"How can a sick person who prays sitting do ruku‘ and sajdah?","opts":{"A":"Only with their eyes","B":"They don’t do them","C":"Only with words","D":"With gestures, bending lower for sajdah than for ruku‘"},"answer":"D"},{"q":"How will a sick person pray if they cannot sit?","opts":{"A":"Standing","B":"Lying down","C":"Walking","D":"They will not pray"},"answer":"B"},{"q":"If they can, how will a sick person who prays lying down face the Qiblah?","opts":{"A":"They will point their feet towards the Qiblah, bending them at the knees","B":"They will turn their back to the Qiblah","C":"It doesn’t matter which way they face","D":"They must lie on their stomach"},"answer":"A"},{"q":"How will a sick person who is lying down do the parts of Salah?","opts":{"A":"With movements of the legs","B":"Only by reciting out loud","C":"They will raise their head to do the parts of Salah as a sign","D":"They will not do the parts of Salah"},"answer":"C"},{"q":"How can a sick person pray who cannot move any part of their body?","opts":{"A":"Only sitting down","B":"Standing with help from another person","C":"They cannot pray at all","D":"In their thoughts"},"answer":"D"},{"q":"When does a sick person put off prayers to make them up later?","opts":{"A":"When they don’t feel like praying","B":"When their serious condition does not let them pray even with the easier rules","C":"When they are busy","D":"When they want to sleep"},"answer":"B"},{"q":"What will a sick person do with missed prayers if their serious condition lasts less than one day?","opts":{"A":"They will make them up when they are able","B":"They will never pray them","C":"They will pray only Fajr","D":"They will replace them with a du‘a"},"answer":"A"},{"q":"What applies if the sick person’s serious condition lasts longer than one day?","opts":{"A":"They must make up twice as many prayers","B":"They must make up only the Fajr fard","C":"They do not have to make up the missed prayers","D":"They must pray them all on the same day"},"answer":"C"},{"q":"What is the duty of a person who is in a coma or unconscious for longer than a day and a night?","opts":{"A":"They must make up all the prayers","B":"They must make up only one prayer","C":"Their family prays for them","D":"They do not have to make up the missed prayers"},"answer":"D"},{"q":"What if the number of prayers missed by a person in a coma or unconscious is six or more?","opts":{"A":"They must make them all up","B":"They do not have to make them up","C":"They make up only two","D":"They make up only Witr"},"answer":"B"},{"q":"Who judges their own condition and how to pray during illness?","opts":{"A":"The sick person will judge their own condition and pray in the best way their health allows","B":"Only their family","C":"Other people praying in the mosque","D":"No one"},"answer":"A"}]};
let quiz=[],i=0,score=0,correct=0,wrong=0,locked=false;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function pick(level,n){return shuffle(BANKS[level]).slice(0,n).map(x=>({...x,level}))}
function begin(){quiz=[...pick("B1",10),...pick("B2",20)]; document.getElementById("start").style.display="none";document.getElementById("game").style.display="block";show()}
function show(){locked=false;let q=quiz[i]; prog.textContent=`Question ${i+1}/30`;lvl.textContent=`Set ${q.level}`;scoreEl();document.getElementById('question').textContent=q.q;msg.textContent="";aud.style.display="none";answers.innerHTML="";
let arr=shuffle(Object.keys(q.opts).map(k=>({text:q.opts[k],ok:k===q.answer})));
arr.forEach((o,idx)=>{let b=document.createElement("button");b.className="ans";b.dataset.ok=o.ok;b.innerHTML=`<b>${"ABCD"[idx]})</b> ${esc(o.text)}`;b.onclick=()=>choose(b);answers.appendChild(b)})}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function scoreEl(){document.getElementById("score").textContent=`Points: ${score}`}
function tone(ok){let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:180;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.33)}
function choose(b){if(locked)return;locked=true;let ok=b.dataset.ok==="true";if(ok){score+=10;correct++;b.classList.add("good");msg.textContent="Correct answer! +10 points";tone(true)}else{score-=3;wrong++;b.classList.add("bad");[...answers.children].find(x=>x.dataset.ok==="true")?.classList.add("good");msg.textContent="Wrong answer! −3 points";tone(false)}scoreEl();setTimeout(()=>advance(),1200)}
function half(){if(locked)return;halfBtn=document.getElementById("half");halfBtn.disabled=true;let bad=shuffle([...answers.children].filter(x=>x.dataset.ok==="false"));bad.slice(0,2).forEach(x=>x.classList.add("hide"))}
function teacher(){if(locked)return;document.getElementById("teach").disabled=true;let good=[...answers.children].find(x=>x.dataset.ok==="true");let label=good?good.innerText.split(")")[0]:"";msg.textContent=`The teacher thinks the answer is ${label}.`}
function audience(){if(locked)return;document.getElementById("pub").disabled=true;let btns=[...answers.children],good=btns.findIndex(x=>x.dataset.ok==="true"),vals=[0,0,0,0];let main=55+Math.floor(Math.random()*21),rest=100-main;vals[good]=main;let others=[0,1,2,3].filter(x=>x!==good);for(let z=0;z<2;z++){let v=Math.floor(Math.random()*(rest+1));vals[others[z]]=v;rest-=v}vals[others[2]]=rest;bars.innerHTML="";vals.forEach((v,j)=>{bars.innerHTML+=`<div><div class="bar" style="height:${v}px"></div><div class="lab">${"ABCD"[j]} ${v}%</div></div>`});aud.style.display="block"}
function advance(){if(i<quiz.length-1){i++;show()}else{game.style.display="none";finish.style.display="block";final.textContent=`Total: ${score} points`;stats.textContent=`Correct answers: ${correct} • Wrong answers: ${wrong} • Maximum: 300 points`}}
</script></body></html>
