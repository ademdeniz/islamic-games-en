<title>Feed the Baby Birds – A1</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#eaf7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17324a}.app{max-width:760px;margin:auto;padding:6px;min-height:100%}
.head{background:#fff8cf;border:3px solid #3b7393;border-radius:17px;padding:5px 8px;text-align:center}.head h1{margin:0;font-size:clamp(21px,6vw,32px);color:#1d628a}.sub{font-size:12px;font-weight:900}.stats{display:flex;justify-content:space-around;gap:5px;font-size:13px;font-weight:900;margin-top:3px}
.scene{height:190px;position:relative;overflow:hidden;border:3px solid #3b7393;border-radius:17px;margin:5px 0;background:#bfeaff}.nest{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover}.grass{position:absolute;inset:0 55% 0 0;background:linear-gradient(#bfeaff 0 52%,#7fd267 52%)}.pink{position:absolute;left:2%;bottom:5px;width:72px;height:72px;object-fit:cover;border-radius:50%}.fly{position:absolute;left:9%;top:45px;width:75px;height:75px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 3px 3px #0004);z-index:4}.fly.go{animation:feed 1.8s ease-in-out}@keyframes feed{0%{left:9%;top:55px;transform:scale(1)}30%{left:27%;top:22px;transform:scale(.95)}65%{left:49%;top:52px;transform:scale(.82)}100%{left:72%;top:92px;transform:scale(.65)}}.seed{position:absolute;left:26%;top:82px;font-size:25px;opacity:0}.seed.go{animation:seed 1.8s ease}@keyframes seed{0%,20%{opacity:1;left:26%;top:82px}100%{opacity:1;left:77%;top:112px}}
