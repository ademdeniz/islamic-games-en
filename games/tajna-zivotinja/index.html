<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secret Animal – A3</title>
<style>
:root{--gold:#d8a928;--dark:#15231b;--green:#247348;--cream:#fffaf0;--red:#b52d2d}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef9ef,#fff8df);color:#18231c}
.wrap{max-width:900px;margin:auto;padding:14px}
header{text-align:center;background:#fff;border:3px solid var(--gold);border-radius:22px;padding:14px;box-shadow:0 5px 18px #0002}
h1{margin:0;font-size:clamp(26px,7vw,44px);color:var(--green)}
.sub{font-weight:700;margin:6px 0} .author{font-weight:800}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.stat{background:#173d2b;color:white;padding:9px 13px;border-radius:14px;font-weight:800}
.game{display:grid;grid-template-columns:minmax(280px,430px) 1fr;gap:14px;margin-top:14px;align-items:start}
@media(max-width:720px){.game{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid #d7c68e;border-radius:20px;padding:12px;box-shadow:0 4px 14px #0001}
.picture{position:relative;width:100%;aspect-ratio:153.6/170.7;overflow:hidden;border-radius:16px;border:3px solid #345;background:#fff}
.picture img{width:100%;height:100%;object-fit:cover;display:block}
.rename{position:absolute;left:4%;right:4%;bottom:1.5%;height:17%;display:none;align-items:center;justify-content:center;background:#f8e5b8;border-radius:12px;font-size:clamp(18px,5vw,28px);font-weight:900;z-index:2}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);z-index:5}
.tile{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1d6841,#12472d);border:1px solid #f3d779;color:#ffe991;font-size:22px;font-weight:900;transition:.35s;user-select:none}
.tile.open{opacity:0;transform:scale(.75);pointer-events:none}
.qtitle{font-size:13px;text-align:center;color:#666;font-weight:800}
.question{font-size:clamp(18px,4.6vw,25px);font-weight:900;text-align:center;min-height:58px;margin:8px 0 12px}
.answers{display:grid;gap:8px}
.answer{width:100%;border:2px solid #d6b956;background:#fffdf5;border-radius:14px;padding:12px;text-align:left;font-size:16px;font-weight:750;cursor:pointer}
.answer:active{transform:scale(.99)} .answer:disabled{opacity:.72}
.msg{min-height:28px;text-align:center;font-weight:900;margin-top:8px}
.guessbox{margin-top:12px;background:#fff;border:2px solid var(--gold);border-radius:18px;padding:12px;text-align:center}
select,button{font:inherit}
select{width:100%;padding:12px;border:2px solid #bbb;border-radius:12px;background:white;font-size:16px}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px;border:0;border-radius:13px;font-weight:900;cursor:pointer}
.guessbtn{background:var(--gold);color:#1b1b1b} .newbtn{background:#244f38;color:white}
.note{font-size:13px;color:#666;margin:6px 0 0}
.final{display:none;margin-top:12px;text-align:center;padding:13px;background:#efffea;border:2px solid #5aaf70;border-radius:15px;font-weight:900}
footer{text-align:center;font-weight:800;margin:16px 0 6px}
</style>
<style>.bz-brand{background:#fff;border:3px solid #c99b3b;border-radius:18px;padding:8px 12px;margin:10px auto;max-width:880px;width:calc(100% - 20px);box-sizing:border-box;text-align:center}.bz-brand img{display:block;width:100%;max-width:760px;height:auto;margin:auto}</style></head>

const GUESS_NAMES=["Shark", "Ladybug", "Dolphin", "Dolphin (bottlenose)", "Camel", "Gorilla", "Lizard", "Octopus", "Hamster", "Hawk", "Badger", "Deer", "Whale", "Hen", "Horse", "Turtle", "Tortoise", "Goat", "Cow", "Crocodile", "Lion", "Butterfly", "Fox", "Cat", "Bear", "Seahorse", "Ant", "Rhino", "Eagle", "Parrot", "Dog", "Duck", "Spider", "Rooster", "Penguin", "Penguin (little)", "Snail", "Crab / Lobster", "Raccoon", "Fish", "Grasshopper", "Elephant", "Elephant (little)", "Owl", "Dragonfly", "Wolf", "Zebra", "Rabbit", "Starfish", "Bat", "Scorpion", "Frog", "Giraffe"];

let animal=null, score=0, opened=0, qOrder=[], qPos=0, locked=false, finished=false;

const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(ok){
 try{const C=window.AudioContext||window.webkitAudioContext;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:190;g.gain.value=.08;o.start();o.stop(c.currentTime+.16)}catch(e){}
}
function makeTiles(){
 const t=$("tiles");t.innerHTML="";
 for(let i=0;i<20;i++){const d=document.createElement("div");d.className="tile";d.textContent="✦";t.appendChild(d)}
}
function revealOne(){
 const closed=[...document.querySelectorAll(".tile:not(.open)")];
 if(!closed.length)return;
 closed[Math.floor(Math.random()*closed.length)].classList.add("open");
 opened++; $("opened").textContent=opened; $("bonus").textContent=(20-opened)*10;
 if(opened>=20) finish(false);
}
function setAnimal(){
 animal=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
 $("animalImg").src=animal.img;
 const r=$("rename");
 if(animal.override){r.textContent=animal.override;r.style.display="flex"}else{r.style.display="none"}
}
function fillGuess(){
 const s=$("guess");s.innerHTML='<option value="">Choose an animal…</option>';
 GUESS_NAMES.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)})
}
function nextQuestion(){
 if(finished)return;
 if(qPos>=qOrder.length){qOrder=shuffle([...Array(QUESTIONS.length).keys()]);qPos=0}
 locked=false;
 const q=QUESTIONS[qOrder[qPos]];
 $("qnum").textContent=qPos+1;
 $("question").textContent=q.q;
 $("msg").textContent="";
 const choices=q.o.map((text,i)=>({text,correct:i===q.a}));
 shuffle(choices);
 const box=$("answers");box.innerHTML="";
 choices.forEach((x,i)=>{
   const b=document.createElement("button");b.className="answer";
   b.textContent=String.fromCharCode(65+i)+") "+x.text;
   b.onclick=()=>answer(x.correct,b);
   box.appendChild(b);
 });
}
function answer(ok,btn){
 if(locked||finished)return;locked=true;
 [...document.querySelectorAll(".answer")].forEach(b=>b.disabled=true);
 if(ok){
   score+=10;$("score").textContent=score;$("msg").textContent="✅ CORRECT! +10 points. One square is uncovered.";tone(true);revealOne();
 }else{
   score-=3;$("score").textContent=score;$("msg").textContent="❌ WRONG! −3 points. The square stays closed.";tone(false);
 }
 if(!finished)setTimeout(()=>{qPos++;nextQuestion()},950);
}
function guessAnimal(){
 if(finished)return;
 const g=$("guess").value;
 if(!g){$("guessMsg").textContent="Choose the animal you want to guess.";return}
 if(g===animal.name){
   const b=(20-opened)*10;score+=b;$("score").textContent=score;
   $("guessMsg").textContent="🎉 CORRECT! Bonus +"+b+" points!";tone(true);finish(true);
 }else{
   score-=3;$("score").textContent=score;$("guessMsg").textContent="❌ That’s not the animal. −3 points. Try again later.";tone(false);
 }
}
function finish(guessed){
 if(finished)return;finished=true;
 document.querySelectorAll(".tile").forEach(t=>t.classList.add("open"));
 $("opened").textContent="20";$("bonus").textContent="0";
 $("answers").innerHTML="";
 $("question").textContent="🎉 The secret animal has been revealed!";
 const f=$("final");f.style.display="block";
 f.textContent=(guessed?"🏆 Well done! You guessed it: ":"The secret animal was: ")+animal.name+" • Total points: "+score;
}
function reset(){
 score=0;opened=0;qPos=0;locked=false;finished=false;
 $("score").textContent="0";$("opened").textContent="0";$("bonus").textContent="200";
 $("guessMsg").textContent="";$("final").style.display="none";$("guess").value="";
 qOrder=shuffle([...Array(QUESTIONS.length).keys()]);
 setAnimal();makeTiles();nextQuestion();
}
$("guessBtn").onclick=guessAnimal;$("newBtn").onclick=reset;
fillGuess();reset();
</script>
