<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#140c07">
<title>Maktab Escape Room – Level B1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);background:#140c07;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:1100px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
h1{font-size:clamp(18px,4vw,30px);margin:0;color:#f4d58d}.sig{font-size:12px;color:#dbc7a4}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#2a1a10;border:1px solid #7a5a32;border-radius:999px;padding:5px 9px;font-weight:700;font-size:12px}
.task{background:#2b1b10;border:1px solid #a67c3d;border-radius:12px;padding:9px 12px;text-align:center;margin-bottom:8px;font-weight:800;color:#ffe2a4}
.room{position:relative;border:2px solid #8b6737;border-radius:14px;overflow:hidden;background:#000}.room img{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:100%;height:auto}
.hot{position:absolute;min-width:28px;min-height:28px;touch-action:manipulation;-webkit-appearance:none;appearance:none;border:0;background:transparent;cursor:pointer;border-radius:10px;touch-action:manipulation}.hot:focus{outline:3px solid #ffd76a}.hot.wrong{background:rgba(220,50,50,.25);outline:2px solid rgba(255,100,100,.9)}.hot.done{background:rgba(63,180,90,.22);outline:2px solid rgba(120,255,140,.8)}
.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}.code{font-weight:900;letter-spacing:3px;color:#ffe29a}.btn{touch-action:manipulation;-webkit-appearance:none;appearance:none;border:1px solid #a77c3d;background:#3a2515;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}
.card{width:min(620px,100%);max-height:92vh;overflow:auto;background:#20140d;border:2px solid #a67c3d;border-radius:18px;padding:16px}
.qmeta{color:#e7c987;font-weight:800;margin-bottom:7px}.q{font-size:clamp(17px,4vw,23px);font-weight:800;line-height:1.25;margin-bottom:12px}
.answers{display:grid;gap:8px}.ans{width:100%;touch-action:manipulation;-webkit-appearance:none;appearance:none;text-align:left;border:1px solid #725435;background:#332116;color:#fff;border-radius:11px;padding:12px;font-size:16px;min-height:48px}
.ans.ok{background:#174c2a}.ans.bad{background:#6b1f1f}.msg{min-height:28px;margin-top:10px;font-weight:800}.digit{font-size:42px;text-align:center;color:#ffd86b;font-weight:1000;margin:8px}
@media(max-width:560px){.app{padding:5px}.top{grid-template-columns:1fr}.status{justify-content:flex-start}.task{font-size:14px;padding:7px}.bottom{grid-template-columns:1fr}.card{padding:12px}.ans{font-size:14px;padding:9px}}
</style>

const room=document.getElementById('room'),task=document.getElementById('task'),foundEl=document.getElementById('found'),scoreEl=document.getElementById('score'),codeEl=document.getElementById('code');
const modal=document.getElementById('modal'),qEl=document.getElementById('q'),answersEl=document.getElementById('answers'),qmeta=document.getElementById('qmeta'),msg=document.getElementById('msg'),digitBox=document.getElementById('digitBox');
let order=[], digits=[], qset=[], step=0, qi=0, score=0, active=null, locked=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function beep(ok){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:190;g.gain.value=.08;o.start();o.stop(c.currentTime+.13)}catch(e){}}
function start(){
 room.querySelectorAll('.hot').forEach(x=>x.remove()); order=shuffle(OBJECTS.map((_,i)=>i)); digits=Array.from({length:10},()=>Math.floor(Math.random()*10));
 qset=shuffle(ALLQ).slice(0,30); step=0;qi=0;score=0;active=null;locked=false; modal.classList.remove('show'); renderHot(); update();
}
function renderHot(){
 OBJECTS.forEach((o,i)=>{let b=document.createElement('button');b.type='button';b.className='hot';b.setAttribute('aria-label',o.name);b.style.left=o.x+'%';b.style.top=o.y+'%';b.style.width=o.w+'%';b.style.height=o.h+'%';b.dataset.i=i;b.addEventListener('click',()=>hit(i,b));room.appendChild(b)})
}
function update(){
 foundEl.textContent='Items '+step+'/10';scoreEl.textContent='Points '+score;codeEl.textContent=digits.map((d,i)=>i<step?d:'_').join(' ');
 if(step<10) task.textContent='🔎 Find: '+OBJECTS[order[step]].name; else task.textContent='🎉 All items found! Your code is '+digits.join('');
}
function hit(i,b){
 if(step>=10)return;
 if(i!==order[step]){beep(false);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);task.textContent='❌ That is not the item you are looking for. Find: '+OBJECTS[order[step]].name;setTimeout(update,850);return}
 active={i,b};qi=0;b.classList.add('done');modal.classList.add('show');showQ();
}
function showQ(){
 locked=false;msg.textContent='';digitBox.innerHTML='';let q=qset[step*3+qi];qmeta.textContent='Item '+(step+1)+'/10 • question '+(qi+1)+'/3';qEl.textContent=q.q;answersEl.innerHTML='';
 shuffle(q.opts).forEach(opt=>{let b=document.createElement('button');b.type='button';b.className='ans';b.textContent=opt;b.addEventListener('click',()=>answer(b,opt,q.correct));answersEl.appendChild(b)})
}
function answer(btn,opt,correct){
 if(locked)return;locked=true;let ok=opt===correct;beep(ok);
 if(ok){btn.classList.add('ok');score+=10;msg.textContent='✅ Correct!';setTimeout(next,650)}
 else{btn.classList.add('bad');score=Math.max(0,score-3);msg.textContent='❌ Wrong. Try again.';setTimeout(()=>{locked=false;btn.classList.remove('bad')},700)}
 scoreEl.textContent='Points '+score;
}
function next(){
 qi++;
 if(qi<3){showQ();return}
 let d=digits[step];digitBox.innerHTML='<div class="digit">🔑 '+d+'</div><div style="text-align:center">You won a part of the code!</div>';qEl.textContent='Excellent! All 3 questions are solved.';answersEl.innerHTML='';qmeta.textContent='Item solved';
 setTimeout(()=>{modal.classList.remove('show');step++;update(); if(step===10){setTimeout(()=>alert('Congratulations! Final code: '+digits.join('')),200)}},1200)
}
document.getElementById('restart').addEventListener('click',start);
start();
</script></body></html>
