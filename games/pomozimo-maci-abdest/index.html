const steps=[
{text:'A’udhu, Bismillah and niyyah',icon:'🤲'},
{text:'Hands 3x',icon:'👐'},
{text:'Mouth 3x',icon:'👄'},
{text:'Nose 3x',icon:'👃'},
{text:'Face 3x',icon:'🧒'},

{text:'Left foot up to the ankle',icon:'🦶'},
{text:'Shahadah',icon:'☝️'}
];
const game=document.getElementById('game'),collected=document.getElementById('collected'),scoreEl=document.getElementById('score'),prog=document.getElementById('progress'),msg=document.getElementById('message'),start=document.getElementById('start');let score=0,next=0,timer=null,running=false,soundOn=true,audioCtx=null;
function tone(freq,dur,type='sine'){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}
function good(){tone(660,.12);setTimeout(()=>tone(880,.16),100)}function bad(){tone(170,.22,'sawtooth')}
function shuffled(){return [...steps.keys()].sort(()=>Math.random()-.5)}
function spawn(){if(!running)return;let ids=shuffled().slice(0,Math.min(5,steps.length));if(!ids.includes(next)&&next<steps.length)ids[Math.floor(Math.random()*ids.length)]=next;ids.forEach((id,i)=>{setTimeout(()=>makeDrop(id),i*380)});timer=setTimeout(spawn,4300)}
function makeDrop(id){if(!running)return;const b=document.createElement('button');b.className='drop';b.dataset.id=id;b.style.left=(2+Math.random()*82)+'%';b.style.animationDuration=(10.5+Math.random()*3.5)+'s';b.innerHTML='<div class="dropShape"><div class="dropText">'+'<span class="dropIcon">'+steps[id].icon+'</span><span>'+steps[id].text+'</span></div></div>';b.addEventListener('click',()=>hit(b,id));b.addEventListener('animationend',()=>b.remove());game.appendChild(b)}
function addCollected(id){const d=document.createElement('div');d.className='miniDrop';d.title=steps[id].text;const icons=['🤲','👐','👄','👃','🙂','💪','💪','🧑‍🦱','👂','🧣','🦶','🦶','☝️'];d.innerHTML='<span class="miniIcon">'+icons[id]+'</span>';collected.appendChild(d);collected.scrollLeft=collected.scrollWidth}function hit(b,id){if(!running)return;if(id===next){score+=10;addCollected(id);next++;good();floatText(b,'+10');b.classList.add('pop');setTimeout(()=>b.remove(),240);prog.textContent='Step '+next+' / 13';if(next===steps.length)finish()}else{score=Math.max(0,score-3);bad();floatText(b,'−3');b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500)}scoreEl.textContent=score}
function floatText(b,t){const r=b.getBoundingClientRect(),g=game.getBoundingClientRect(),e=document.createElement('div');e.className='plus';e.textContent=t;e.style.left=(r.left-g.left+r.width/2)+'px';e.style.top=(r.top-g.top+r.height/2)+'px';game.appendChild(e);setTimeout(()=>e.remove(),750)}
function finish(){running=false;clearTimeout(timer);document.querySelectorAll('.drop').forEach(x=>x.remove());msg.innerHTML='🎉 Well done! The kitty made Wudu the right way!<br>You earned: '+score+' points 🐾';msg.style.display='block';start.textContent='↻ PLAY AGAIN';start.style.display='block';good();setTimeout(good,350)}
function begin(){document.querySelectorAll('.drop').forEach(x=>x.remove());score=0;next=0;collected.innerHTML='<span class="collectedLabel">COLLECTED:</span>';scoreEl.textContent=0;prog.textContent='Step 0 / 13';msg.style.display='none';start.style.display='none';running=true;clearTimeout(timer);armSpots()}
const SPOTS=[[510, 1070, 700, 1320], [722, 500, 905, 735], [790, 770, 980, 1010], [535, 270, 695, 500], [470, 570, 650, 810], [1015, 620, 1210, 860], [900, 290, 1090, 540], [1275, 430, 1460, 670], [250, 215, 430, 435], [1245, 795, 1430, 1035], [740, 1085, 935, 1325], [1190, 1085, 1375, 1325], [968, 1065, 1160, 1320]],IW=1536,IH=1404;let wrongs=0;const spots=SPOTS.map((r,id)=>{const b=document.createElement('button');b.className='spot';b.dataset.id=id;b.setAttribute('aria-label',steps[id].text);b.addEventListener('click',()=>tap(b,id));game.appendChild(b);return b});const HUD=[1292,18,1520,330];function rect(){const W=game.clientWidth,H=game.clientHeight,c=document.getElementById('collected'),top=c.offsetTop+c.offsetHeight+6,s=Math.min(W/IW,(H-top)/IH);return {s,ox:(W-IW*s)/2,oy:top+(H-top-IH*s)/2}}function place(){const {s,ox,oy}=rect();game.style.backgroundSize=(IW*s)+'px '+(IH*s)+'px';game.style.backgroundPosition=ox+'px '+oy+'px';const h=document.getElementById('hud');h.style.left=(ox+HUD[0]*s)+'px';h.style.top=(oy+HUD[1]*s)+'px';h.style.right='auto';h.style.width=((HUD[2]-HUD[0])*s)+'px';h.style.height=((HUD[3]-HUD[1])*s)+'px';h.style.fontSize=Math.max(9,30*s)+'px';spots.forEach((b,id)=>{const [x0,y0,x1,y1]=SPOTS[id];b.style.left=(ox+x0*s)+'px';b.style.top=(oy+y0*s)+'px';b.style.width=((x1-x0)*s)+'px';b.style.height=((y1-y0)*s)+'px'})}addEventListener('resize',place);place();function tap(b,id){if(!running)return;spots.forEach(s=>s.classList.remove('hint'));if(id===next){score+=10;addCollected(id);next++;good();floatText(b,'+10');b.classList.add('got');wrongs=0;prog.textContent='Step '+next+' / 13';scoreEl.textContent=score;if(next===steps.length){game.classList.remove('running');finish()}}else{score=Math.max(0,score-3);scoreEl.textContent=score;bad();floatText(b,'−3');b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');if(++wrongs>=2)spots[next].classList.add('hint')}}function armSpots(){spots.forEach(s=>s.classList.remove('got','hint','wrong'));wrongs=0;game.classList.add('running');place()}start.addEventListener('click',begin);document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇'});
