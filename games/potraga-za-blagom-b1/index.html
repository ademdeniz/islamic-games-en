function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sound(ok){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:180;g.gain.setValueAtTime(.13,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.22)}catch(e){}}
function drawMap(){let m=document.getElementById('map');m.innerHTML='';LOCS.forEach((x,i)=>{let d=document.createElement('div');d.className='loc '+(i<loc?'done':i===loc?'active':'');d.innerHTML=`<span class="ico">${x[0]}</span><span>${i+1}. ${x[1]}</span>${i>loc?'<span class="lock">🔒</span>':''}`;m.appendChild(d)});document.getElementById('li').textContent=(loc+1)+'/10';document.getElementById('st').textContent=LOCS[loc][0]+' '+LOCS[loc][1];}

function answer(btn,ok){if(locked)return;locked=true;[...document.querySelectorAll('.ans')].forEach(b=>b.disabled=true);if(ok){score+=10;btn.classList.add('correct');document.getElementById('msg').textContent='✅ Correct! +10';sound(true)}else{score-=3;btn.classList.add('wrong');document.getElementById('msg').textContent='❌ Wrong! −3';sound(false)}document.getElementById('score').textContent=score;setTimeout(()=>{idx++; if(idx%PER===0&&idx<TOTAL){loc=Math.floor(idx/PER);drawMap()}showQ()},850)}
