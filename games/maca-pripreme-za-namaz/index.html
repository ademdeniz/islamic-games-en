function tone(f,d,type='sine',v=.12){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

function oneMeow(delay=0){
 if(!sound)return;
 setTimeout(()=>{try{
   ac=ac||new(window.AudioContext||window.webkitAudioContext)();

   o.frequency.setValueAtTime(780,now);o.frequency.exponentialRampToValueAtTime(430,now+.32);
   o2.frequency.setValueAtTime(390,now);o2.frequency.exponentialRampToValueAtTime(220,now+.34);
   g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.13,now+.035);
   g.gain.exponentialRampToValueAtTime(.055,now+.16);g.gain.exponentialRampToValueAtTime(.001,now+.42);

 }catch(e){}},delay)
}

function pick(b){if(busy||b===A||b.classList.contains('gone'))return;tone(420,.05);b.classList.add('sel');if(!A){A=b;return}busy=true;if(A.dataset.p===b.dataset.p){let x=A;setTimeout(()=>{correct();x.classList.remove('sel');b.classList.remove('sel');x.classList.add('gone');b.classList.add('gone');S+=10;F++;SC.textContent=S;A=null;busy=false;M.textContent='✓ Correct! Pairs left: '+(4-F)+'.';if(F===4)setTimeout(pass,600)},250)}else{let x=A;setTimeout(()=>{wrong();x.classList.remove('sel');b.classList.remove('sel');A=null;busy=false;M.textContent='✗ Not quite. Try again.'},450)}}
