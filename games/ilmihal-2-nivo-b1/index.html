st six Attributes of Allah called?", "opts": {"A": "As-sifat ath-thubutiyya", "B": "As-sifat adh-dhatiyya", "C": "The pillars of Iman", "D": "Conditions of Salah"}, "answer": "B"}, {"q": "How many attributes belong to As-sifat adh-dhatiyya?", "opts": {"A": "Four", "B": "Five", "C": "Eight", "D": "Six"}, "answer": "D"}, {"q": "Which attribute means “Allah is, and He exists”?", "opts": {"A": "Baqa’", "B": "Wujud", "C": "Qidam", "D": "Wahdaniyyah"}, "answer": "B"}, {"q": "What does the attribute WUJUD mean?", "opts": {"A": "Allah is, and He exists", "B": "Allah is One", "C": "Allah is forever", "D": "Allah has always been"}, "answer": "A"}, {"q": "Which attribute means “Allah is One”?", "opts": {"A": "Qidam", "B": "Baqa’", "C": "Wujud", "D": "Wahdaniyyah"}, "answer": "D"}, {"q": "What does WAHDANIYYAH mean?", "opts": {"A": "Allah is forever", "B": "Allah is One", "C": "Allah has always been", "D": "Allah exists by Himself"}, "answer": "B"}, {"q": "Which attribute means “Allah has always been”?", "opts": {"A": "Baqa’", "B": "Wahdaniyyah", "C": "Qidam", "D": "Wujud"}, "answer": "C"}, {"q": "What does the attribute QIDAM mean?", "opts": {"A": "Allah is forever", "B": "Allah is One", "C": "Allah is not like anyone", "D": "Allah has always been"}, "answer": "D"}, {"q": "Which attribute means “Allah is forever”?", "opts": {"A": "Baqa’", "B": "Qidam", "C": "Wujud", "D": "Wahdaniyyah"}, "answer": "A"}, {"q": "Which attribute means that Allah (SWT) is not like anyone or anything?", "opts": {"A": "Qiyamun bi nafsihi", "B": "Qidam", "C": "Wujud", "D": "Mukhalafatun lil-hawadith"}, "answer": "D"}, {"q": "What does MUKHALAFATUN LIL-HAWADITH mean?", "opts": {"A": "Allah is not like anyone or anything", "B": "Allah is One", "C": "Allah is forever", "D": "Allah has always been"}, "answer": "A"}, {"q": "Which attribute means “Allah exists by Himself (He needs no one)”?", "opts": {"A": "Wujud", "B": "Baqa’", "C": "Qiyamun bi nafsihi", "D": "Wahdaniyyah"}, "answer": "C"}, {"q": "What doe , "D": "First the right side, then the left"}, "answer": "D"}, {"q": "What is disliked (makruh) during Ghusl?", "opts": {"A": "Wasting too much water", "B": "Rinsing the mouth", "C": "Using warm water", "D": "Washing the whole body"}, "answer": "A"}, {"q": "What else is disliked during Ghusl if it is not necessary?", "opts": {"A": "Washing the head", "B": "Talking and asking someone else for help", "C": "Washing the right side of the body", "D": "Washing off visible dirt"}, "answer": "B"}, {"q": "What is “ghasl al-wujud”?", "opts": {"A": "Rinsing the nose", "B": "Washing only the hands", "C": "Washing the whole body", "D": "Washing only the face"}, "answer": "C"}, {"q": "What is istinshaq?", "opts": {"A": "Rinsing the nose", "B": "Washing only the hands", "C": "Washing the whole body", "D": "Washing only the face"}, "answer": "A"}, {"q": "What is gargling (gharghara)?", "opts": {"A": "Rinsing the nose", "B": "Washing only the hands", "C": "Washing the whole body", "D": "Rinsing the mouth and throat"}, "answer": "D"}, {"q": "What is Tayammum?", "opts": {"A": "Washing the hands with water", "B": "A symbolic purification (with clean earth)", "C": "Bathing the whole body", "D": "Washing the face and feet"}, "answer": "B"}, {"q": "When can we make Tayammum?", "opts": {"A": "When we have no water for Wudu or Ghusl", "B": "Only before sleeping", "C": "Only on Fridays", "D": "When we have enough water"}, "answer": "A"}, {"q": "What can we do if we have only a little water that we need more for drinking and cooking?", "opts": {"A": "Not pray", "B": "Make Ghusl", "C": "Make Tayammum", "D": "Only wash our hands"}, "answer": "C"}, {"q": "Can we make Tayammum if we cannot use water because of illness or great cold?", "opts": {"A": "Only in summer", "B": "Only in the mosque", "C": "No, we can’t", "D": "Yes, we can"}, "answer": "D"}, {"q": "How many fard (obligatory) parts of Tayammum are there?", "opts": {"A": "Three", "B": "Four", "C": "Five", "D": "Six"}, "answer": "A"}, {"q": tory in Surah An-Nasr, what does Allah command us to do?", "opts": {"A": "To sleep", "B": "To stay silent", "C": "To travel", "D": "To glorify and praise our Lord"}, "answer": "D"}, {"q": "What does “Fa sabbih bihamdi Rabbika” mean?", "opts": {"A": "Glorify your Lord with praise", "B": "Ask people for help", "C": "Pray only at night", "D": "Give sadaqah"}, "answer": "A"}, {"q": "What does the word “wastaghfirhu” mean in Surah An-Nasr?", "opts": {"A": "Give thanks", "B": "Ask Him to forgive you", "C": "Fast", "D": "Pray"}, "answer": "B"}, {"q": "What does “Innahu kana tawwaba” mean?", "opts": {"A": "He hears everything", "B": "He sees everything", "C": "He is ever Accepting of repentance", "D": "He created the heavens"}, "answer": "C"}, {"q": "According to Surah An-Nasr, what should we do when Allah gives us help and victory?", "opts": {"A": "Thank Him, glorify Him and ask for forgiveness", "B": "Forget to be thankful", "C": "Praise only ourselves", "D": "Stop worshipping"}, "answer": "A"}, {"q": "What is the main lesson of Surah An-Nasr?", "opts": {"A": "After success we should praise ourselves", "B": "Victory comes only by human strength", "C": "We thank Allah for help and victory and ask Him for forgiveness", "D": "There is no need to ask for forgiveness"}, "answer": "C"}]};
let quiz=[],i=0,score=0,correct=0,locked=false;const $=id=>document.getElementById(id);
let audioCtx=null;
function initAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,type='sine',delay=0,vol=.12){try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur)}catch(e){}}
function soundCorrect(){tone(523,.14,'sine',0,.13);tone(659,.16,'sine',.12,.13);tone(784,.24,'sine',.25,.14)}
function soundWrong(){tone(220,.18,'sawtooth',0,.10);tone(165,.30,'sawtooth',.15,.10)}
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function pick(a,n){return shuffle([...a]).slice(0,n)}
function begin(){initAudio();quiz=[...pick(BANKS.A3,5).map(q=>({...q,level:'A3'})),...pick(BANKS.B1,25).map(q=>({...q,level:'B1'}))];$('start').style.display='none';$('game').style.display='block';show()}
function show(){locked=false;$('aud').style.display='none';$('bars').innerHTML='';$('msg').textContent='';let q=quiz[i];$('prog').textContent=`Question ${i+1}/30`;$('lvl').textContent=`Bank: ${q.level}`;$('score').textContent=`Points: ${score}`;$('question').textContent=q.q;let items=Object.entries(q.opts).map(([key,text])=>({key,text,ok:key===q.answer}));shuffle(items);$('answers').innerHTML='';items.forEach((x,n)=>{let b=document.createElement('button');b.className='ans';b.dataset.ok=x.ok?'1':'0';b.dataset.orig=x.key;b.textContent=`${'ABCD'[n]}) ${x.text}`;b.onclick=()=>answer(b);$('answers').appendChild(b)})}
function answer(b){if(locked)return;locked=true;let ok=b.dataset.ok==='1';if(ok){score+=10;correct++;b.classList.add('good');soundCorrect();$('msg').textContent='CORRECT! +10 points'}else{score-=3;b.classList.add('bad');soundWrong();[...document.querySelectorAll('.ans')].find(x=>x.dataset.ok==='1')?.classList.add('good');$('msg').textContent='WRONG! −3 points'}$('score').textContent=`Points: ${score}`;setTimeout(()=>{i++;if(i<quiz.length)show();else finish()},1200)}
function half(){if(locked)return;$('half').disabled=true;let wrong=shuffle([...document.querySelectorAll('.ans')].filter(x=>x.dataset.ok!=='1'));wrong.slice(0,2).forEach(x=>x.classList.add('hide'))}
function audience(){if(locked)return;$('pub').disabled=true;$('aud').style.display='block';let btns=[...document.querySelectorAll('.ans')];let ci=btns.findIndex(x=>x.dataset.ok==='1');let good=55+Math.floor(Math.random()*26),rest=100-good,vals=[0,0,0,0];vals[ci]=good;let ids=[0,1,2,3].filter(x=>x!==ci);for(let k=0;k<2;k++){let v=Math.floor(Math.random()*(rest+1));vals[ids[k]]=v;rest-=v}vals[ids[2]]=rest;$('bars').innerHTML=vals.map((v,k)=>`<div><div class="bar" style="height:${v}px"></div><div class="lab">${'ABCD'[k]} ${v}%</div></div>`).join('')}
function teacher(){if(locked)return;$('teach').disabled=true;let btns=[...document.querySelectorAll('.ans')],ci=btns.findIndex(x=>x.dataset.ok==='1');$('msg').textContent=`The teacher (mu’allim) thinks the answer is ${'ABCD'[ci]}.`}
function finish(){$('game').style.display='none';$('finish').style.display='block';$('final').textContent=`Your score: ${score} points`;$('stats').textContent=`Correct answers: ${correct} of 30 • Wrong: ${30-correct}`}
</script></body></html>
