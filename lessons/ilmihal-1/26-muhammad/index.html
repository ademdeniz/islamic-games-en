<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muhammad (SAW) is our Prophet – Ilmihal 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--green:#0f5a3f;--green2:#176b45;--gold:#c99b3e;--gold2:#f3e2b3;--cream:#fff8e7;--ink:#17130d;--muted:#6a5c45;--line:#eadbb6;--ok:#d9f2df;--bad:#f9d9d3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55}
main{max-width:820px;margin:auto;padding:10px 16px 40px}
.crumbs{font-size:14px;color:var(--muted);margin:6px 0}.crumbs a{color:var(--green2);font-weight:700;text-decoration:none}
.hero{background:var(--green);color:#fff;border:3px solid var(--gold);border-radius:20px;padding:16px 18px;margin:8px 0 16px}
.hero .tag{display:inline-block;background:var(--gold2);color:#5b4212;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.hero h1{margin:8px 0 4px;font-size:clamp(24px,5.5vw,34px);line-height:1.2}.hero p{margin:0;opacity:.92}
.stars{margin-top:8px;font-size:15px;font-weight:700}
section{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
section>h2{margin:0 0 10px;color:var(--green);font-size:21px}
h3{color:#795718;margin:18px 0 6px;font-size:18px}
.phrase{border:2px solid var(--gold);border-radius:16px;padding:12px;margin:10px 0;text-align:center;background:#fffdf6}
.phrase .lbl{font-weight:800;color:#a58a4e;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;font-size:clamp(28px,6.5vw,40px);line-height:2}
.tr{font-weight:800;font-size:18px}.en{font-style:italic;color:#5a4d38}
.quran{border-left:5px solid var(--green2);background:#f1f8f3;border-radius:0 12px 12px 0;padding:10px 14px;margin:12px 0;font-style:italic}
.quran .ref{display:block;font-style:normal;font-weight:800;color:var(--green2);font-size:13px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.card .pics{display:flex;gap:4px;justify-content:center;margin-bottom:6px}.card .pics img{max-width:100%;min-width:0;flex:1;height:110px;object-fit:contain}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;max-height:360px;border-radius:14px}figure.small img{max-height:220px}
figcaption{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}.reflect-pic{float:right;max-width:34%;margin:0 0 8px 10px;border-radius:12px}
.card{background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:700}.card .i{font-size:34px;display:block}
ul.list{padding-left:20px}ul.list li{margin:6px 0}
.point{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}.point b.t{color:var(--green)}
button{font:inherit;cursor:pointer}
.btn{font-weight:800;border:0;border-radius:12px;padding:10px 14px;background:var(--gold2);color:#3f2d09}.btn.g{background:var(--green2);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.act{border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.act h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.act.done{border-color:var(--green2);background:#f6fbf7}.badge{font-size:13px;font-weight:800;color:var(--green2);white-space:nowrap}
.prompt{color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:8px}.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600}
.opt.sel{border-color:var(--gold);background:#fff6dd}.opt.ok{border-color:var(--green2);background:var(--ok)}.opt.bad{border-color:#c0492f;background:var(--bad)}
.fb{min-height:24px;font-weight:700;margin-top:8px}.fb.ok{color:var(--green2)}.fb.bad{color:#b03a22}
.why{font-size:14px;color:#8a3a26;font-weight:600;margin-top:4px}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.built{border:2px dashed var(--gold);border-radius:12px;padding:8px;margin-bottom:10px;background:#fffdf6}
.chip{border:2px solid var(--gold);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700}.chip.placed{background:var(--ok);border-color:var(--green2)}
.built.col,.pool.col{flex-direction:column}.built.col .chip,.pool.col .chip{text-align:left}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mc{min-height:84px;border-radius:12px;border:2px solid var(--gold);background:var(--green2);color:#fff;font-weight:800;padding:8px;font-size:14px}
.mc.open{background:#fff;color:var(--ink)}.mc.got{background:var(--ok);color:var(--ink);border-color:var(--green2)}
.sortq{font-size:20px;font-weight:800;text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fffdf6}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bins .btn{padding:14px;font-size:17px}
.qn{font-weight:800;margin-bottom:8px}
.reflect li{margin:8px 0}
.again-row{text-align:center;margin:10px 0 0}
.done-msg{text-align:center;font-weight:800;color:var(--green2);font-size:18px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.nav a{font-weight:800;color:var(--green2)}
footer{font-size:12px;color:#8a7c64;text-align:center;margin-top:18px}
.share{font:inherit;font-size:13px;font-weight:800;border:2px solid #176b45;background:#fff;color:#176b45;border-radius:10px;padding:6px 10px;cursor:pointer}.share:hover{background:#176b45;color:#fff}
.topnav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px auto 4px;max-width:880px}.topnav a{text-decoration:none;font-weight:800;font-size:15px;color:#0f5a3f;background:#fff;border:2px solid #eadbb6;border-radius:999px;padding:7px 14px}.topnav a.on{background:#0f5a3f;color:#fff;border-color:#0f5a3f}.topnav a:hover{border-color:#c99b3e}
.arq{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;font-size:1.5em;line-height:1.7}
p .arq{font-size:1.35em;line-height:1;unicode-bidi:isolate}p:has(.arq){line-height:2.4}
.letter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:3px solid var(--gold);border-radius:18px;padding:12px 16px;background:#fffdf6}
.letter .big{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;font-size:clamp(90px,24vw,140px);line-height:1.1;color:var(--green);text-align:center;width:1.3em;height:1.45em}
.letter .nm{font-size:26px;font-weight:900}.letter .big.sign{font-size:clamp(54px,14vw,84px);white-space:nowrap;width:2.8em;height:2.2em}.letter .bs{color:var(--muted);font-weight:600}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.forms div{border:2px solid var(--line);border-radius:10px;text-align:center;padding:2px 4px;background:#fff}
.forms .f{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;font-size:34px;line-height:1.6;display:block;height:58px}.forms small{font-size:11px;font-weight:700;color:var(--muted)}
.forms div.na{opacity:.35}.glyph{position:relative;display:block;overflow:visible}.glyph>.gi{position:absolute;line-height:1;white-space:nowrap}span.glyph{display:inline-block;vertical-align:middle;height:2.2em}.note{font-size:13px;color:var(--muted);margin-top:4px}
.tipbox{border-left:5px solid var(--gold);background:#fff6dd;border-radius:0 12px 12px 0;padding:10px 14px;margin:12px 0;font-weight:600}
.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.hk div{border:2px solid var(--gold);border-radius:14px;text-align:center;background:#fff;padding:4px}
.hk .ar{font-size:44px;line-height:1.7;height:92px}.hk b{display:block;font-size:18px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.word{border:2px solid var(--line);border-radius:14px;background:#fff;padding:8px;text-align:center;cursor:pointer}.word:hover{border-color:var(--gold)}
.word .ar{display:block;font-size:34px;line-height:1.9;margin-bottom:2px}.word b{display:block}.word i{color:var(--muted);font-size:14px}.word .ref{font-size:11px;color:#a58a4e;font-weight:700}
.word.playing{border-color:var(--green2);background:var(--ok)}
.video{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px;text-decoration:none;color:inherit;background:#fff;margin:10px 0}
.video img{width:150px;max-width:40%;border-radius:10px}.video b{display:block;color:#b3261e}.video:hover{border-color:#b3261e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.cell{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;font-size:36px;line-height:1.5;height:62px;border:2px solid var(--gold);background:#fff;border-radius:12px}
.cell.ok{background:var(--ok);border-color:var(--green2)}.cell.bad{background:var(--bad);border-color:#c0492f}

<script>
const L={"title": "Muhammad (SAW) is our Prophet", "pages": "26", "intro": "The last Prophet of Allah – and our best example.", "learn": [{"type": "image", "src": "img/madinah-mosque.webp", "alt": "The Prophet’s Mosque in Madinah with its green dome and minaret", "caption": "The Prophet’s Mosque in Madinah", "small": true}, {"type": "text", "html": "<b>Muhammad (SAW)<\/b> is the <b>last Prophet<\/b> of Allah. He was born in <b>Makkah<\/b> on the 12th of Rabi‘ al-Awwal (20 April) in the year <b>571<\/b>."}, {"type": "text", "html": "His father’s name was <b>Abdullah<\/b> and his mother’s name was <b>Aminah<\/b>. As a child he lost his parents. He grew up with his grandfather <b>Abd al-Muttalib<\/b> and his uncle <b>Abu Talib<\/b>."}, {"type": "text", "html": "When he was <b>40 years old<\/b>, Allah, the Most High, began to send him the revelation of the noble <b>Qur’an<\/b>."}, {"type": "point", "title": "⭐ Remember", "html": "When we say the name Muhammad, we add: <b>‘alayhis-salaam<\/b> (AS) – may Allah’s peace be upon him. Many Muslims also say <b>sallallaahu ‘alayhi wa sallam<\/b> (SAW)."}, {"type": "point", "title": "🌟 Our example", "html": "Muhammad (SAW) is our example in how we behave."}], "practice": [{"type": "memory", "title": "Match the people", "pairs": [["Abdullah", "His father"], ["Aminah", "His mother"], ["Abd al-Muttalib", "His grandfather"], ["Abu Talib", "His uncle"]]}, {"type": "quiz", "title": "Quick quiz", "questions": [{"q": "Who is the last Prophet of Allah?", "options": ["Muhammad (SAW)", "Musa (AS)", "Isa (AS)", "Ibrahim (AS)"], "answer": 0}, {"q": "Where was Muhammad (SAW) born?", "options": ["In Makkah", "In Madinah", "In Jerusalem", "In Ta’if"], "answer": 0}, {"q": "In which year was he born?", "options": ["571", "610", "622", "632"], "answer": 0}, {"q": "What was his mother’s name?", "options": ["Aminah", "Khadijah", "Halimah", "Fatimah"], "answer": 0}, {"q": "Who did he grow up with?", "options": ["His grandfather Abd al-Muttalib and his uncle Abu Talib", "His brothers", "His teacher", "The king of Makkah"], "answer": 0}, {"q": "How old was he when the revelation of the Qur’an began?", "options": ["40", "20", "30", "63"], "answer": 0}, {"q": "What do we say when we hear his name?", "options": ["‘Alayhis-salaam – may Allah’s peace be upon him", "Nothing", "Amin", "Allahu akbar"], "answer": 0}]}, {"type": "reflect", "title": "Talk with your mu‘allim and your parents", "prompts": ["💬 What do you know about the life of Muhammad (SAW)?", "🌟 Who can be our example in how we behave? Why?"]}], "id": "26-muhammad", "book": "ilmihal-1", "book_title": "Ilmihal 1", "source": "Ilmihal 1 for the first level of maktab, Ibrahim Softić (El-Kalem, Sarajevo, 2020)", "root": "../../../", "section": "lessons", "lessons_link": true, "number": 11, "prev": {"id": "18-salam", "title": "The Islamic greeting – salam"}, "next": {"id": "27-hasbi-rabbi", "title": "Hasbi Rabbi"}};
const PUBLIC='https://ademdeniz.github.io/islamic-games-en/';
function shareUrl(path){const local=!/^https?:$/.test(location.protocol)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);return local?PUBLIC+path:new URL(path,PUBLIC).href}   // always the public address kids can open
async function copyLink(path,btn){const url=shareUrl(path);try{await navigator.clipboard.writeText(url);const t=btn.textContent;btn.textContent='✅ Link copied';setTimeout(()=>btn.textContent=t,1800)}catch(e){prompt('Copy this link:',url)}}

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='lesson-'+L.book+'-'+L.id;let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const scored=L.practice.map((a,i)=>i).filter(i=>L.practice[i].type!=='reflect');
function stars(){const n=scored.filter(i=>done[i]).length;$('stars').textContent=n===scored.length?'🌟 Lesson complete! '+'⭐'.repeat(n):'Progress: '+'⭐'.repeat(n)+'☆'.repeat(scored.length-n)}
function complete(i,box){if(!done[i]){done[i]=1;save()}box.classList.add('done');box.querySelector('.badge').textContent='✅ Done';box.querySelector('.again').hidden=false;stars()}
let audio=null,clipRaf=0;
function play(url,btn,clip){try{if(audio)audio.pause();cancelAnimationFrame(clipRaf);audio=new Audio(url);
  if(clip){audio.addEventListener('loadedmetadata',()=>{audio.currentTime=clip[0]/1000},{once:true});
    const stop=()=>{if(audio.currentTime*1000>=clip[1]){audio.pause();btn.classList&&btn.classList.remove('playing');return}clipRaf=requestAnimationFrame(stop)};audio.addEventListener('playing',()=>{clipRaf=requestAnimationFrame(stop)},{once:true})}
  audio.addEventListener('ended',()=>btn.classList&&btn.classList.remove('playing'));
  audio.play().catch(()=>{btn.textContent='⚠️ No sound – check your internet'})}catch(e){}}
/* ---------- learn ---------- */
const IMG=u=>(L.img_base||'../')+u;   // pictures live in lessons/<book>/img/ (or L.img_base)
const AR=/[\u0600-\u06FF]/,ONLY=/^[\u0600-\u06FF\s]{1,8}$/,tx=t=>AR.test(t)?`<span class="arq${ONLY.test(t)?' glyph':''}" lang="ar">${esc(t)}</span>`:esc(t);   // a letter or two on its own is centred like the big letters
function quran(q){return `<div class="quran">${esc(q.text)}<span class="ref">— Qur’an, ${esc(q.ref)}</span></div>`}
$('learn').innerHTML=L.learn.map(b=>{
  if(b.type==='phrase')return `<div class="phrase"><div class="lbl">${esc(b.label)}</div><div class="ar" lang="ar">${b.ar}</div><div class="tr">${esc(b.tr)}</div><div class="en">${esc(b.en)}</div>`+
    (b.audio?`<button class="btn g" data-audio="${b.audio}">🔊 Listen</button>`:'')+`</div>`;
  if(b.type==='text')return `<p>${b.html}</p>`;
  if(b.type==='heading')return `<h3>${esc(b.text)}</h3>`;
  if(b.type==='quran')return quran(b);
  if(b.type==='list')return `<ul class="list">${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.type==='cards')return `<div class="cards">${b.items.map(c=>`<div class="card">`+(c.imgs?`<div class="pics">${c.imgs.map(u=>`<img src="${IMG(u)}" alt="" loading="lazy">`).join('')}</div>`:`<span class="i">${c.icon}</span>`)+`${esc(c.label)}</div>`).join('')}</div>`;
  if(b.type==='image')return `<figure class="${b.small?'small':''}"><img src="${IMG(b.src)}" alt="${esc(b.alt)}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;
  if(b.type==='letter')return `<div class="letter"><div class="big glyph" lang="ar">${b.ch}</div><div><div class="nm">${esc(b.name)}</div><div class="bs">Bosnian name: ${esc(b.bs)}</div>`+
    `<div class="forms">${b.forms.map(([lab,f])=>`<div class="${f?'':'na'}"><span class="f${f?' glyph':''}" lang="ar">${f||'–'}</span><small>${lab}</small></div>`).join('')}</div>`+
    (b.joins?'':`<div class="note">${esc(b.name)} never joins to the letter after it.</div>`)+`</div></div>`;
  if(b.type==='rule')return `<div class="letter"><div class="big sign glyph" lang="ar">${b.sign}</div><div><div class="nm">${esc(b.name)}</div><div class="bs">Bosnian name: ${esc(b.bs)}</div><p>${esc(b.short)}</p></div></div>`;
  if(b.type==='tip')return `<div class="tipbox">👂 ${b.html}</div>`;
  if(b.type==='harakat')return `<div class="hk">${b.items.map(([a,t],k)=>`<div><span class="ar glyph" lang="ar">${a}</span><b>${esc(t)}</b><small>${['fatha','kasra','damma'][k]}</small></div>`).join('')}</div>`;
  if(b.type==='words')return `<div class="words">${b.items.map(w=>`<button class="word" data-audio="${w.audio}" data-clip="${w.clip?w.clip.join(','):''}"><span class="ar" lang="ar">${w.ar}</span><b>${esc(w.tr)}</b><i>“${esc(w.en)}”</i><div class="ref">🔊 Qur’an ${esc(w.key)}</div></button>`).join('')}</div>`;
  if(b.type==='video')return `<a class="video" href="https://www.youtube.com/watch?v=${b.id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${b.id}/mqdefault.jpg" alt="" loading="lazy"><span><b>▶ ${esc(b.title)}</b>${esc(b.note)}</span></a>`;
  if(b.type==='point')return `<div class="point"><b class="t">${esc(b.title)}</b><div>${b.html}</div>${b.quran?quran(b.quran):''}</div>`;
  return ''}).join('');
document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.word.playing').forEach(x=>x.classList.remove('playing'));if(b.classList.contains('word'))b.classList.add('playing');play(b.dataset.audio,b,b.dataset.clip?b.dataset.clip.split(',').map(Number):null)});
/* ---------- practice ---------- */
const P=$('practice');
L.practice.forEach((a,i)=>{const box=document.createElement('div');box.className='act';box.dataset.type=a.type;box.id='act'+i;
  box.innerHTML=`<h3><span>${esc(a.title)}</span><span class="badge">${a.type==='reflect'?'':'⭐ to earn'}</span></h3>`+(a.prompt?`<p class="prompt">${esc(a.prompt)}</p>`:'')+'<div class="body"></div>'+
    '<p class="again-row"><button class="btn again" hidden>🔁 Play again</button></p>';
  P.appendChild(box);
  // Play again: start this activity fresh as often as you like – stars already earned are kept
  const run=()=>{const body=box.querySelector('.body');body.innerHTML='';({order,choose_all,quiz,memory,sort,reflect,find})[a.type](a,body,()=>complete(i,box))};
  box.querySelector('.again').onclick=()=>{run();box.scrollIntoView({block:'start',behavior:'smooth'})};run();
  if(done[i]&&a.type!=='reflect'){box.classList.add('done');box.querySelector('.badge').textContent='✅ Done';box.querySelector('.again').hidden=false}});
function order(a,el,finish){let next=0;const long=a.items.some(x=>x.length>22);
  el.innerHTML=`<div class="built ${long?'col':''}"></div><div class="pool ${long?'col':''}"></div><div class="fb"></div><button class="btn" hidden>🔁 Again</button>`;
  const built=el.querySelector('.built'),pool=el.querySelector('.pool'),fb=el.querySelector('.fb'),again=el.querySelector('button');
  function start(){next=0;built.innerHTML='';fb.textContent='';fb.className='fb';again.hidden=true;
    pool.innerHTML=shuffle(a.items.map((t,k)=>({t,k}))).map(x=>`<button class="chip" data-k="${x.k}">${tx(x.t)}</button>`).join('');
    pool.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(+c.dataset.k===next){c.classList.add('placed');built.appendChild(c);c.onclick=null;next++;
      fb.className='fb ok';fb.textContent=next===a.items.length?'🌟 Well done – all in the right order!':'✓ Correct!';if(next===a.items.length){again.hidden=false;finish()}}
      else{c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');fb.className='fb bad';fb.textContent='Not yet – which one comes next?'}})}
  again.onclick=start;start()}
function choose_all(a,el,finish){el.innerHTML=`<div class="opts">${a.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div><div class="fb"></div><button class="btn g">✔ Check</button>`;
  const opts=[...el.querySelectorAll('.opt')],fb=el.querySelector('.fb');
  opts.forEach(b=>b.onclick=()=>{b.classList.toggle('sel');opts.forEach(x=>x.classList.remove('ok','bad'));el.querySelectorAll('.why').forEach(w=>w.remove());fb.textContent=''});
  el.querySelector('.btn').onclick=()=>{let right=0,wrong=0,missed=0;el.querySelectorAll('.why').forEach(w=>w.remove());
    opts.forEach((b,k)=>{const o=a.options[k],sel=b.classList.contains('sel');
      if(sel&&o.correct){b.classList.add('ok');right++}else if(sel&&!o.correct){b.classList.add('bad');wrong++;if(o.why)b.insertAdjacentHTML('beforeend',`<div class="why">${esc(o.why)}</div>`)}else if(o.correct)missed++});
    if(!wrong&&!missed){fb.className='fb ok';fb.textContent='🌟 Excellent – all correct!';finish()}
    else{fb.className='fb bad';fb.textContent=wrong?'Some of your choices are not right – read why, then try again.':'Good so far – there are '+missed+' more to find!'}}}
function quiz(a,el,finish){let n=0,score=0,qs=[];
  function start(){qs=shuffle(a.questions);n=0;score=0;show()}
  function show(){if(n>=qs.length){el.innerHTML=`<div class="done-msg">You got ${score} of ${qs.length} right ${score===qs.length?'🌟':'👍'}</div><p style="text-align:center"><button class="btn">🔁 Try again</button></p>`;
      el.querySelector('.btn').onclick=start;if(score>=Math.ceil(qs.length*0.75))finish();return}
    const q=qs[n],opts=shuffle(q.options.map((t,k)=>({t,k})));
    el.innerHTML=`<div class="qn">${n+1}/${qs.length}. ${esc(q.q)}</div><div class="opts">${opts.map(o=>`<button class="opt" data-k="${o.k}">${tx(o.t)}</button>`).join('')}</div><div class="fb"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.answer;el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');if(ok)score++;const fb=el.querySelector('.fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ Correct!':'✗ The right answer is marked green.';
      setTimeout(()=>{n++;show()},ok?900:1800)})}
  start()}
function memory(a,el,finish){let first=null,lock=false,found=0;
  const cards=shuffle(a.pairs.flatMap((p,k)=>[{k,t:p[0]},{k,t:p[1]}]));
  el.innerHTML=`<div class="mem">${cards.map((c,j)=>`<button class="mc" data-k="${c.k}" data-j="${j}">❓</button>`).join('')}</div><div class="fb"></div>`;
  const fb=el.querySelector('.fb');
  el.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{if(lock||b===first||b.classList.contains('got'))return;b.classList.add('open');b.innerHTML=tx(cards[+b.dataset.j].t);
    if(!first){first=b;return}
    if(first.dataset.k===b.dataset.k){first.classList.add('got');b.classList.add('got');first=null;found++;fb.className='fb ok';fb.textContent='✓ A pair!';
      if(found===a.pairs.length){fb.textContent='🌟 All pairs found!';finish()}}
    else{lock=true;const f=first;first=null;setTimeout(()=>{[f,b].forEach(x=>{x.classList.remove('open');x.textContent='❓'});lock=false},900)}})}
function sort(a,el,finish){let n=0,score=0,items=[];
  function start(){items=shuffle(a.items);n=0;score=0;show()}
  function show(){if(n>=items.length){el.innerHTML=`<div class="done-msg">${score} of ${items.length} right ${score===items.length?'🌟':'👍'}</div><p style="text-align:center"><button class="btn">🔁 Try again</button></p>`;
      el.querySelector('.btn').onclick=start;if(score===items.length)finish();return}
    el.innerHTML=`<div class="sortq">${tx(items[n].text)}</div><div class="bins">${a.bins.map((b,k)=>`<button class="btn g" data-b="${k}">${esc(b)}</button>`).join('')}</div><div class="fb"></div>`;
    el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.b===items[n].bin;if(ok)score++;el.querySelectorAll('[data-b]').forEach(x=>x.disabled=true);
      const fb=el.querySelector('.fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ Correct!':'✗ It is '+a.bins[items[n].bin]+'.';setTimeout(()=>{n++;show()},ok?800:1600)})}
  start()}
function find(a,el,finish){const need=a.cells.filter(c=>c===a.target).length;let got=0;
  el.innerHTML=`<div class="grid">${a.cells.map((c,k)=>`<button class="cell glyph" data-k="${k}" lang="ar">${c}</button>`).join('')}</div><div class="fb"></div>`;const fb=el.querySelector('.fb');
  el.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;if(a.cells[+b.dataset.k]===a.target){b.classList.add('ok');got++;fb.className='fb ok';
    fb.textContent=got===need?'🌟 You found all of them!':'✓ Found '+got+' of '+need;if(got===need)finish()}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');fb.className='fb bad';fb.textContent='That is a different letter – look again!'}})}
function reflect(a,el){el.innerHTML=(a.img?`<img class="reflect-pic" src="${IMG(a.img)}" alt="" loading="lazy">`:'')+`<ul class="reflect">${a.prompts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`}
/* ---------- header, nav ---------- */
const ROOT=L.root||'../../../';
// Shared pages show only their own section (no link to Home), so a shared link doesn't open the whole curriculum.
$('topnav').innerHTML=[['🔤 Sufara','sufara/','sufara'],['📚 Lessons','lessons/','lessons']].filter(x=>x[2]===L.section).map(([t,h,sec])=>`<a href="${ROOT+h}" class="${sec&&sec===L.section?'on':''}">${t}</a>`).join('');
$('crumbs').innerHTML=(L.crumbs||[['📚 Lessons',ROOT+'lessons/'],[L.book_title,null]]).map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:esc(t)).join(' › ');
$('tag').textContent=L.tag||(L.book_title+' • Lesson '+L.number);$('title').textContent=L.title;$('intro').textContent=L.intro;
$('source').textContent=L.footer||('Adapted into English from '+L.source+', pages '+L.pages+'. Qur’an translation: Sahih International.');
$('nav').innerHTML=(L.prev?`<a href="../${L.prev.id}/">◀ ${esc(L.prev.title)}</a>`:'<span></span>')+(L.next?`<a href="../${L.next.id}/">${esc(L.next.title)} ▶</a>`:'<span></span>');
document.getElementById('share').onclick=e=>copyLink(L.book==='sufara'?`sufara/${L.id}/`:`lessons/${L.book}/${L.id}/`,e.currentTarget);
stars();
/* ---------- Arabic letters: centre each glyph's drawn shape in its box (Amiri Quran sits letters on a baseline,
   so tails like ج ع م hang far below and tall letters float high) ---------- */
function glyphs(root){const c=glyphs.c||(glyphs.c=document.createElement('canvas').getContext('2d'));
  (root||document).querySelectorAll('.glyph').forEach(el=>{let s=el.firstElementChild;
    if(!s||!s.classList.contains('gi')){s=document.createElement('span');s.className='gi';s.textContent=el.textContent;el.textContent='';el.append(s)}
    const cs=getComputedStyle(s),fs=parseFloat(cs.fontSize);c.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;c.direction='rtl';c.textAlign='left';
    const m=c.measureText(s.textContent),base=(fs-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent;
    s.style.left='calc(50% - '+(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2+'px)';
    s.style.top='calc(50% - '+(base-(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2)+'px)';
    const iw=m.actualBoundingBoxRight+m.actualBoundingBoxLeft+16;if(getComputedStyle(el).display==='inline-block')el.style.width=iw+'px';else el.style.minWidth=iw+'px'})}
glyphs();if(document.fonts){document.fonts.ready.then(()=>glyphs());document.fonts.addEventListener('loadingdone',()=>glyphs())}
addEventListener('resize',()=>glyphs());
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&!n.classList.contains('gi')&&(n.matches('.glyph')||n.querySelector('.glyph')))glyphs(n.parentNode||n)}).observe(document.body,{childList:true,subtree:true});
window.LESSON={L,done:()=>({...done})};
</script></main></body></html>
